function render(){count.textContent=`${S.items.length.toLocaleString('fa-IR')} محتوا`;if(!S.items.length){grid.innerHTML='<div class="empty">هنوز چیزی برای نمایش پیدا نشد.<br>یک موضوع دیگر را جست‌وجو کن یا دوباره تازه‌سازی کن.</div>';return}grid.innerHTML=S.items.map((i,n)=>{const[g1,g2]=palette(i),type=kind(i),embedded=!poster(i)&&!asset(i)&&!!embed(i);return`<article class="card ${cls(i,n)} ${embedded?'embedded':''}" data-i="${n}" style="--g1:${g1};--g2:${g2}" tabindex="0" role="button" aria-label="مشاهده ${esc(txt(i))}">${mediaTag(i,type)}<div class="shade"></div><span class="type">${icon(type)}</span><span class="rank">${(n+1).toLocaleString('fa-IR')}</span><span class="freshness">تازه</span><button class="save ${i.is_saved?'saved':''}" data-save="${n}" aria-label="ذخیره">${i.is_saved?'♥':'♡'}</button><div class="copy"><div class="channel"><span class="avatar">${esc(channel(i).slice(0,1))}</span>${esc(channel(i))}</div><div class="title">${esc(txt(i))}</div><div class="meta">${esc(type)}<span>•</span>${esc(date(i.published_at||i.date))}</div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(c=>{const open=e=>{if(!e.target.closest('[data-save]'))show(S.items[+c.dataset.i])};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e)}}});grid.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();saveItem(S.items[+b.dataset.save],b)})}
function activeNav(mode){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));const b=mode==='search'?$('focusSearch'):document.querySelector(`[data-nav="${mode==='explore'?'explore':'feed'}"]`);b?.classList.add('active')}
function openSearch(){clearTimeout(timer);S.request?.abort();S.request=null;S.loading=false;S.mode='search';document.body.className='mode-search';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));activeNav('search');heading.textContent='جست‌وجو';count.textContent='موضوعت را بنویس';if(!search.value.trim())grid.innerHTML='<div class="empty">نام موضوع، کانال یا چیزی که دنبالش هستی را بنویس.</div>';setTimeout(()=>{search.focus();try{search.setSelectionRange(search.value.length,search.value.length)}catch{}},60)}
async function load(mode=S.mode){clearTimeout(timer);S.request?.abort();const controller=new AbortController();S.request=controller;S.loading=true;S.mode=mode;const views={feed:{title:'برای تو',sub:'انتخاب‌هایی که به سلیقه‌ات نزدیک‌ترند',glyph:'✦',heading:'منتخب برای تو',path:'/feed?limit=30'},trending:{title:'نبض امروز',sub:'پست‌هایی که همین حالا بیشتر دیده می‌شوند',glyph:'↗',heading:'داغ‌ترین‌های امروز',path:'/trending?limit=30'},fresh:{title:'تازه رسیده‌ها',sub:'قبل از همه، کشف‌های تازه را ببین',glyph:'◌',heading:'کشف‌های تازه',path:'/explore?limit=30'},explore:{title:'اکسپلور',sub:'',glyph:'◈',heading:'اکسپلور',path:'/explore?limit=36'}},v=views[mode]||views.feed;document.body.className=`mode-${mode}`;$('discoverTitle').textContent=v.title;$('discoverSub').textContent=v.sub;$('discoverGlyph').textContent=v.glyph;heading.textContent=v.heading;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));activeNav(mode);sk();try{const d=await api(v.path,{signal:controller.signal});S.items=d.items||d.results||[];render();status.textContent='آنلاین';status.classList.add('online')}catch(e){if(e.name!=='AbortError'){grid.innerHTML=`<div class="empty">ارتباط برقرار نشد.<br><small>${esc(e.message)}</small></div>`;status.textContent='نیاز به اتصال';status.classList.remove('online')}}finally{if(S.request===controller){S.loading=false;S.request=null}}}
async function doSearch(q){q=q.trim();if(!q)return openSearch();clearTimeout(timer);S.request?.abort();const controller=new AbortController();S.request=controller;S.loading=true;S.mode='search';document.body.className='mode-search';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));activeNav('search');sk();heading.textContent=`نتایج «${q}»`;count.textContent='در حال جست‌وجو';try{const d=await api(`/search?q=${encodeURIComponent(q)}&limit=30`,{signal:controller.signal});S.items=d.items||d.results||[];render();status.textContent=d.source==='telegram_live'?'جست‌وجوی زنده':'نتایج هوشمند';status.classList.add('online')}catch(e){if(e.name!=='AbortError')grid.innerHTML=`<div class="empty">جست‌وجو انجام نشد.<br><small>${esc(e.message)}</small></div>`}finally{if(S.request===controller){S.loading=false;S.request=null}}}
async function saveItem(i,b){if(i.is_saved)return toast('قبلاً ذخیره شده');try{await api('/save',{method:'POST',body:JSON.stringify({content_id:i.content_id||i.id})});i.is_saved=true;if(b){b.classList.add('saved');b.textContent='♥'}$('viewerSave').textContent='♥';toast('به ذخیره‌ها اضافه شد');haptic('medium')}catch{toast('ذخیره انجام نشد')}}
function show(i){S.current=i;const[a,b]=palette(i),t=kind(i),p=poster(i),m=asset(i),e=embed(i),img=t==='VIDEO'?p:(p||m),video=t==='VIDEO'&&m;$('viewerMedia').style.setProperty('--vg1',a);$('viewerMedia').style.setProperty('--vg2',b);$('viewerImage').hidden=!!video||!img;if(img&&!video)$('viewerImage').src=img;$('viewerVideo').hidden=!video;if(video){$('viewerVideo').src=m;$('viewerVideo').poster=p||''}$('viewerEmbed').hidden=!!(img||video||!e);if(!img&&!video&&e)$('viewerEmbed').src=e;$('viewerTitle').textContent=txt(i);$('viewerChannel').textContent=channel(i);$('viewerAvatar').textContent=channel(i).slice(0,1);$('viewerMeta').textContent=date(i.published_at||i.date);$('viewerDesc').textContent=i.description||i.text||i.message||i.title||'';$('viewerSave').textContent=i.is_saved?'♥':'♡';$('back').classList.add('show');$('viewer').classList.add('show');document.body.style.overflow='hidden';haptic();api('/events',{method:'POST',body:JSON.stringify({content_id:i.content_id||i.id,event_type:'open'})}).catch(()=>{})}function hide(){$('back').classList.remove('show');$('viewer').classList.remove('show');$('viewerVideo').pause();$('viewerVideo').removeAttribute('src');$('viewerImage').removeAttribute('src');$('viewerEmbed').removeAttribute('src');document.body.style.overflow='';S.current=null}async function feedback(t){if(!S.current)return;const cur=S.current;try{await api('/feedback',{method:'POST',body:JSON.stringify({content_id:cur.content_id||cur.id,creator_id:cur.creator_id,feedback_type:t})});S.items=S.items.filter(x=>x!==cur);hide();render();toast('بازخوردت ثبت شد')}catch{toast('بازخورد ثبت نشد')}}
let timer;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{haptic();load(b.dataset.mode)});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{haptic();load(b.dataset.nav)});$('searchAction').onclick=()=>doSearch(search.value);search.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>doSearch(search.value),500)};search.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doSearch(search.value)}};$('focusSearch').onclick=()=>{haptic();openSearch()};$('saved').onclick=()=>toast('صفحه ذخیره‌ها در مرحله بعد فعال می‌شود');$('back').onclick=hide;$('viewerClose').onclick=hide;document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});$('viewerSave').onclick=()=>S.current&&saveItem(S.current,$('viewerSave'));$('openTelegram').onclick=()=>{const u=safe(S.current?.source_url||S.current?.url||S.current?.link);if(!u)return toast('لینک این پست در دسترس نیست');try{tg?.openTelegramLink?.(u)||window.open(u,'_blank','noopener')}catch{window.open(u,'_blank','noopener')}};$('notInterested').onclick=()=>feedback('not_interested');document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedback(b.dataset.feedback));load('feed')})();
</script>
