/* =========================================================
   CONFIG
========================================================= */

const DISCOVERY_API_URL =
  window.location.origin + "/api/discovery";

const TELEGRAM_API_URL =
  window.location.origin + "/api/telegram";


/* =========================================================
   TELEGRAM WEB APP
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const feedEl =
  document.getElementById("feed");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const feedBtn =
  document.getElementById("feedBtn");

const trendBtn =
  document.getElementById("trendBtn");

const exploreBtn =
  document.getElementById("exploreBtn");


/* =========================================================
   STATE
========================================================= */

let currentMode = "feed";

let feedItems = [];

let currentUser = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent = text;

  statusEl.className =
    "status" +
    (type
      ? " " + type
      : "");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   TELEGRAM INIT
========================================================= */

function initTelegram() {

  if (!tg) {

    setStatus(
      "⚠️ این برنامه باید داخل Telegram باز شود",
      "error"
    );

    return false;
  }

  try {

    tg.ready();

    tg.expand();

    try {

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#f4f6f8");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#f4f6f8");
      }

      if (tg.setBottomBarColor) {
        tg.setBottomBarColor("#f4f6f8");
      }

    } catch (_) {}

    document.documentElement.style.background =
      "#f4f6f8";

    document.body.style.background =
      "#f4f6f8";

    document.body.style.color =
      "#111827";

    return true;

  } catch (error) {

    console.error(
      "Telegram init:",
      error
    );

    setStatus(
      "⚠️ Telegram WebApp آماده نشد",
      "error"
    );

    return false;
  }
}


/* =========================================================
   GENERIC API REQUEST
========================================================= */

async function requestApi(
  baseUrl,
  path,
  options = {}
) {

  const headers = {
    ...(options.headers || {})
  };

  if (
    !headers["Content-Type"] &&
    options.body
  ) {

    headers["Content-Type"] =
      "application/json";
  }

  const initData =
    tg?.initData || "";

  if (initData) {

    headers["X-Telegram-Init-Data"] =
      initData;
  }

  const controller =
    new AbortController();

  const timeoutId =
    setTimeout(() => {

      controller.abort();

    }, 15000);

  try {

    const response =
      await fetch(
        baseUrl + path,
        {
          ...options,
          headers,
          signal:
            controller.signal
        }
      );

    const raw =
      await response.text();

    let data = {};

    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (_) {

      data = {
        message: raw
      };
    }

    if (!response.ok) {

      const error =
        new Error(
          data.error ||
          data.message ||
          `HTTP ${response.status}`
        );

      error.status =
        response.status;

      error.data =
        data;

      throw error;
    }

    return data;

  } catch (error) {

    if (
      error?.name ===
      "AbortError"
    ) {

      throw new Error(
        "اتصال به سرور بیش از ۱۵ ثانیه طول کشید."
      );
    }

    throw error;

  } finally {

    clearTimeout(
      timeoutId
    );
  }
}


/* =========================================================
   DISCOVERY API
========================================================= */

async function discoveryApi(
  path,
  options = {}
) {

  return requestApi(
    DISCOVERY_API_URL,
    path,
    options
  );
}


/* =========================================================
   TELEGRAM API
========================================================= */

async function telegramApi(
  path,
  options = {}
) {

  return requestApi(
    TELEGRAM_API_URL,
    path,
    options
  );
}


/* =========================================================
   BACKEND HEALTH
========================================================= */

async function checkBackend() {

  try {

    const result =
      await discoveryApi(
        "/health"
      );

    console.log(
      "Discovery API health:",
      result
    );

    return result?.ok === true;

  } catch (error) {

    console.error(
      "Backend health:",
      error
    );

    return false;
  }
}


/* =========================================================
   TELEGRAM SERVER HEALTH
========================================================= */

async function checkTelegramServer() {

  try {

    const result =
      await telegramApi(
        "/health"
      );

    console.log(
      "Telegram server health:",
      result
    );

    return result?.ok === true;

  } catch (error) {

    console.error(
      "Telegram server health:",
      error
    );

    return false;
  }
}


/* =========================================================
   TELEGRAM AUTH
========================================================= */

async function authenticateTelegram() {

  if (!tg?.initData) {

    setStatus(
      "⚠️ اطلاعات Telegram در دسترس نیست",
      "error"
    );

    return false;
  }

  try {

    const result =
      await discoveryApi(
        "/auth/telegram",
        {
          method: "POST",

          body: JSON.stringify({
            initData:
              tg.initData
          })
        }
      );

    console.log(
      "Telegram authentication:",
      result
    );

    if (
      result?.authenticated &&
      result.user
    ) {

      currentUser =
        result.user;

      return true;
    }

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );

    return false;

  } catch (error) {

    console.error(
      "Telegram auth:",
      error
    );

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );

    return false;
  }
}


/* =========================================================
   ACTIVE TAB
========================================================= */

function setActiveTab(
  mode
) {

  feedBtn.classList.toggle(
    "active",
    mode === "feed"
  );

  trendBtn.classList.toggle(
    "active",
    mode === "trending"
  );

  exploreBtn.classList.toggle(
    "active",
    mode === "explore"
  );
}


/* =========================================================
   NORMALIZE DISCOVERY ITEM
========================================================= */

function normalizeDiscoveryItem(
  item
) {

  return {

    id:
      item.id ||
      item.content_id ||
      "",

    title:
      item.title ||
      "بدون عنوان",

    description:
      item.description ||
      item.text_content ||
      "توضیحی برای این محتوا ثبت نشده است.",

    source_url:
      item.source_url ||
      item.url ||
      "",

    content_type:
      item.content_type ||
      "content",

    creator_name:
      item.creator_name ||
      item.creator_username ||
      "",

    score:
      Number(
        item.score ??
        item.final_score ??
        0
      ),

    reason:
      item.reason ||
      "",

    is_saved:
      item.is_saved === true ||
      item.is_saved === 1 ||
      item.is_saved === "true" ||
      item.is_saved === "1",

    source:
      "discovery"
  };
}


/* =========================================================
   NORMALIZE TELEGRAM RESULT
========================================================= */

function normalizeTelegramItem(
  item,
  index
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const text =
    item?.text ??
    item?.message ??
    item?.rawText ??
    "";

  const username =
    item?.channel_username ??
    item?.chat_username ??
    item?.username ??
    "";

  const title =
    item?.channel_title ??
    item?.title ??
    username ??
    "Telegram";

  const channelUrl =
    item?.channel_url ??
    (
      username
        ? `https://t.me/${username}`
        : ""
    );

  const messageUrl =
    item?.message_url ??
    item?.link ??
    item?.url ??
    "";

  return {

    id:
      String(
        item?.id ??
        item?.result_id ??
        `telegram-${index}`
      ),

    result_type:
      isChannel
        ? "channel"
        : "telegram_message",

    telegram_message_id:
      item?.telegram_message_id ??
      (
        !isChannel
          ? item?.id ?? null
          : null
      ),

    title,

    description:

      isChannel

        ? (
            item?.description ||
            "کانال تلگرام"
          )

        : (
            text.trim() ||
            (
              item?.has_media
                ? "📎 این پست شامل رسانه است."
                : "این پست متن قابل نمایش ندارد."
            )
          ),

    source_url:
      isChannel
        ? channelUrl
        : messageUrl,

    channel_url:
      channelUrl,

    message_url:
      messageUrl,

    content_type:
      isChannel
        ? "telegram-channel"
        : "telegram",

    creator_name:
      username
        ? "@" + username
        : "",

    score:
      Number(
        item?.search_score ??
        item?.score ??
        0
      ),

    reason:
      isChannel
        ? "telegram_channel_search"
        : "telegram_global_search",

    is_saved:
      false,

    source:
      "telegram",

    channel_username:
      username,

    channel_title:
      title,

    chat_id:
      item?.chat_id ??
      item?.channel_peer_id ??
      null,

    channel_peer_id:
      item?.channel_peer_id ??
      null,

    date:
      item?.date ??
      null,

    has_media:
      Boolean(
        item?.has_media
      )
  };
}


/* =========================================================
   LOAD DISCOVERY FEED
========================================================= */

async function loadFeed(
  mode = "feed"
) {

  currentMode =
    mode;

  setActiveTab(
    mode
  );

  setStatus(
    "در حال دریافت محتوا..."
  );

  feedEl.innerHTML =
    '<div class="empty">در حال بارگذاری...</div>';

  try {

    let result;

    if (
      mode ===
      "feed"
    ) {

      result =
        await discoveryApi(
          "/feed?limit=20"
        );

    } else if (
      mode ===
      "trending"
    ) {

      result =
        await discoveryApi(
          "/trending?limit=20"
        );

    } else {

      result =
        await discoveryApi(
          "/explore?limit=20"
        );
    }

    console.log(
      "Discovery response:",
      result
    );

    feedItems =
      Array.isArray(
        result?.items
      )

        ? result.items.map(
            normalizeDiscoveryItem
          )

        : [];

    renderFeed();

    setStatus(

      feedItems.length

        ? `🟢 ${feedItems.length} محتوا آماده است`

        : "🟡 هنوز محتوایی برای نمایش پیدا نشد",

      feedItems.length
        ? "success"
        : ""
    );

  } catch (error) {

    console.error(
      "Discovery feed:",
      error
    );

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          دریافت محتوا ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            error.message ||
            "خطای نامشخص"
          )}
        </div>

      </div>

    `;

    setStatus(
      "🔴 خطا در دریافت محتوا",
      "error"
    );
  }
}


/* =========================================================
   TELEGRAM GLOBAL SEARCH
========================================================= */

async function doTelegramSearch() {

  const query =
    searchInput.value.trim();

  if (!query) {

    setStatus(
      "عبارت جستجو را وارد کن"
    );

    searchInput.focus();

    return;
  }

  if (
    query.length > 200
  ) {

    setStatus(
      "🔴 عبارت جستجو بیش از حد طولانی است",
      "error"
    );

    return;
  }

  currentMode =
    "telegram-search";

  feedBtn.classList.remove(
    "active"
  );

  trendBtn.classList.remove(
    "active"
  );

  exploreBtn.classList.remove(
    "active"
  );

  searchBtn.disabled =
    true;

  setStatus(
    "🔎 در حال جستجوی آنلاین در Telegram..."
  );

  feedEl.innerHTML = `

    <div class="empty">
      🔎 در حال جستجوی واقعی در Telegram...<br>
      لطفاً چند لحظه صبر کن.
    </div>

  `;

  try {

    const result =
      await telegramApi(
        "/search?q=" +
        encodeURIComponent(
          query
        ) +
        "&limit=20"
      );

    console.log(
      "Telegram Search response:",
      result
    );

    if (
      result?.ok !== true
    ) {

      throw new Error(
        result?.error ||
        "Telegram search failed"
      );
    }

    const telegramResults =
      Array.isArray(
        result?.results
      )
        ? result.results
        : [];

    feedItems =
      telegramResults.map(
        normalizeTelegramItem
      );

    renderFeed();

    if (
      feedItems.length
    ) {

      setStatus(
        `🟢 ${feedItems.length} نتیجه واقعی از Telegram برای «${query}»`,
        "success"
      );

    } else {

      setStatus(
        `🟡 برای «${query}» نتیجه‌ای در Telegram پیدا نشد`
      );
    }

  } catch (error) {

    console.error(
      "Telegram global search:",
      error
    );

    const status =
      error?.status;

    let message =
      error?.message ||
      "Telegram search failed";

    if (
      status === 401
    ) {

      message =
        "نشست Telegram معتبر نیست یا حساب مجاز نیست.";

    } else if (
      status === 404
    ) {

      message =
        "مسیر جستجوی Telegram روی Worker پیدا نشد. Worker را دوباره Deploy کن.";

    } else if (
      status === 502
    ) {

      message =
        "Worker نتوانست به سرویس مقصد متصل شود.";
    }

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          جستجو ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            message
          )}
        </div>

        ${
          status
            ? `
              <div style="margin-top:8px;font-size:12px;opacity:.65">
                HTTP ${escapeHtml(status)}
              </div>
            `
            : ""
        }

      </div>

    `;

    setStatus(
      "🔴 خطا در جستجوی Telegram",
      "error"
    );

  } finally {

    searchBtn.disabled =
      false;
  }
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed() {

  if (!feedItems.length) {

    feedEl.innerHTML = `

      <div class="empty">

        هنوز محتوایی برای نمایش
        وجود ندارد.

      </div>

    `;

    return;
  }

  feedEl.innerHTML =
    feedItems.map(
      (item, index) => {

        if (
          item.source ===
          "telegram"
        ) {

          return renderTelegramCard(
            item,
            index
          );
        }

        return renderDiscoveryCard(
          item,
          index
        );
      }
    ).join("");
}


/* =========================================================
   RENDER TELEGRAM CARD
   (چیپ‌ها برای کارت‌های کوچیک‌تر گرید جمع‌وجورتر شدند)
========================================================= */

function renderTelegramCard(
  item,
  index
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const title =
    escapeHtml(
      item?.channel_title ||
      item?.title ||
      "Telegram"
    );

  const username =
    item?.channel_username
      ? "@" +
        item.channel_username
      : "";

  const description =
    escapeHtml(
      item?.description ||
      (
        isChannel
          ? "کانال تلگرام"
          : "این پست متن قابل نمایش ندارد."
      )
    );

  const channelUrl =
    item?.channel_url ||
    (
      item?.channel_username
        ? `https://t.me/${item.channel_username}`
        : ""
    );

  const messageUrl =
    item?.message_url ||
    item?.source_url ||
    "";

  const targetUrl =
    isChannel
      ? channelUrl
      : messageUrl;

  return `

    <article
      class="card telegram-card"
    >

      <h2>
        ${title}
      </h2>

      <p>
        ${description}
      </p>

      <div class="meta">

        <span
          class="chip telegram"
        >
          Telegram
        </span>

        ${
          username
            ? `
              <span class="chip">
                ${escapeHtml(username)}
              </span>
            `
            : ""
        }

      </div>

      ${
        targetUrl

          ? `

            <div class="actions single">

              <button
                class="action primary"
                data-url="${escapeHtml(
                  targetUrl
                )}"
                onclick="
                  openTelegramContent(
                    this.dataset.url
                  )
                "
              >

                ${
                  isChannel
                    ? "📢 ورود به کانال"
                    : "🔗 مشاهده پست"
                }

              </button>

            </div>

          `

          : `

            <div class="actions single">

              <button
                class="action"
                disabled
              >
                لینک در دسترس نیست
              </button>

            </div>

          `
      }

    </article>

  `;
}


/* =========================================================
   RENDER DISCOVERY CARD
   (دکمه‌ها فقط آیکون شدند تا در کارت باریک‌تر جا شوند)
========================================================= */

function renderDiscoveryCard(
  item,
  index
) {

  const id =
    escapeHtml(
      item.id
    );

  const url =
    escapeHtml(
      item.source_url
    );

  const saved =
    item.is_saved === true;

  const saveClass =
    saved
      ? " saved"
      : "";

  const saveText =
    saved
      ? "✅"
      : "⭐";

  return `

    <article class="card">

      <h2>
        ${escapeHtml(
          item.title
        )}
      </h2>

      <p>
        ${escapeHtml(
          item.description
        )}
      </p>

      <div class="meta">

        <span class="chip">
          ${escapeHtml(
            item.content_type
          )}
        </span>

        ${
          item.creator_name
            ? `
              <span class="chip">
                ${escapeHtml(
                  item.creator_name
                )}
              </span>
            `
            : ""
        }

      </div>

      <div class="actions">

        ${
          url
            ? `

              <button
                class="action primary"
                data-id="${id}"
                data-url="${url}"
                onclick="
                  openContent(
                    this.dataset.id,
                    this.dataset.url
                  )
                "
              >
                🔗
              </button>

            `
            : `

              <button
                class="action"
                disabled
              >
                —
              </button>

            `
        }

        <button
          class="action${saveClass}"
          data-id="${id}"
          onclick="
            saveContent(
              this.dataset.id
            )
          "
        >
          ${saveText}
        </button>

        <button
          class="action"
          data-id="${id}"
          onclick="
            notInterested(
              this.dataset.id
            )
          "
        >
          👎
        </button>

      </div>

    </article>

  `;
}


/* =========================================================
   OPEN TELEGRAM CONTENT
========================================================= */

function openTelegramContent(
  url
) {

  if (!url) {
    return;
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   OPEN DISCOVERY CONTENT
========================================================= */

async function openContent(
  contentId,
  url
) {

  if (
    !contentId ||
    !url
  ) {
    return;
  }

  try {

    await discoveryApi(
      "/impression",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          position:
            feedItems.findIndex(
              x =>
                x.id ===
                contentId
            ),

          score:
            feedItems.find(
              x =>
                x.id ===
                contentId
            )?.score || 0,

          reason:
            currentMode

        })
      }
    );

  } catch (error) {

    console.warn(
      "Impression:",
      error
    );
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   SAVE DISCOVERY CONTENT
========================================================= */

async function saveContent(
  contentId
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ذخیره باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }

  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ این نتیجه مستقیماً از Telegram آمده است",
      "info"
    );

    return;
  }

  if (
    item &&
    item.is_saved
  ) {

    setStatus(
      "✅ این محتوا قبلاً ذخیره شده است",
      "success"
    );

    return;
  }

  try {

    await discoveryApi(
      "/save",
      {
        method: "POST",

        body: JSON.stringify({
          content_id:
            contentId
        })
      }
    );

    if (item) {
      item.is_saved = true;
    }

    renderFeed();

    setStatus(
      "⭐ ذخیره شد",
      "success"
    );

  } catch (error) {

    console.error(
      "Save:",
      error
    );

    setStatus(
      "🔴 ذخیره ناموفق بود: " +
      (
        error?.message ||
        ""
      ),
      "error"
    );
  }
}


/* =========================================================
   NOT INTERESTED
========================================================= */

async function notInterested(
  contentId
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ثبت بازخورد باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }

  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ بازخورد برای نتایج مستقیم Telegram فعلاً ثبت نمی‌شود",
      "info"
    );

    return;
  }

  try {

    await discoveryApi(
      "/feedback",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          feedback_type:
            "NOT_INTERESTED"

        })
      }
    );

    setStatus(
      "👍 بازخورد ثبت شد",
      "success"
    );

    feedItems =
      feedItems.filter(
        item =>
          item.id !==
          contentId
      );

    renderFeed();

  } catch (error) {

    console.error(
      "Feedback:",
      error
    );

    setStatus(
      "🔴 ثبت بازخورد ناموفق بود",
      "error"
    );
  }
}


/* =========================================================
   EVENTS
========================================================= */

feedBtn.addEventListener(
  "click",
  () =>
    loadFeed("feed")
);

trendBtn.addEventListener(
  "click",
  () =>
    loadFeed("trending")
);

exploreBtn.addEventListener(
  "click",
  () =>
    loadFeed("explore")
);

searchBtn.addEventListener(
  "click",
  doTelegramSearch
);

searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      doTelegramSearch();
    }

  }
);


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  if (!initTelegram()) {
    return;
  }

  setStatus(
    "🟢 آماده",
    "success"
  );


  /*
   * Auth
   */

  const authenticated =
    await authenticateTelegram();


  if (!authenticated) {

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          احراز هویت Telegram ناموفق بود
        </strong>

        <div>
          برنامه را از داخل Telegram باز کن.
        </div>

      </div>

    `;

    return;
  }


  /*
   * Health checks در پس‌زمینه
   *
   * شکست Health نباید برنامه را متوقف کند.
   */

  checkBackend()
    .then(
      healthy => {

        console.log(
          "Discovery backend health:",
          healthy
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Discovery backend health check:",
          error
        );

      }
    );


  checkTelegramServer()
    .then(
      healthy => {

        console.log(
          "Telegram server health:",
          healthy
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Telegram server health check:",
          error
        );

      }
    );


  /*
   * Feed
   */

  await loadFeed(
    "feed"
  );
}


/* =========================================================
   BOOT
========================================================= */

startApp();

</script></body>
