<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram Discovery</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f4f6f8);
      color: var(--tg-theme-text-color, #111827);
      overflow-x: hidden;
    }

    button, input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }

    .header {
      padding: 8px 2px 16px;
    }

    .brand {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: .68;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: none;
      border-radius: 15px;
      padding: 13px 14px;
      font-size: 15px;
      background: var(--tg-theme-secondary-bg-color, #fff);
      color: var(--tg-theme-text-color, #111827);
    }

    .search button,
    .tab.active,
    .action.primary {
      border: 0;
      background: var(--tg-theme-button-color, #229ed9);
      color: var(--tg-theme-button-text-color, #fff);
    }

    .search button {
      border-radius: 15px;
      padding: 0 17px;
      font-weight: 700;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      border-radius: 14px;
      padding: 13px 7px;
      font-size: 14px;
      background: var(--tg-theme-secondary-bg-color, #fff);
      color: var(--tg-theme-text-color, #111827);
    }

    .status {
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 12px;
      font-size: 13px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    .status.success { color: #16803c; }
    .status.error { color: #b00020; }

    .feed {
      width: 100%;
    }

    .card {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;
      border-radius: 18px;
      background: var(--tg-theme-secondary-bg-color, #fff);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.5;
    }

    .card p {
      margin: 0 0 11px;
      font-size: 14px;
      line-height: 1.8;
      opacity: .78;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      opacity: .58;
    }

    .chip {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--tg-theme-bg-color, #eef2f7);
    }

    .actions {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 8px;
    }

    .action {
      min-width: 0;
      border: 0;
      border-radius: 12px;
      padding: 11px 8px;
      font-size: 13px;
      background: var(--tg-theme-bg-color, #eef2f7);
      color: var(--tg-theme-text-color, #111827);
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      font-size: 14px;
      line-height: 1.8;
      opacity: .65;
    }

    .error-card {
      border-radius: 18px;
      padding: 16px;
      background: var(--tg-theme-secondary-bg-color, #fff);
      color: #b00020;
    }

    .error-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 11px;
      opacity: .45;
    }

    @media (max-width: 380px) {
      .brand { font-size: 25px; }
      .tab { font-size: 12px; }
      .search button { padding: 0 13px; }
      .actions { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="brand">کشف</div>
      <div class="subtitle">محتوای جالب تلگرام را کشف کن</div>
    </header>

    <div class="search">
      <input id="searchInput" type="search" autocomplete="off" placeholder="جستجو...">
      <button id="searchBtn" type="button">جستجو</button>
    </div>

    <div class="tabs">
      <button id="feedBtn" class="tab active" type="button">✨ پیشنهادهای من</button>
      <button id="trendBtn" class="tab" type="button">🔥 ترندها</button>
      <button id="exploreBtn" class="tab" type="button">🧭 اکسپلور</button>
    </div>

    <div id="status" class="status">در حال اتصال...</div>

    <main id="feed" class="feed">
      <div class="empty">در حال آماده‌سازی Discovery...</div>
    </main>

    <div class="footer">Telegram Discovery · MVP</div>
  </div>

  <script>
    const API_URL =
      "https://jmxlwocemvjwkztbasja.supabase.co/functions/v1/discovery-api-live";

    const tg =
      window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    const statusEl = document.getElementById("status");
    const feedEl = document.getElementById("feed");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const feedBtn = document.getElementById("feedBtn");
    const trendBtn = document.getElementById("trendBtn");
    const exploreBtn = document.getElementById("exploreBtn");

    let currentMode = "feed";
    let feedItems = [];
    let currentUser = null;

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initTelegram() {
      if (!tg) {
        setStatus("⚠️ این برنامه باید داخل Telegram باز شود", "error");
        return false;
      }

      try {
        tg.ready();
        tg.expand();

        if (tg.setHeaderColor && tg.themeParams) {
          try {
            tg.setHeaderColor(tg.themeParams.bg_color || "#ffffff");
          } catch (_) {}
        }

        return true;
      } catch (error) {
        console.error("Telegram init:", error);
        setStatus("⚠️ Telegram WebApp آماده نشد", "error");
        return false;
      }
    }

    async function api(path, options = {}) {
      const headers = {
        ...(options.headers || {})
      };

      /*
       * discovery-api-live has verify_jwt=false and performs
       * Telegram authentication itself from initData.
       * Therefore the browser must NOT send the Supabase
       * Authorization/publishable-key headers here.
       *
       * Removing them also avoids an unnecessary Supabase
       * gateway/preflight dependency for the health check.
       */
      if (!headers["Content-Type"] && options.body) {
        headers["Content-Type"] = "application/json";
      }

      const initData = tg?.initData || "";
      if (initData) {
        headers["X-Telegram-Init-Data"] = initData;
      }

      const response = await fetch(API_URL + path, {
        ...options,
        headers
      });

      const raw = await response.text();

      let data = {};
      try {
        data = raw ? JSON.parse(raw) : {};
      } catch (_) {
        data = { message: raw };
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          data.message ||
          `HTTP ${response.status}`
        );
      }

      return data;
    }

    async function checkBackend() {
      try {
        const result = await api("/health");
        console.log("Discovery API:", result);
        return result?.ok === true;
      } catch (error) {
        console.error("Backend health:", error);
        setStatus(
          "🔴 Health check ناموفق: " + (error?.message || "Network/CORS error"),
          "error"
        );
        return false;
      }
    }

    async function authenticateTelegram() {
      if (!tg?.initData) {
        setStatus("⚠️ اطلاعات Telegram در دسترس نیست", "error");
        return false;
      }

      try {
        const result = await api("/auth/telegram", {
          method: "POST",
          body: JSON.stringify({ initData: tg.initData })
        });

        if (result?.authenticated && result.user) {
          currentUser = result.user;
          return true;
        }

        setStatus("🔴 احراز هویت Telegram ناموفق بود", "error");
        return false;
      } catch (error) {
        console.error("Telegram auth:", error);
        setStatus("🔴 احراز هویت Telegram ناموفق بود", "error");
        return false;
      }
    }

    function setActiveTab(mode) {
      feedBtn.classList.toggle("active", mode === "feed");
      trendBtn.classList.toggle("active", mode === "trending");
      exploreBtn.classList.toggle("active", mode === "explore");
    }

    function normalizeItem(item) {
      return {
        id: item.id || item.content_id || "",
        title: item.title || "بدون عنوان",
        description:
          item.description ||
          item.text_content ||
          "توضیحی برای این محتوا ثبت نشده است.",
        source_url: item.source_url || item.url || "",
        content_type: item.content_type || "content",
        creator_name: item.creator_name || item.creator_username || "",
        score: Number(item.score ?? item.final_score ?? 0),
        reason: item.reason || ""
      };
    }

    async function loadFeed(mode = "feed") {
      currentMode = mode;
      setActiveTab(mode);
      setStatus("در حال دریافت محتوا...");
      feedEl.innerHTML = '<div class="empty">در حال بارگذاری...</div>';

      try {
        let result;

        if (mode === "feed") {
          result = await api("/feed?limit=20");
        } else if (mode === "trending") {
          result = await api("/trending?limit=20");
        } else {
          result = await api("/explore?limit=20");
        }

        feedItems = Array.isArray(result?.items)
          ? result.items.map(normalizeItem)
          : [];

        renderFeed();

        setStatus(
          feedItems.length
            ? `🟢 ${feedItems.length} محتوا آماده است`
            : "🟡 هنوز محتوایی برای نمایش پیدا نشد",
          feedItems.length ? "success" : ""
        );

      } catch (error) {
        console.error("Feed:", error);

        feedEl.innerHTML = `
          <div class="error-card">
            <strong>دریافت محتوا ناموفق بود</strong>
            <div>${escapeHtml(error.message || "خطای نامشخص")}</div>
          </div>
        `;

        setStatus("🔴 خطا در دریافت محتوا", "error");
      }
    }

    function renderFeed() {
      if (!feedItems.length) {
        feedEl.innerHTML = `
          <div class="empty">
            هنوز محتوایی برای نمایش در Discovery وجود ندارد.
          </div>
        `;
        return;
      }

      feedEl.innerHTML = feedItems.map((item, index) => {
        const id = escapeHtml(item.id);
        const url = escapeHtml(item.source_url);

        return `
          <article class="card">
            <h2>${escapeHtml(item.title)}</h2>

            <p>${escapeHtml(item.description)}</p>

            <div class="meta">
              <span class="chip">${escapeHtml(item.content_type)}</span>
              ${
                item.creator_name
                  ? `<span class="chip">${escapeHtml(item.creator_name)}</span>`
                  : ""
              }
              ${
                item.score
                  ? `<span class="chip">امتیاز ${item.score.toFixed(3)}</span>`
                  : ""
              }
            </div>

            <div class="actions">
              ${
                url
                  ? `
                    <button
                      class="action primary"
                      data-id="${id}"
                      data-url="${url}"
                      onclick="openContent(this.dataset.id, this.dataset.url)"
                    >
                      🔗 مشاهده
                    </button>
                  `
                  : ""
              }

              <button
                class="action"
                data-id="${id}"
                onclick="saveContent(this.dataset.id)"
              >
                ⭐ ذخیره
              </button>

              <button
                class="action"
                data-id="${id}"
                onclick="notInterested(this.dataset.id)"
              >
                👎
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function openContent(contentId, url) {
      if (!contentId || !url) return;

      try {
        await api("/impression", {
          method: "POST",
          body: JSON.stringify({
            content_id: contentId,
            position: feedItems.findIndex(x => x.id === contentId),
            score:
              feedItems.find(x => x.id === contentId)?.score || 0,
            reason: currentMode
          })
        });
      } catch (error) {
        console.warn("Impression:", error);
      }

      try {
        if (tg?.openLink) {
          tg.openLink(url);
          return;
        }
      } catch (error) {
        console.warn("Telegram openLink:", error);
      }

      window.open(url, "_blank", "noopener,noreferrer");
    }

    async function saveContent(contentId) {
      if (!contentId) return;

      if (!currentUser) {
        setStatus("⚠️ برای ذخیره باید داخل Telegram احراز هویت شوی");
        return;
      }

      try {
        await api("/save", {
          method: "POST",
          body: JSON.stringify({
            content_id: contentId
          })
        });

        setStatus("⭐ ذخیره شد", "success");
      } catch (error) {
        console.error("Save:", error);
        setStatus("🔴 ذخیره ناموفق بود", "error");
      }
    }

    async function notInterested(contentId) {
      if (!contentId) return;

      if (!currentUser) {
        setStatus("⚠️ برای ثبت بازخورد باید داخل Telegram احراز هویت شوی");
        return;
      }

      try {
        await api("/feedback", {
          method: "POST",
          body: JSON.stringify({
            content_id: contentId,
            feedback_type: "NOT_INTERESTED"
          })
        });

        setStatus("👍 بازخورد ثبت شد", "success");

        feedItems = feedItems.filter(item => item.id !== contentId);
        renderFeed();

      } catch (error) {
        console.error("Feedback:", error);
        setStatus("🔴 ثبت بازخورد ناموفق بود", "error");
      }
    }

    async function doSearch() {
      const query = searchInput.value.trim();

      if (!query) {
        setStatus("عبارت جستجو را وارد کن");
        return;
      }

      setStatus("🔎 در حال جستجو...");
      feedEl.innerHTML = '<div class="empty">در حال جستجو...</div>';

      try {
        const result = await api(
          "/search?q=" + encodeURIComponent(query) + "&limit=20"
        );

        feedItems = Array.isArray(result?.items)
          ? result.items.map(normalizeItem)
          : [];

        renderFeed();

        setStatus(
          feedItems.length
            ? `🟢 ${feedItems.length} نتیجه`
            : "🟡 نتیجه‌ای پیدا نشد",
          feedItems.length ? "success" : ""
        );

      } catch (error) {
        console.error("Search:", error);

        feedEl.innerHTML = `
          <div class="error-card">
            <strong>جستجو ناموفق بود</strong>
            <div>${escapeHtml(error.message || "خطای نامشخص")}</div>
          </div>
        `;

        setStatus("🔴 خطا در جستجو", "error");
      }
    }

    feedBtn.addEventListener("click", () => loadFeed("feed"));
    trendBtn.addEventListener("click", () => loadFeed("trending"));
    exploreBtn.addEventListener("click", () => loadFeed("explore"));
    searchBtn.addEventListener("click", doSearch);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") doSearch();
    });

    async function startApp() {
      if (!initTelegram()) return;

      setStatus("در حال اتصال به Discovery...");

      const healthy = await checkBackend();

      if (!healthy) {
        feedEl.innerHTML = `
          <div class="error-card">
            <strong>Discovery API در دسترس نیست</strong>
            <div>اتصال به Backend برقرار نشد.</div>
          </div>
        `;
        setStatus("🔴 Backend در دسترس نیست", "error");
        return;
      }

      const authenticated = await authenticateTelegram();

      if (!authenticated) {
        feedEl.innerHTML = `
          <div class="error-card">
            <strong>احراز هویت Telegram ناموفق بود</strong>
            <div>برنامه را از داخل Telegram باز کن.</div>
          </div>
        `;
        return;
      }

      setStatus("🟢 آماده", "success");
      await loadFeed("feed");
    }

    startApp();
  </script>
</body>
</html>
