<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Telegram Discovery</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        var(--tg-theme-bg-color, #f4f6f8);

      color:
        var(--tg-theme-text-color, #111827);

      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));
    }

    /* ---------------- HEADER ---------------- */

    .header {
      padding: 8px 2px 16px;
    }

    .brand {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: .68;
    }

    /* ---------------- SEARCH ---------------- */

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search input {
      min-width: 0;
      flex: 1;

      border: 0;
      outline: none;

      border-radius: 15px;
      padding: 13px 14px;

      font-size: 15px;

      background:
        var(--tg-theme-secondary-bg-color, #ffffff);

      color:
        var(--tg-theme-text-color, #111827);
    }

    .search input::placeholder {
      color:
        var(--tg-theme-hint-color, #8b949e);
    }

    .search button {
      border: 0;
      border-radius: 15px;

      padding: 0 17px;

      background:
        var(--tg-theme-button-color, #229ed9);

      color:
        var(--tg-theme-button-text-color, #ffffff);

      font-weight: 700;
    }

    /* ---------------- TABS ---------------- */

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      border-radius: 14px;
      padding: 13px 7px;

      font-size: 14px;

      background:
        var(--tg-theme-secondary-bg-color, #ffffff);

      color:
        var(--tg-theme-text-color, #111827);
    }

    .tab.active {
      background:
        var(--tg-theme-button-color, #229ed9);

      color:
        var(--tg-theme-button-text-color, #ffffff);
    }

    /* ---------------- STATUS ---------------- */

    .status {
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 12px;

      font-size: 13px;

      background:
        var(--tg-theme-secondary-bg-color, #ffffff);
    }

    .status.success {
      color: #16803c;
    }

    .status.error {
      color: #b00020;
    }

    /* ---------------- FEED ---------------- */

    .feed {
      width: 100%;
    }

    .card {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;

      border-radius: 18px;

      background:
        var(--tg-theme-secondary-bg-color, #ffffff);
    }

    .card h2 {
      margin: 0 0 8px;

      font-size: 18px;
      line-height: 1.5;
    }

    .card p {
      margin: 0 0 11px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .78;
    }

    .meta {
      margin-bottom: 12px;

      font-size: 12px;
      opacity: .55;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action {
      flex: 1;

      border: 0;
      border-radius: 12px;

      padding: 11px 8px;

      font-size: 13px;

      background:
        var(--tg-theme-bg-color, #eef2f7);

      color:
        var(--tg-theme-text-color, #111827);
    }

    .action.primary {
      background:
        var(--tg-theme-button-color, #229ed9);

      color:
        var(--tg-theme-button-text-color, #ffffff);
    }

    /* ---------------- EMPTY ---------------- */

    .empty {
      text-align: center;

      padding: 50px 20px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .65;
    }

    /* ---------------- ERROR ---------------- */

    .error-card {
      border-radius: 18px;
      padding: 16px;

      background:
        var(--tg-theme-secondary-bg-color, #ffffff);

      color: #b00020;
    }

    .error-card strong {
      display: block;
      margin-bottom: 8px;
    }

    /* ---------------- FOOTER ---------------- */

    .footer {
      text-align: center;

      margin-top: 25px;

      font-size: 11px;

      opacity: .45;
    }

    @media (max-width: 380px) {

      .brand {
        font-size: 25px;
      }

      .tab {
        font-size: 12px;
      }

      .search button {
        padding: 0 13px;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">
      کشف
    </div>

    <div class="subtitle">
      محتوای جالب تلگرام را کشف کن
    </div>

  </header>


  <!-- SEARCH -->

  <div class="search">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="جستجو..."
    >

    <button id="searchBtn">
      جستجو
    </button>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      id="feedBtn"
      class="tab active"
      type="button"
    >
      ✨ پیشنهادهای من
    </button>

    <button
      id="trendBtn"
      class="tab"
      type="button"
    >
      🔥 ترندها
    </button>

    <button
      id="exploreBtn"
      class="tab"
      type="button"
    >
      🧭 اکسپلور
    </button>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    در حال اتصال...
  </div>


  <!-- FEED -->

  <main
    id="feed"
    class="feed"
  >

    <div class="empty">
      در حال آماده‌سازی Discovery...
    </div>

  </main>


  <div class="footer">
    Telegram Discovery · نسخه 0.1.0
  </div>

</div>


<script>

  /*
   * =========================================================
   * CONFIG
   * =========================================================
   *
   * این همان Supabase Edge Function فعلی است.
   *
   * Supabase را تغییر نمی‌دهیم.
   */

  const API_URL =
    "https://jmxlwocemvjwkztbasja.supabase.co/functions/v1/discovery-api";


  /*
   * Publishable key
   *
   * این کلید publishable است و برای استفاده Client-side
   * طراحی شده است.
   */

  const SUPABASE_KEY =
    "sb_publishable_4T6EICAK3XDApqSzisDFLQ_5tLgPNH4";


  /*
   * =========================================================
   * TELEGRAM
   * =========================================================
   */

  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;


  /*
   * =========================================================
   * ELEMENTS
   * =========================================================
   */

  const statusEl =
    document.getElementById("status");

  const feedEl =
    document.getElementById("feed");

  const searchInput =
    document.getElementById("searchInput");

  const feedBtn =
    document.getElementById("feedBtn");

  const trendBtn =
    document.getElementById("trendBtn");

  const exploreBtn =
    document.getElementById("exploreBtn");


  /*
   * =========================================================
   * STATE
   * =========================================================
   */

  let currentUser = null;

  let currentMode = "feed";

  let feedItems = [];


  /*
   * =========================================================
   * TELEGRAM INITIALIZATION
   * =========================================================
   */

  function initTelegram() {

    if (!tg) {

      setStatus(
        "⚠️ خارج از Telegram باز شده است",
        "error"
      );

      return false;
    }

    try {

      tg.ready();

      tg.expand();

      /*
       * رنگ Telegram را با صفحه هماهنگ می‌کنیم.
       */

      if (
        tg.setHeaderColor &&
        tg.themeParams
      ) {

        try {
          tg.setHeaderColor(
            tg.themeParams.bg_color ||
            "#ffffff"
          );
        } catch (_) {}

      }

      return true;

    } catch (error) {

      console.error(
        "Telegram init error:",
        error
      );

      setStatus(
        "⚠️ Telegram WebApp آماده نشد",
        "error"
      );

      return false;
    }
  }


  /*
   * =========================================================
   * STATUS
   * =========================================================
   */

  function setStatus(
    text,
    type = ""
  ) {

    statusEl.textContent = text;

    statusEl.className =
      "status" +
      (type ? " " + type : "");
  }


  /*
   * =========================================================
   * HTML ESCAPE
   * =========================================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /*
   * =========================================================
   * API
   * =========================================================
   */

  async function api(
    path,
    options = {}
  ) {

    const headers = {

      "Content-Type":
        "application/json",

      "apikey":
        SUPABASE_KEY,

      "Authorization":
        "Bearer " +
        SUPABASE_KEY,

      ...(options.headers || {})

    };


    const response =
      await fetch(
        API_URL + path,
        {
          ...options,
          headers
        }
      );


    const raw =
      await response.text();


    let data = {};

    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (_) {

      data = {
        message: raw
      };

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        `HTTP ${response.status}`
      );

    }


    return data;
  }


  /*
   * =========================================================
   * BACKEND HEALTH CHECK
   * =========================================================
   */

  async function checkBackend() {

    try {

      const result =
        await api("/");


      console.log(
        "Discovery API:",
        result
      );


      setStatus(
        "🟢 اتصال به Discovery برقرار است",
        "success"
      );


      return true;

    } catch (error) {

      console.error(
        "Backend error:",
        error
      );


      setStatus(
        "🔴 اتصال به Discovery API برقرار نشد",
        "error"
      );


      return false;
    }
  }


  /*
   * =========================================================
   * TELEGRAM AUTH
   * =========================================================
   *
   * اگر endpoint احراز هویت موجود باشد استفاده می‌شود.
   *
   * اگر نباشد، Mini App متوقف نمی‌شود.
   */

  async function authenticateTelegram() {

    if (!tg) {
      return false;
    }


    const initData =
      tg.initData;


    if (!initData) {

      console.warn(
        "Telegram initData is empty"
      );

      return false;
    }


    try {

      const result =
        await api(
          "/auth/telegram",
          {
            method: "POST",

            body:
              JSON.stringify({
                initData
              })
          }
        );


      if (
        result &&
        result.authenticated
      ) {

        currentUser =
          result.user || null;


        console.log(
          "Telegram authenticated:",
          currentUser
        );


        return true;
      }


      return false;

    } catch (error) {

      /*
       * مهم:
       * شکست Auth نباید صفحه را سیاه کند.
       */

      console.warn(
        "Telegram auth endpoint:",
        error
      );


      return false;
    }
  }


  /*
   * =========================================================
   * LOAD FEED
   * =========================================================
   */

  async function loadFeed(
    mode = "feed"
  ) {

    currentMode =
      mode;


    setActiveTab(
      mode
    );


    setStatus(
      "در حال دریافت محتوا..."
    );


    feedEl.innerHTML = `
      <div class="empty">
        در حال بارگذاری...
      </div>
    `;


    let path =
      "/feed?limit=20";


    /*
     * Feed معمولی
     */

    if (mode === "feed") {

      path =
        "/feed?limit=20";

    }


    /*
     * Trending
     */

    else if (
      mode === "trending"
    ) {

      path =
        "/feed?type=trending&limit=20";

    }


    /*
     * Explore
     */

    else if (
      mode === "explore"
    ) {

      path =
        "/feed?type=explore&limit=20";

    }


    try {

      const result =
        await api(path);


      feedItems =
        Array.isArray(
          result.items
        )
          ? result.items
          : [];


      renderFeed();


      setStatus(
        feedItems.length
          ? "🟢 آماده"
          : "🟡 هنوز محتوایی پیدا نشد",
        feedItems.length
          ? "success"
          : ""
      );


    } catch (error) {

      console.error(
        "Feed error:",
        error
      );


      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            دریافت محتوا ناموفق بود
          </strong>

          <div>
            ${escapeHtml(
              error.message ||
              "خطای نامشخص"
            )}
          </div>

        </div>
      `;


      setStatus(
        "🔴 خطا در دریافت محتوا",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * RENDER FEED
   * =========================================================
   */

  function renderFeed() {

    if (
      !feedItems.length
    ) {

      feedEl.innerHTML = `
        <div class="empty">

          هنوز محتوایی برای نمایش
          در Discovery وجود ندارد.

        </div>
      `;

      return;
    }


    feedEl.innerHTML =
      feedItems
        .map(
          function(item) {

            const id =
              escapeHtml(
                item.id || ""
              );


            const title =
              escapeHtml(
                item.title ||
                "بدون عنوان"
              );


            const description =
              escapeHtml(
                item.description ||
                "توضیحی برای این محتوا ثبت نشده است."
              );


            const type =
              escapeHtml(
                item.content_type ||
                "content"
              );


            const url =
              item.source_url
                ? String(
                    item.source_url
                  )
                : "";


            return `
              <article class="card">

                <h2>
                  ${title}
                </h2>

                <p>
                  ${description}
                </p>

                <div class="meta">
                  ${type}
                </div>

                <div class="actions">

                  ${
                    url
                      ? `
                        <button
                          class="action primary"
                          data-url="${escapeHtml(url)}"
                          onclick="openContent(this.dataset.url)"
                        >
                          🔗 مشاهده
                        </button>
                      `
                      : ""
                  }


                  <button
                    class="action"
                    data-id="${id}"
                    onclick="saveContent(this.dataset.id)"
                  >
                    ⭐ ذخیره
                  </button>


                  <button
                    class="action"
                    data-id="${id}"
                    onclick="notInterested(this.dataset.id)"
                  >
                    👎
                  </button>

                </div>

              </article>
            `;

          }
        )
        .join("");
  }


  /*
   * =========================================================
   * ACTIVE TAB
   * =========================================================
   */

  function setActiveTab(
    mode
  ) {

    feedBtn.classList.remove(
      "active"
    );

    trendBtn.classList.remove(
      "active"
    );

    exploreBtn.classList.remove(
      "active"
    );


    if (mode === "feed") {

      feedBtn.classList.add(
        "active"
      );

    }


    if (
      mode === "trending"
    ) {

      trendBtn.classList.add(
        "active"
      );

    }


    if (
      mode === "explore"
    ) {

      exploreBtn.classList.add(
        "active"
      );

    }
  }


  /*
   * =========================================================
   * OPEN CONTENT
   * =========================================================
   */

  function openContent(
    url
  ) {

    if (!url) {
      return;
    }


    try {

      if (
        tg &&
        typeof tg.openLink ===
        "function"
      ) {

        tg.openLink(
          url
        );

        return;
      }

    } catch (error) {

      console.warn(
        "Telegram openLink:",
        error
      );
    }


    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }


  /*
   * =========================================================
   * SAVE
   * =========================================================
   */

  async function saveContent(
    contentId
  ) {

    if (!contentId) {
      return;
    }


    if (!currentUser) {

      setStatus(
        "ℹ️ برای ذخیره، ابتدا Telegram را احراز هویت کن"
      );

      return;
    }


    try {

      await api(
        "/save",
        {
          method: "POST",

          body:
            JSON.stringify({
              user_id:
                currentUser.id,

              content_id:
                contentId
            })
        }
      );


      setStatus(
        "⭐ ذخیره شد",
        "success"
      );


    } catch (error) {

      console.error(
        "Save:",
        error
      );


      setStatus(
        "🔴 ذخیره ناموفق بود",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * NOT INTERESTED
   * =========================================================
   */

  async function notInterested(
    contentId
  ) {

    if (!currentUser) {

      setStatus(
        "ℹ️ برای ثبت بازخورد، ابتدا Telegram را احراز هویت کن"
      );

      return;
    }


    try {

      await api(
        "/feedback",
        {
          method: "POST",

          body:
            JSON.stringify({
              user_id:
                currentUser.id,

              content_id:
                contentId,

              feedback_type:
                "not_interested"
            })
        }
      );


      setStatus(
        "👍 بازخورد ثبت شد",
        "success"
      );


    } catch (error) {

      console.error(
        "Feedback:",
        error
      );
    }
  }


  /*
   * =========================================================
   * SEARCH
   * =========================================================
   */

  function doSearch() {

    const query =
      searchInput
        .value
        .trim();


    if (!query) {

      setStatus(
        "عبارت جستجو را وارد کن"
      );

      return;
    }


    /*
     * چون Backend فعلی endpoint جستجو
     * در اختیار این Frontend نیست،
     * فعلاً فقط وضعیت را اعلام می‌کنیم.
     */

    setStatus(
      `🔎 جستجو برای «${query}» در حال توسعه است`
    );
  }


  /*
   * =========================================================
   * EVENTS
   * =========================================================
   */

  feedBtn.addEventListener(
    "click",
    function() {

      loadFeed(
        "feed"
      );

    }
  );


  trendBtn.addEventListener(
    "click",
    function() {

      loadFeed(
        "trending"
      );

    }
  );


  exploreBtn.addEventListener(
    "click",
    function() {

      loadFeed(
        "explore"
      );

    }
  );


  document
    .getElementById("searchBtn")
    .addEventListener(
      "click",
      doSearch
    );


  searchInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        doSearch();

      }

    }
  );


  /*
   * =========================================================
   * START APP
   * =========================================================
   */

  async function startApp() {

    /*
     * 1. Telegram
     */

    initTelegram();


    /*
     * 2. Backend
     */

    const backendOK =
      await checkBackend();


    if (!backendOK) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            Discovery API در دسترس نیست
          </strong>

          <div>
            اتصال به Backend برقرار نشد.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 3. Telegram authentication
     *
     * شکست این مرحله باعث توقف App نمی‌شود.
     */

    await authenticateTelegram();


    /*
     * 4. Feed
     */

    await loadFeed(
      "feed"
    );
  }


  /*
   * شروع
   */

  startApp();

</script>

</body>
</html>
