/* =========================================================
   CONFIG
========================================================= */

const DISCOVERY_API_URL =
  window.location.origin + "/api/discovery";

const TELEGRAM_API_URL =
  window.location.origin + "/api/telegram";

const CREATOR_API_URL =
  window.location.origin + "/api/creator";


/* =========================================================
   TELEGRAM WEB APP
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const feedEl =
  document.getElementById("feed");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const feedBtn =
  document.getElementById("feedBtn");

const trendBtn =
  document.getElementById("trendBtn");

const exploreBtn =
  document.getElementById("exploreBtn");

const creatorBtn =
  document.getElementById("creatorBtn");


/* =========================================================
   STATE
========================================================= */

let currentMode = "feed";

let feedItems = [];

let currentUser = null;

let creatorDashboards = [];

let creatorClaims = [];


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent = text;

  statusEl.className =
    "status" +
    (type
      ? " " + type
      : "");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   TELEGRAM INIT
========================================================= */

function initTelegram() {

  if (!tg) {

    setStatus(
      "⚠️ این برنامه باید داخل Telegram باز شود",
      "error"
    );

    return false;
  }

  try {

    tg.ready();

    tg.expand();

    try {

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#f4f6f8");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#f4f6f8");
      }

      if (tg.setBottomBarColor) {
        tg.setBottomBarColor("#f4f6f8");
      }

    } catch (_) {}

    document.documentElement.style.background =
      "#f4f6f8";

    document.body.style.background =
      "#f4f6f8";

    document.body.style.color =
      "#111827";

    return true;

  } catch (error) {

    console.error(
      "Telegram init:",
      error
    );

    setStatus(
      "⚠️ Telegram WebApp آماده نشد",
      "error"
    );

    return false;
  }
}


/* =========================================================
   GENERIC API REQUEST
   =========================================================
   
   اصلاح شماره 1:
   timeout پانزده ثانیه‌ای اضافه شده.
   
   اگر Backend پاسخ ندهد، برنامه دیگر
   برای همیشه روی «در حال اتصال» نمی‌ماند.
========================================================= */

async function requestApi(
  baseUrl,
  path,
  options = {}
) {

  const headers = {
    ...(options.headers || {})
  };

  if (
    !headers["Content-Type"] &&
    options.body
  ) {

    headers["Content-Type"] =
      "application/json";
  }

  const initData =
    tg?.initData || "";

  if (initData) {

    headers["X-Telegram-Init-Data"] =
      initData;
  }

  const controller =
    new AbortController();

  const timeoutId =
    setTimeout(() => {

      controller.abort();

    }, 15000);

  try {

    const response =
      await fetch(
        baseUrl + path,
        {
          ...options,
          headers,
          signal:
            controller.signal
        }
      );

    const raw =
      await response.text();

    let data = {};

    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (_) {

      data = {
        message: raw
      };
    }

    if (!response.ok) {

      const error =
        new Error(
          data.error ||
          data.message ||
          `HTTP ${response.status}`
        );

      error.status =
        response.status;

      error.data =
        data;

      throw error;
    }

    return data;

  } catch (error) {

    if (
      error?.name ===
      "AbortError"
    ) {

      throw new Error(
        "اتصال به سرور بیش از ۱۵ ثانیه طول کشید."
      );
    }

    throw error;

  } finally {

    clearTimeout(
      timeoutId
    );
  }
}


/* =========================================================
   DISCOVERY API
========================================================= */

async function discoveryApi(
  path,
  options = {}
) {

  return requestApi(
    DISCOVERY_API_URL,
    path,
    options
  );
}


/* =========================================================
   TELEGRAM API
========================================================= */

async function telegramApi(
  path,
  options = {}
) {

  return requestApi(
    TELEGRAM_API_URL,
    path,
    options
  );
}


/* =========================================================
   CREATOR API
========================================================= */

async function creatorApi(
  path,
  options = {}
) {

  return requestApi(
    CREATOR_API_URL,
    path,
    options
  );
}


/* =========================================================
   BACKEND HEALTH
========================================================= */

async function checkBackend() {

  try {

    const result =
      await discoveryApi(
        "/health"
      );

    console.log(
      "Discovery API health:",
      result
    );

    return result?.ok === true;

  } catch (error) {

    console.error(
      "Backend health:",
      error
    );

    return false;
  }
}


/* =========================================================
   TELEGRAM SERVER HEALTH
========================================================= */

async function checkTelegramServer() {

  try {

    const result =
      await telegramApi(
        "/health"
      );

    console.log(
      "Telegram server health:",
      result
    );

    return result?.ok === true;

  } catch (error) {

    console.error(
      "Telegram server health:",
      error
    );

    return false;
  }
}


/* =========================================================
   TELEGRAM AUTH
========================================================= */

async function authenticateTelegram() {

  if (!tg?.initData) {

    setStatus(
      "⚠️ اطلاعات Telegram در دسترس نیست",
      "error"
    );

    return false;
  }

  try {

    const result =
      await discoveryApi(
        "/auth/telegram",
        {
          method: "POST",

          body: JSON.stringify({
            initData:
              tg.initData
          })
        }
      );

    console.log(
      "Telegram authentication:",
      result
    );

    if (
      result?.authenticated &&
      result.user
    ) {

      currentUser =
        result.user;

      return true;
    }

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );

    return false;

  } catch (error) {

    console.error(
      "Telegram auth:",
      error
    );

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );

    return false;
  }
}


/* =========================================================
   ACTIVE TAB
========================================================= */

function setActiveTab(
  mode
) {

  feedBtn.classList.toggle(
    "active",
    mode === "feed"
  );

  trendBtn.classList.toggle(
    "active",
    mode === "trending"
  );

  exploreBtn.classList.toggle(
    "active",
    mode === "explore"
  );

  creatorBtn.classList.toggle(
    "active",
    mode === "creator"
  );
}


/* =========================================================
   NORMALIZE DISCOVERY ITEM
========================================================= */

function titleForContentType(
  contentType
) {

  const map = {
    IMAGE: "🖼️ تصویر",
    VIDEO: "🎥 ویدیو",
    AUDIO: "🎧 صوت",
    DOCUMENT: "📄 فایل",
    MIXED: "📎 رسانه"
  };

  return (
    map[
      String(
        contentType || ""
      ).toUpperCase()
    ] ||
    "بدون عنوان"
  );
}


function normalizeDiscoveryItem(
  item
) {

  return {

    id:
      item.id ||
      item.content_id ||
      "",

    title:
      item.title ||
      titleForContentType(
        item.content_type
      ),

    description:
      item.description ||
      item.text_content ||
      "توضیحی برای این محتوا ثبت نشده است.",

    source_url:
      item.source_url ||
      item.url ||
      "",

    content_type:
      item.content_type ||
      "content",

    creator_name:
      item.creator_name ||
      item.creator_username ||
      "",

    score:
      Number(
        item.score ??
        item.final_score ??
        0
      ),

    reason:
      item.reason ||
      "",

    is_saved:
      item.is_saved === true ||
      item.is_saved === 1 ||
      item.is_saved === "true" ||
      item.is_saved === "1",

    source:
      "discovery"
  };
}


/* =========================================================
   NORMALIZE TELEGRAM RESULT
========================================================= */

function normalizeTelegramItem(
  item,
  index
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const text =
    item?.text ??
    item?.message ??
    item?.rawText ??
    "";

  const username =
    item?.channel_username ??
    item?.chat_username ??
    item?.username ??
    "";

  const title =
    item?.channel_title ??
    item?.title ??
    username ??
    "Telegram";

  const channelUrl =
    item?.channel_url ??
    (
      username
        ? `https://t.me/${username}`
        : ""
    );

  const messageUrl =
    item?.message_url ??
    item?.link ??
    item?.url ??
    "";

  return {

    id:
      String(
        item?.id ??
        item?.result_id ??
        `telegram-${index}`
      ),

    result_type:
      isChannel
        ? "channel"
        : "telegram_message",

    telegram_message_id:
      item?.telegram_message_id ??
      (
        !isChannel
          ? item?.id ?? null
          : null
      ),

    title,

    description:

      isChannel

        ? (
            item?.description ||
            "کانال تلگرام"
          )

        : (
            text.trim() ||
            (
              item?.has_media
                ? "📎 این پست شامل رسانه است."
                : "این پست متن قابل نمایش ندارد."
            )
          ),

    source_url:
      isChannel
        ? channelUrl
        : messageUrl,

    channel_url:
      channelUrl,

    message_url:
      messageUrl,

    content_type:
      isChannel
        ? "telegram-channel"
        : "telegram",

    creator_name:
      username
        ? "@" + username
        : "",

    score:
      Number(
        item?.search_score ??
        item?.score ??
        0
      ),

    reason:
      isChannel
        ? "telegram_channel_search"
        : "telegram_global_search",

    is_saved:
      false,

    source:
      "telegram",

    channel_username:
      username,

    channel_title:
      title,

    chat_id:
      item?.chat_id ??
      item?.channel_peer_id ??
      null,

    channel_peer_id:
      item?.channel_peer_id ??
      null,

    date:
      item?.date ??
      null,

    has_media:
      Boolean(
        item?.has_media
      )
  };
}


/* =========================================================
   LOAD DISCOVERY FEED
========================================================= */

async function loadFeed(
  mode = "feed"
) {

  currentMode =
    mode;

  setActiveTab(
    mode
  );

  setStatus(
    "در حال دریافت محتوا..."
  );

  feedEl.innerHTML =
    '<div class="empty">در حال بارگذاری...</div>';

  try {

    let result;

    if (
      mode ===
      "feed"
    ) {

      result =
        await discoveryApi(
          "/feed?limit=20"
        );

    } else if (
      mode ===
      "trending"
    ) {

      result =
        await discoveryApi(
          "/trending?limit=20"
        );

    } else {

      result =
        await discoveryApi(
          "/explore?limit=20"
        );
    }

    console.log(
      "Discovery response:",
      result
    );

    feedItems =
      Array.isArray(
        result?.items
      )

        ? result.items.map(
            normalizeDiscoveryItem
          )

        : [];

    renderFeed();

    setStatus(

      feedItems.length

        ? `🟢 ${feedItems.length} محتوا آماده است`

        : "🟡 هنوز محتوایی برای نمایش پیدا نشد",

      feedItems.length
        ? "success"
        : ""
    );

  } catch (error) {

    console.error(
      "Discovery feed:",
      error
    );

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          دریافت محتوا ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            error.message ||
            "خطای نامشخص"
          )}
        </div>

      </div>

    `;

    setStatus(
      "🔴 خطا در دریافت محتوا",
      "error"
    );
  }
}


/* =========================================================
   CREATOR DASHBOARD
========================================================= */

async function loadCreatorDashboard() {

  setActiveTab("creator");

  if (!currentUser) {

    feedEl.innerHTML = `
      <div class="empty">
        برای دیدن داشبورد باید داخل Telegram احراز هویت شوی.
      </div>
    `;

    return;

    "در حال دریافت داشبورد..."
  );

    '<div class="empty">در حال بارگذاری...</div>';

        creatorApi("/claims")

        : [];

        <div>${escapeHtml(error.message || "خطای نامشخص")}</div>
      </div>

    setStatus(
      "🔴 خطا در دریافت داشبورد",
      "error"
    );
  }
}


async function renderCreatorDashboard() {

  // حالت ۱: هیچ کانالی تایید‌شده نداره -> فرم درخواست مالکیت + وضعیت درخواست‌های قبلی
  if (!creatorDashboards.length) {

    const claimsHtml =
      creatorClaims.length
        ? creatorClaims.map(
            claim => `
              <div class="claim-status-row">
                <span>
                  ${escapeHtml(
                    claim.creator_name ||
                    claim.creator_username ||
                    "کانال"
                  )}
                </span>
                <span class="claim-badge ${escapeHtml(
                  String(claim.status || "").toLowerCase()
                )}">
                  ${
                    claim.status === "APPROVED"
                      ? "✅ تایید شد"
                      : claim.status === "REJECTED"
                        ? "رد شد"
                        : "⏳ در انتظار بررسی"
                  }
                </span>
              </div>
            `
          ).join("")
        : "";

    feedEl.innerHTML = `
      <div class="dash-wrap">
        <div class="claim-form">
          <p>
            اگه صاحب یکی از کانال‌هایی هستی که توی Discovery ثبت شده،
            نام کاربری کانالت رو وارد کن تا مالکیتش رو ادعا کنی.
            بعد از تایید دستی، آمار کانالت رو اینجا می‌بینی.
          </p>
          <input
            id="claimUsernameInput"
            type="text"
            placeholder="@channel_username"
            autocomplete="off"
          >
          <button
            id="claimSubmitBtn"
            type="button"
            onclick="submitCreatorClaim()"
          >
            درخواست مالکیت
          </button>
        </div>
        ${
          claimsHtml
            ? `<div style="margin-top:14px">${claimsHtml}</div>`
            : ""
        }
      </div>
    `;

    return;
  }

  // حالت ۲: حداقل یه کانال تایید‌شده داره -> نمایش آمار + لیست محتوا
  const parts = [];

  for (const creator of creatorDashboards) {

    let contentRows = [];

    try {

      const result =
        await creatorApi(
          "/content?creator_id=" +
          encodeURIComponent(creator.creator_id) +
          "&limit=10"
        );

      contentRows =
        Array.isArray(result?.items)
          ? result.items
          : [];

    } catch (error) {

      console.warn(
        "Creator content stats:",
        error
      );
    }

    parts.push(`
      <div class="dash-wrap">
        <div class="dash-creator-name">
          📡 ${escapeHtml(
            creator.creator_name ||
            creator.creator_username ||
            "کانال"
          )}
        </div>

        <div class="dash-stats">
          <div class="dash-stat-card">
            <div class="dash-stat-value">${escapeHtml(String(creator.content_count ?? 0))}</div>
            <div class="dash-stat-label">تعداد محتوا</div>
          </div>
          <div class="dash-stat-card">
            <div class="dash-stat-value">${escapeHtml(String(creator.total_impressions ?? 0))}</div>
            <div class="dash-stat-label">نمایش کل</div>
          </div>
          <div class="dash-stat-card">
            <div class="dash-stat-value">${escapeHtml(String(creator.total_saves ?? 0))}</div>
            <div class="dash-stat-label">ذخیره شده</div>
          </div>
          <div class="dash-stat-card">
            <div class="dash-stat-value">${escapeHtml(String(creator.total_follows ?? 0))}</div>
            <div class="dash-stat-label">دنبال‌کننده</div>
          </div>
        </div>

        ${
          contentRows.length
            ? contentRows.map(
                row => `
                  <div class="dash-content-row">
                    <div class="row-title">
                      ${escapeHtml(
                        row.title ||
                        titleForContentType(row.content_type)
                      )}
                    </div>
                    <div class="row-meta">
                      <span>👁️ ${escapeHtml(String(row.impressions ?? 0))}</span>
                      <span>⭐ ${escapeHtml(String(row.saves ?? 0))}</span>
                    </div>
                  </div>
                `
              ).join("")
            : '<div class="empty">هنوز محتوایی برای این کانال ثبت نشده.</div>'
        }
      </div>
    `);
  }

  feedEl.innerHTML = parts.join("");
}


async function submitCreatorClaim() {

  const input =
    document.getElementById("claimUsernameInput");

  const username =
    (input?.value || "").trim();

  if (!username) {

    setStatus(
      "نام کاربری کانال رو وارد کن"
    );

    input?.focus();

    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ثبت درخواست باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }

  const btn =
    document.getElementById("claimSubmitBtn");

  if (btn) btn.disabled = true;

  setStatus(
    "در حال ثبت درخواست..."
  );

  try {

    await creatorApi(
      "/claim",
      {
        method: "POST",
        body: JSON.stringify({
          username
        })
      }
    );

    setStatus(
      "✅ درخواست ثبت شد، منتظر تایید بمون",
      "success"
    );

    await loadCreatorDashboard();

  } catch (error) {

    console.error(
      "Submit claim:",
      error
    );

    setStatus(
      "🔴 ثبت درخواست ناموفق بود: " +
      (error?.message || ""),
      "error"
    );

  } finally {

    if (btn) btn.disabled = false;
  }
}


/* =========================================================
   TELEGRAM GLOBAL SEARCH
========================================================= */

async function doTelegramSearch() {

  const query =
    searchInput.value.trim();

  if (!query) {

    setStatus(
      "عبارت جستجو را وارد کن"
    );

    searchInput.focus();

    return;
  }

  if (
    query.length > 200
  ) {

    setStatus(
      "🔴 عبارت جستجو بیش از حد طولانی است",
      "error"
    );

    return;
  }

  currentMode =
    "telegram-search";

  feedBtn.classList.remove(
    "active"
  );

  trendBtn.classList.remove(
    "active"
  );

  exploreBtn.classList.remove(
    "active"
  );

  searchBtn.disabled =
    true;

  setStatus(
    "🔎 در حال جستجوی آنلاین در Telegram..."
  );

  feedEl.innerHTML = `

    <div class="empty">
      🔎 در حال جستجوی واقعی در Telegram...<br>
      لطفاً چند لحظه صبر کن.
    </div>

  `;

  try {

    const result =
      await telegramApi(
        "/search?q=" +
        encodeURIComponent(
          query
        ) +
        "&limit=20"
      );

    console.log(
      "Telegram Search response:",
      result
    );

    if (
      result?.ok !== true
    ) {

      throw new Error(
        result?.error ||
        "Telegram search failed"
      );
    }

    const telegramResults =
      Array.isArray(
        result?.results
      )
        ? result.results
        : [];

    feedItems =
      telegramResults.map(
        normalizeTelegramItem
      );

    renderFeed();

    if (
      feedItems.length
    ) {

      setStatus(
        `🟢 ${feedItems.length} نتیجه واقعی از Telegram برای «${query}»`,
        "success"
      );

    } else {

      setStatus(
        `🟡 برای «${query}» نتیجه‌ای در Telegram پیدا نشد`
      );
    }

  } catch (error) {

    console.error(
      "Telegram global search:",
      error
    );

    const status =
      error?.status;

    let message =
      error?.message ||
      "Telegram search failed";

    if (
      status === 401
    ) {

      message =
        "نشست Telegram معتبر نیست یا حساب مجاز نیست.";

    } else if (
      status === 404
    ) {

      message =
        "مسیر جستجوی Telegram روی Worker پیدا نشد. Worker را دوباره Deploy کن.";

    } else if (
      status === 502
    ) {

      message =
        "Worker نتوانست به سرویس مقصد متصل شود.";
    }

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          جستجو ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            message
          )}
        </div>

        ${
          status
            ? `
              <div style="margin-top:8px;font-size:12px;opacity:.65">
                HTTP ${escapeHtml(status)}
              </div>
            `
            : ""
        }

      </div>

    `;

    setStatus(
      "🔴 خطا در جستجوی Telegram",
      "error"
    );

  } finally {

    searchBtn.disabled =
      false;
  }
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed() {

  if (!feedItems.length) {

    feedEl.innerHTML = `

      <div class="empty">

        هنوز محتوایی برای نمایش
        وجود ندارد.

      </div>

    `;

    return;
  }

  feedEl.innerHTML =
    feedItems.map(
      (item, index) => {

        if (
          item.source ===
          "telegram"
        ) {

          return renderTelegramCard(
            item,
            index
          );
        }

        return renderDiscoveryCard(
          item,
          index
        );
      }
    ).join("");
}


/* =========================================================
   RENDER TELEGRAM CARD
========================================================= */

function renderTelegramCard(
  item,
  index
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const title =
    escapeHtml(
      item?.channel_title ||
      item?.title ||
      "Telegram"
    );

  const username =
    item?.channel_username
      ? "@" +
        item.channel_username
      : "";

  const description =
    escapeHtml(
      item?.description ||
      (
        isChannel
          ? "کانال تلگرام"
          : "این پست متن قابل نمایش ندارد."
      )
    );

  const channelUrl =
    item?.channel_url ||
    (
      item?.channel_username
        ? `https://t.me/${item.channel_username}`
        : ""
    );

  const messageUrl =
    item?.message_url ||
    item?.source_url ||
    "";

  const targetUrl =
    isChannel
      ? channelUrl
      : messageUrl;

  let dateText =
    "";

  if (
    item?.date
  ) {

    try {

      dateText =
        new Date(
          item.date
        ).toLocaleString(
          "fa-IR"
        );

    } catch (_) {

      dateText =
        String(
          item.date
        );
    }
  }

  return `

    <article
      class="card telegram-card"
    >

      <h2>
        ${title}
      </h2>

      <p>
        ${description}
      </p>

      <div class="meta">

        <span
          class="chip telegram"
        >
          Telegram
        </span>

        ${
          username
            ? `
              <span class="chip">
                ${escapeHtml(username)}
              </span>
            `
            : ""
        }

      </div>

      ${
        targetUrl

          ? `

            <div class="actions single">

              <button
                class="action primary"
                data-url="${escapeHtml(
                  targetUrl
                )}"
                onclick="
                  openTelegramContent(
                    this.dataset.url
                  )
                "
              >

                ${
                  isChannel
                    ? "📢 ورود به کانال"
                    : "🔗 مشاهده پست"
                }

              </button>

            </div>

          `

          : `

            <div class="actions single">

              <button
                class="action"
                disabled
              >
                لینک در دسترس نیست
              </button>

            </div>

          `
      }

    </article>

  `;
}


/* =========================================================
   RENDER DISCOVERY CARD
========================================================= */

function renderDiscoveryCard(
  item,
  index
) {

  const id =
    escapeHtml(
      item.id
    );

  const url =
    escapeHtml(
      item.source_url
    );

  const saved =
    item.is_saved === true;

  const saveClass =
    saved
      ? " saved"
      : "";

  const saveText =
    saved
      ? "✅ ذخیره‌شده"
      : "⭐ ذخیره";

  return `

    <article class="card">

      <h2>
        ${escapeHtml(
          item.title
        )}
      </h2>

      <p>
        ${escapeHtml(
          item.description
        )}
      </p>

      <div class="meta">

        <span class="chip">
          ${escapeHtml(
            item.content_type
          )}
        </span>

        ${
          item.creator_name
            ? `
              <span class="chip">
                ${escapeHtml(
                  item.creator_name
                )}
              </span>
            `
            : ""
        }

      </div>

      <div class="actions">

        ${
          url
            ? `

              <button
                class="action primary"
                data-id="${id}"
                data-url="${url}"
                onclick="
                  openContent(
                    this.dataset.id,
                    this.dataset.url
                  )
                "
              >
                🔗 مشاهده
              </button>

            `
            : `

              <button
                class="action"
                disabled
              >
                بدون لینک
              </button>

            `
        }

        <button
          class="action${saveClass}"
          data-id="${id}"
          onclick="
            saveContent(
              this.dataset.id
            )
          "
        >
          ${saveText}
        </button>

        <button
          class="action"
          data-id="${id}"
          onclick="
            notInterested(
              this.dataset.id
            )
          "
        >
          👎
        </button>

      </div>

    </article>

  `;
}


/* =========================================================
   OPEN TELEGRAM CONTENT
========================================================= */

function openTelegramContent(
  url
) {

  if (!url) {
    return;
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   OPEN DISCOVERY CONTENT
========================================================= */

async function openContent(
  contentId,
  url
) {

  if (
    !contentId ||
    !url
  ) {
    return;
  }

  try {

    await discoveryApi(
      "/impression",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          position:
            feedItems.findIndex(
              x =>
                x.id ===
                contentId
            ),

          score:
            feedItems.find(
              x =>
                x.id ===
                contentId
            )?.score || 0,

          reason:
            currentMode

        })
      }
    );

  } catch (error) {

    console.warn(
      "Impression:",
      error
    );
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   SAVE DISCOVERY CONTENT
========================================================= */

async function saveContent(
  contentId
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ذخیره باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }

  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ این نتیجه مستقیماً از Telegram آمده است",
      "info"
    );

    return;
  }

  if (
    item &&
    item.is_saved
  ) {

    setStatus(
      "✅ این محتوا قبلاً ذخیره شده است",
      "success"
    );

    return;
  }

  try {

    await discoveryApi(
      "/save",
      {
        method: "POST",

        body: JSON.stringify({
          content_id:
            contentId
        })
      }
    );

    if (item) {
      item.is_saved = true;
    }

    renderFeed();

    setStatus(
      "⭐ ذخیره شد",
      "success"
    );

  } catch (error) {

    console.error(
      "Save:",
      error
    );

    setStatus(
      "🔴 ذخیره ناموفق بود: " +
      (
        error?.message ||
        ""
      ),
      "error"
    );
  }
}


/* =========================================================
   NOT INTERESTED
========================================================= */

async function notInterested(
  contentId
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ثبت بازخورد باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }

  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ بازخورد برای نتایج مستقیم Telegram فعلاً ثبت نمی‌شود",
      "info"
    );

    return;
  }

  try {

    await discoveryApi(
      "/feedback",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          feedback_type:
            "NOT_INTERESTED"

        })
      }
    );

    setStatus(
      "👍 بازخورد ثبت شد",
      "success"
    );

    feedItems =
      feedItems.filter(
        item =>
          item.id !==
          contentId
      );

    renderFeed();

  } catch (error) {

    console.error(
      "Feedback:",
      error
    );

    setStatus(
      "🔴 ثبت بازخورد ناموفق بود",
      "error"
    );
  }
}

/* =========================================================
   START APP
   =========================================================
   
   اصلاح شماره 2:
   
   Health دیگر دروازه ورود برنامه نیست.
   
   قبلاً:
   
   checkBackend()
       ↓
   اگر fail شد
       ↓
   return
   
   بنابراین Mini App می‌توانست روی
   «در حال اتصال» متوقف شود.
   
   اکنون:
   
   Telegram init
       ↓
   Auth
       ↓
   Feed
   
   Health فقط برای Diagnostic است.
========================================================= */

async function startApp() {

  if (!initTelegram()) {
    return;
  }

  setStatus(
    "🟢 آماده",
    "success"
  );


  /*
   * Auth
   */

  const authenticated =
    await authenticateTelegram();


  if (!authenticated) {

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          احراز هویت Telegram ناموفق بود
        </strong>

        <div>
          برنامه را از داخل Telegram باز کن.
        </div>

      </div>

    `;

    return;
  }


  /*
   * Health checks در پس‌زمینه
   *
   * شکست Health نباید برنامه را متوقف کند.
   */

  checkBackend()
    .then(
      healthy => {

        console.log(
          "Discovery backend health:",
          healthy
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Discovery backend health check:",
          error
        );

      }
    );


  checkTelegramServer()
    .then(
      healthy => {

        console.log(
          "Telegram server health:",
          healthy
        );

      }
    )
    .catch(
      error => {

        console.warn(
          "Telegram server health check:",
          error
        );

      }
    );


  /*
   * Feed
   */

  await loadFeed(
    "feed"
  );
}


/* =========================================================
   BOOT
========================================================= */

startApp();

</script></body>
