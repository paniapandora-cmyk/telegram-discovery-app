    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 8.6c0 5.8-8.5 11-8.5 11s-8.5-5.2-8.5-11A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.5 2.4Z"/>
      </svg>
    </span>
    ذخیره‌ها
  </button>

  <button id="hub">
    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"/>
      </svg>
    </span>
    <i class="navBadge" id="hubBadge">۰</i>
    من
  </button>
</nav>

<div class="back" id="back"></div>

<article
  class="viewer"
  id="viewer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="viewerTitle"
  tabindex="-1"
>
  <div class="viewerMedia" id="viewerMedia">
    <button class="close" id="viewerClose" aria-label="بستن">×</button>
    <img id="viewerImage" alt="" hidden>
    <video id="viewerVideo" controls playsinline preload="metadata" hidden></video>
    <iframe
      id="viewerEmbed"
      title="پیش‌نمایش پست تلگرام"
      loading="lazy"
      allow="autoplay; fullscreen; picture-in-picture"
      hidden
    ></iframe>
  </div>

  <div class="viewerBody">
    <div class="viewerChannel">
      <span class="avatar" id="viewerAvatar"></span>
      <b id="viewerChannel"></b>
      <span class="eyebrow" id="viewerMeta"></span>
      <button class="viewerFollow" id="viewerFollow" hidden>دنبال‌کردن</button>
    </div>

    <h3 id="viewerTitle"></h3>
    <div class="desc" id="viewerDesc"></div>

    <div class="feedback" id="viewerFeedback">
      <button data-feedback="not_relevant">مرتبط نبود</button>
      <button data-feedback="hide_creator">این کانال کمتر</button>
      <button data-feedback="report">گزارش محتوا</button>
    </div>

    <div class="actions">
      <button class="primary" id="openTelegram">دیدن پست در تلگرام</button>
      <button id="viewerSave" aria-label="ذخیره">♡</button>
      <button id="notInterested" aria-label="علاقه ندارم">−</button>
    </div>
  </div>
</article>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const isTelegramHost = Boolean(
    tg && (
      tg.initData ||
      tg.initDataUnsafe?.user
    )
  );

  const nativeMain = Boolean(
    isTelegramHost && tg?.MainButton
  );

  if (isTelegramHost) {
    document.body.classList.add("telegram-host");

    if (nativeMain) {
      document.body.classList.add("native-main");
    }
  }

  try {
    tg?.ready();
    tg?.expand();
    const themeBackground =
      tg?.themeParams?.bg_color || "#07111f";

    const themeSurface =
      tg?.themeParams?.secondary_bg_color || "#111b29";

    tg?.setHeaderColor?.(themeBackground);
    tg?.setBackgroundColor?.(themeBackground);
    tg?.setBottomBarColor?.(themeSurface);
    tg?.BackButton?.onClick(hide);
    tg?.MainButton?.onClick(openCurrentTelegram);
  } catch {}

  const ORIGIN = location.protocol.startsWith("http")
    ? location.origin
    : "https://telegram-discovery-app.paniapandora.workers.dev";

  const API_PATH = '/api/discovery';
  const API = `${ORIGIN}${API_PATH}`;
  const PREVIEW = `${ORIGIN}/api/telegram/preview-image`;
  const SESSION_ID = crypto.randomUUID
    ? crypto.randomUUID()
    : "00000000-0000-4000-8000-000000000000";

  const S = {
    mode: "feed",
    items: [],
    searchItems: [],
    searchFilter: "all",
    searchQuery: "",
    current: null,
    loading: false,
    request: null,
    returnFocus: null,
    cache: {},
    observer: null,
    impressed: new Set(),
    viewerOpenedAt: 0,
    topics: [],
    preferences: null
  };

  const $ = id => document.getElementById(id);

  const grid = $("grid");
  const status = $("status");
  const heading = $("heading");
  const count = $("count");
  const search = $("search");

  const palettes = [
    ["#244e75", "#152d47"],
    ["#18595b", "#103539"],
    ["#62421e", "#332716"],
    ["#4b356f", "#292241"],
    ["#1d4f72", "#163046"],
    ["#5b3d22", "#342617"],
    ["#5b2d49", "#342035"]
  ];

  const escapeHtml = value =>
    String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);

  const cleanText = value =>
    String(value ?? "")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/\*\*|__|~~|`/g, "")
      .replace(/^\s{0,3}[#>]+\s*/gm, "")
      .replace(/\s+/g, " ")
      .trim();

  const hash = value =>
    [...String(value || "")].reduce(
      (total, character) =>
        ((total << 5) - total + character.charCodeAt(0)) | 0,
      0
    );

  const palette = item =>
    palettes[
      Math.abs(
        hash(
          item.channel_username ||
          item.creator_id ||
          item.content_id ||
          item.id
        )
      ) % palettes.length
    ];

  const text = item => {
    const globalMessage =
      item.result_type === "telegram_message" ||
      item._globalKind === "post";

    return String(
      globalMessage
        ? (
            item.text ||
            item.message ||
            item.description ||
            item.title
          )
        : (
            item.title ||
            item.description ||
            item.text ||
            item.message
          ) ||
          "یک پست تازه از تلگرام"
    ).trim();
  };

  const plainText = item => cleanText(text(item));

  const channel = item =>
    item.display_name ||
    item.name ||
    item.channel_name ||
    item.channel_title ||
    item.title ||
    [item.first_name, item.last_name].filter(Boolean).join(" ") ||
    item.username ||
    item.channel_username ||
    (
      String(item.source_url || item.url || "")
        .match(/t\.me\/([^/]+)/) || []
    )[1] ||
    "Telegram";

  const channelUsername = item => {
    const explicit = String(
      item.username ||
      item.channel_username ||
      item.chat_username ||
      ""
    )
      .replace(/^@/, "")
      .trim();

    if (explicit) return explicit;

    return (
      String(item.source_url || item.url || "")
        .match(/t\.me\/(?:s\/)?([^/]+)/)?.[1] ||
      ""
    );
  };

  const safeUrl = value => {
    try {
      const url = new URL(value);

      return ["http:", "https:"].includes(url.protocol)
        ? url.href
        : "";
    } catch {
      return "";
    }
  };

  const telegramMessageId = item =>
    String(
      item.message_id ||
      item.telegram_message_id ||
      item.telegram_post_id ||
      item.post_id ||
      item.telegram?.message_id ||
      item.metadata?.message_id ||
      ""
    ).trim();

  const sourceUrl = item => {
    const direct = safeUrl(
      item.source_url ||
      item.telegram_url ||
      item.post_url ||
      item.message_url ||
      item.channel_url ||
      item.peer_url ||
      item.profile_url ||
      item.bot_url ||
      item.url ||
      item.link
    );

    if (direct) return direct;

    const username = channelUsername(item);
    const messageId = telegramMessageId(item);

    if (username && /^\d+$/.test(messageId)) {
      return `https://t.me/${encodeURIComponent(username)}/${messageId}`;
    }

    return username
      ? `https://t.me/${encodeURIComponent(username)}`
      : "";
  };

  const channelAvatarUrl = item => {
    const direct = safeUrl(
      item.channel_avatar_url ||
      item.channel_photo_url ||
      item.creator_avatar_url ||
      item.profile_photo_url ||
      item.photo_url ||
      item.avatar_url
    );

    if (direct) return direct;

    const username = channelUsername(item);

    return username
      ? `https://t.me/i/userpic/320/${encodeURIComponent(username)}.jpg`
      : "";
  };

  const avatarMarkup = (item, className) => {
    const label = escapeHtml(channel(item).slice(0, 1));
    const image = channelAvatarUrl(item);

    return `
      <span class="${className}">
        ${label}
        ${image ? `
          <img
            src="${escapeHtml(image)}"
            alt=""
            loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.remove()"
          >
        ` : ""}
      </span>
    `;
  };

  const globalResultKind = item =>
    item._globalKind ||
    (
      ["user", "bot", "channel", "group"].includes(
        String(item.result_type || item.entity_type || "").toLowerCase()
      )
        ? String(item.result_type || item.entity_type).toLowerCase()
        : "post"
    );

  const isPeerResult = item =>
    ["user", "bot", "channel", "group"].includes(
      globalResultKind(item)
    );

  const contentType = item => {
    if (isPeerResult(item)) {
      return globalResultKind(item).toUpperCase();
    }

    if (!item.content_type && item.has_media) {
      return "MIXED";
    }

    return String(
      item.content_type || "TEXT"
    ).toUpperCase();
  };

  const posterUrl = item =>
    safeUrl(
      item.thumbnail_url ||
      item.image_url ||
      item.photo_url ||
      item.preview_url ||
      item.poster_url ||
      item.video_thumbnail_url ||
      item.media_thumbnail_url
    );

  const assetUrl = item =>
    safeUrl(
      item.media_url ||
      item.video_url ||
      item.file_url
    );

  const previewUrl = item => {
    const source = sourceUrl(item);

    return source
      ? `${PREVIEW}?url=${encodeURIComponent(source)}`
      : "";
  };

  const embedUrl = item => {
    const source = sourceUrl(item);

    try {
      const url = new URL(source);

      const allowedHosts = [
        "t.me",
        "www.t.me",
        "telegram.me",
        "www.telegram.me"
      ];

      if (
        !allowedHosts.includes(url.hostname) ||
        !/^\/(?:s\/)?[A-Za-z0-9_]+\/\d+/.test(url.pathname)
      ) {
        return "";
      }

      url.searchParams.set("embed", "1");
      url.searchParams.set("mode", "tme");

      return url.href;
    } catch {
      return "";
    }
  };

  const formatDate = value => {
    try {
      return value
        ? new Intl.DateTimeFormat("fa-IR", {
            month: "short",
            day: "numeric"
          }).format(new Date(value))
        : "تازه";
    } catch {
      return "تازه";
    }
  };

  const typeIcon = type => ({
    TEXT: "✦",
    IMAGE: "▧",
    PHOTO: "▧",
    VIDEO: "▶",
    DOCUMENT: "▤",
    AUDIO: "♪",
    MIXED: "◆",
    USER: "◉",
    BOT: "✦",
    CHANNEL: "◎",
    GROUP: "◇"
  })[String(type || "").toUpperCase()] || "✦";

  const typeName = type => ({
    TEXT: "متن",
    IMAGE: "تصویر",
    PHOTO: "تصویر",
    VIDEO: "ویدئو",
    DOCUMENT: "فایل",
    AUDIO: "صدا",
    MIXED: "چند‌رسانه‌ای",
    USER: "کاربر",
    BOT: "ربات",
    CHANNEL: "کانال",
    GROUP: "گروه"
  })[type] || "پست";

  const topicLabel = item => {
    if (S.mode === "search") {
      return globalResultKind(item) === "post"
        ? "پست تلگرام"
        : typeName(contentType(item));
    }

    const value = cleanText(
      item.category_name ||
      item.category ||
      item.topic ||
      item.primary_interest ||
      typeName(contentType(item))
    );

    return value.slice(0, 18) || "تلگرام";
  };

  const hasVisualMedia = item => {
    const type = contentType(item);

    return Boolean(
      posterUrl(item) ||
      (
        ["IMAGE", "PHOTO"].includes(type) &&
        assetUrl(item)
      ) ||
      (
        sourceUrl(item) &&
        ["IMAGE", "PHOTO", "VIDEO", "MIXED"].includes(type)
      ) ||
      (
        type === "VIDEO" &&
        assetUrl(item)
      )
    );
  };

  const foldSearchText = value =>
    cleanText(value)
      .toLocaleLowerCase("fa")
      .replace(/^@+/, "")
      .replace(/[يى]/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/\u200c/g, " ")
      .replace(/\s+/g, " ")
      .trim();

  function normalizeGlobalResult(item, index) {
    const rawKind = String(
      item.result_type || item.entity_type || ""
    ).toLowerCase();

    const kind = ["user", "bot", "channel", "group"].includes(rawKind)
      ? rawKind
      : "post";

    const isMessage =
      ["telegram_message", "message", "post"].includes(rawKind) ||
      kind === "post";

    return {
      ...item,
      _globalKind: kind,
      _globalIndex: index,
      title: isMessage
        ? (
            item.text ||
            item.message ||
            item.description ||
            item.title
          )
        : (
          item.title ||
          item.display_name ||
          item.channel_title ||
          item.username ||
          item.channel_username ||
          "نتیجه تلگرام"
        ),
      channel_title:
        item.channel_title ||
        (
          kind !== "post"
            ? (item.title || item.display_name)
            : "Telegram"
        ),
      source_url:
        (
          kind !== "post"
            ? (
                item.source_url ||
                item.channel_url ||
                item.peer_url ||
                item.profile_url ||
                item.bot_url ||
                item.url
              )
            : (
                item.message_url ||
                item.post_url ||
                item.link ||
                item.source_url ||
                item.url
              )
        ) || "",
      content_type:
        item.content_type ||
        (
          kind !== "post"
            ? kind.toUpperCase()
            : item.has_media
              ? "MIXED"
              : "TEXT"
        )
    };
  }

  function globalResultScore(item, query) {
    const tokens = foldSearchText(query)
      .split(" ")
      .filter(Boolean);

    const identity = foldSearchText([
      item.channel_title,
      item.channel_username,
      item.title
    ].filter(Boolean).join(" "));

    const body = foldSearchText([
      item.text,
      item.message,
      item.description,
      item.title
    ].filter(Boolean).join(" "));

    const identityMatches = tokens.filter(
      token => identity.includes(token)
    ).length;

    const bodyMatches = tokens.filter(
      token => body.includes(token)
    ).length;

    const directIdentityMatch =
      tokens.length > 0 &&
      identityMatches === tokens.length;

    if (
      isPeerResult(item) &&
      !directIdentityMatch
    ) {
      return Number.NEGATIVE_INFINITY;
    }

    if (!sourceUrl(item)) {
      return Number.NEGATIVE_INFINITY;
    }

    return (
      Number(item.search_score || item.score || 0) +
      identityMatches * 18 +
      bodyMatches * 7 +
      (directIdentityMatch ? 28 : 0) +
      (isPeerResult(item) ? 12 : 0)
    );
  }

  function prepareGlobalResults(items, query) {
    return items
      .map(normalizeGlobalResult)
      .map(item => ({
        item,
        score: globalResultScore(item, query)
      }))
      .filter(result => Number.isFinite(result.score))
      .sort((first, second) => second.score - first.score)
      .map(result => result.item);
  }

  function arrangeItems(items, mode) {
    const arranged = [...items];

    if (!["feed", "fresh"].includes(mode) || arranged.length < 2) {
      return arranged;
    }

    const heroIndex = arranged.findIndex(hasVisualMedia);

    if (heroIndex > 0) {
      const [hero] = arranged.splice(heroIndex, 1);
      arranged.unshift(hero);
    }

    const quoteIndex = arranged.findIndex(
      (item, index) => index > 0 && !hasVisualMedia(item)
    );

    if (quoteIndex > 4) {
      const [quote] = arranged.splice(quoteIndex, 1);
      arranged.splice(Math.min(3, arranged.length), 0, quote);
    }

    return arranged;
  }

  function imageErrorCode() {
    return `
      const fallback=this.dataset.fallback;
      if(fallback){
        this.dataset.fallback='';
        this.src=fallback;
      }else{
        this.remove();
      }
    `.replace(/\s+/g, " ").trim();
  }

  const mediaMarkup = (item, type) => {
    const poster = posterUrl(item);
    const asset = assetUrl(item);
    const proxyPreview = previewUrl(item);

    const fallback = `
      <div class="mediaFallback">
        ${type === "VIDEO" ? "" : `<b>${typeIcon(type)}</b>`}
        <span>${escapeHtml(typeName(type))} تلگرام</span>
      </div>
    `;

    const directImage =
      poster ||
      (
        ["IMAGE", "PHOTO"].includes(type)
          ? asset
          : ""
      );

    const image = directImage || proxyPreview;

    const backup =
      proxyPreview && proxyPreview !== image
        ? proxyPreview
        : "";

    return `
      <div class="mediaStage">
        ${fallback}

        ${image ? `
          <img
            class="media"
            src="${escapeHtml(image)}"
            data-fallback="${escapeHtml(backup)}"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
            onerror="${imageErrorCode()}"
          >
        ` : ""}

        ${type === "VIDEO"
          ? '<span class="videoPlay" aria-hidden="true"></span>'
          : ""
        }
      </div>
    `;
  };

  const nativeMarkup = (item, type) => `
    <div class="nativePreview">
      <div class="nativeHead">
        ${avatarMarkup(item, "nativeAvatar")}

        <div class="nativeIdentity">
          <div class="nativeName">
            ${escapeHtml(channel(item))}
          </div>

          <div class="nativeMeta">
            ${escapeHtml(formatDate(item.published_at || item.date))}
            · تلگرام
          </div>
        </div>
      </div>

      <div class="nativeMessage">
        ${escapeHtml(plainText(item))}
      </div>

      <div class="nativeFoot">
        <span class="nativeKind">
          <b>${typeIcon(type)}</b>
          ${escapeHtml(typeName(type))}
        </span>

        <span>مشاهده پست ↗</span>
      </div>
    </div>
  `;

  const searchPeerMarkup = item => {
    const kind = globalResultKind(item);
    const username = channelUsername(item);
    const label = typeName(kind.toUpperCase());
    const fallbackDescription = ({
      user: "حساب عمومی تلگرام",
      bot: "ربات تلگرام",
      channel: "کانال عمومی تلگرام",
      group: "گروه عمومی تلگرام"
    })[kind] || "نتیجه عمومی تلگرام";

    const description = cleanText(
      item.description || fallbackDescription
    );

    const action = ({
      user: "بازکردن پروفایل",
      bot: "بازکردن ربات",
      channel: "بازکردن کانال",
      group: "بازکردن گروه"
    })[kind] || "بازکردن";

    const trustLabel = item.is_scam || item.is_fake
      ? " · مشکوک ⚠"
      : item.is_verified
        ? " · تأییدشده ✓"
        : "";

    return `
      <div class="nativePreview">
        <div class="nativeHead">
          ${avatarMarkup(item, "nativeAvatar")}

          <div class="nativeIdentity">
            <div class="nativeName">
              ${escapeHtml(channel(item))}
            </div>

            <div class="nativeMeta">
              ${username
                ? `@${escapeHtml(username)}`
                : escapeHtml(fallbackDescription)
              }
              ${trustLabel}
            </div>
          </div>
        </div>

        <div class="nativeMessage">
          ${escapeHtml(description)}
        </div>

        <div class="nativeFoot">
          <span class="nativeKind">
            <b>${typeIcon(kind.toUpperCase())}</b>
            ${escapeHtml(label)}
          </span>

          <span>${escapeHtml(action)} ↗</span>
        </div>
      </div>
    `;
  };

  const saveContentId = item => {
    if (item._globalKind && !item.content_id) {
      return "";
    }

    return item.content_id || item.id || "";
  };

  const internalCreatorId = item => {
    const value = String(item?.creator_id || "");

    return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)
      ? value
      : "";
  };

  const requestHeaders = () => ({
    "x-telegram-init-data": tg?.initData || "",
    "content-type": "application/json"
  });

  function showToast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
      $("toast").classList.remove("show");
    }, 1800);
  }

  function haptic(style = "light") {
    try {
      tg?.HapticFeedback?.impactOccurred(style);
    } catch {}
  }

  async function api(path, options = {}) {
    const endpoint = path.startsWith("/api/")
      ? `${ORIGIN}${path}`
      : `${API}${path}`;

    const response = await fetch(endpoint, {
      ...options,
      headers: {
        ...requestHeaders(),
        ...(options.headers || {})
      }
    });

    const data = await response
      .json()
      .catch(() => ({}));

    if (!response.ok || data.ok === false) {
      throw new Error(
        data.error || `HTTP ${response.status}`
      );
    }

    return data;
  }

  function showSkeletons() {
    grid.setAttribute("aria-busy", "true");

    grid.innerHTML = Array.from(
      { length: 8 },
      () => '<div class="sk"></div>'
    ).join("");
  }

  function renderSearchWelcome(message = "نام، @username، کانال، گروه، ربات یا متن یک پست عمومی را بنویس.") {
    grid.setAttribute("aria-busy", "false");

    grid.innerHTML = `
      <div class="searchWelcome">
        <div class="searchWelcomeGlyph" aria-hidden="true">⌕</div>
        <b>در تلگرام عمومی جست‌وجو کن</b>
        <p>${escapeHtml(message)}</p>

        <div class="quickSearches" aria-label="جست‌وجوهای پیشنهادی">
          <button data-quick-query="@durov">@durov</button>
          <button data-quick-query="زبان بدن">زبان بدن</button>
          <button data-quick-query="هوش مصنوعی">هوش مصنوعی</button>
        </div>

        <div class="quickSearches" id="recentSearches" aria-label="جست‌وجوهای اخیر" hidden></div>
      </div>
    `;

    bindQuickSearchButtons();
    loadRecentSearches().catch(() => {});
  }

  function bindQuickSearchButtons() {
    grid.querySelectorAll("[data-quick-query]").forEach(button => {
      button.onclick = () => {
        search.value = button.dataset.quickQuery;
        performSearch(search.value);
      };
    });
  }

  async function loadRecentSearches() {
    const target = $("recentSearches");

    if (!target || !isTelegramHost) {
      return;
    }

    const data = await api("/search-history?limit=10");
    const items = Array.isArray(data.items) ? data.items : [];

    if (!items.length || !$("recentSearches")) {
      return;
    }

    target.hidden = false;
    target.innerHTML = items.map(item => `
      <button data-quick-query="${escapeHtml(item.query)}">
        ${escapeHtml(item.query)}
      </button>
    `).join("");

    bindQuickSearchButtons();
  }

  function searchFilterCounts() {
    return S.searchItems.reduce(
      (totals, item) => {
        totals.all += 1;
        totals[globalResultKind(item)] += 1;
        return totals;
      },
      { all:0, user:0, bot:0, channel:0, group:0, post:0 }
    );
  }

  function updateSearchFilters() {
    const totals = searchFilterCounts();

    $("searchCountAll").textContent =
      totals.all.toLocaleString("fa-IR");

    $("searchCountUsers").textContent =
      totals.user.toLocaleString("fa-IR");

    $("searchCountBots").textContent =
      totals.bot.toLocaleString("fa-IR");

    $("searchCountChannels").textContent =
      totals.channel.toLocaleString("fa-IR");

    $("searchCountGroups").textContent =
      totals.group.toLocaleString("fa-IR");

    $("searchCountPosts").textContent =
      totals.post.toLocaleString("fa-IR");

    document
      .querySelectorAll("[data-search-filter]")
      .forEach(button => {
        const active =
          button.dataset.searchFilter === S.searchFilter;

        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
  }

  function applySearchFilter(filter = S.searchFilter) {
    S.searchFilter = filter;
    S.items = filter === "all"
      ? [...S.searchItems]
      : S.searchItems.filter(
          item => globalResultKind(item) === filter
        );

    render();
    updateSearchFilters();

    const total = S.searchItems.length;

    count.textContent = filter === "all"
      ? `${total.toLocaleString("fa-IR")} نتیجه سراسری`
      : `${S.items.length.toLocaleString("fa-IR")} از ${total.toLocaleString("fa-IR")}`;
  }

  function cardClass(item, index) {
    if (index === 0 && S.mode !== "search") {
      return "hero";
    }

    if (
      S.mode === "explore" &&
      index % 8 === 5 &&
      hasVisualMedia(item)
    ) {
      return "wide";
    }

    return "";
  }

  function observeImpressions() {
    S.observer?.disconnect();

    if (
      !window.IntersectionObserver ||
      !["feed", "trending", "fresh", "explore"].includes(S.mode)
    ) {
      return;
    }

    S.observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || entry.intersectionRatio < .55) {
          return;
        }

        const index = Number(entry.target.dataset.index);
        const item = S.items[index];
        const contentId = saveContentId(item || {});

        if (!contentId || S.impressed.has(contentId)) {
          S.observer.unobserve(entry.target);
          return;
        }

        S.impressed.add(contentId);
        S.observer.unobserve(entry.target);

        api("/impression", {
          method: "POST",
          body: JSON.stringify({
            content_id: contentId,
            session_id: SESSION_ID,
            position: index + 1,
            score: Number(item?.score || 0),
            reason: item?.reason || S.mode
          })
        }).catch(() => {});
      });
    }, { threshold:[.55] });

    grid.querySelectorAll(".card[data-index]").forEach(card => {
      S.observer.observe(card);
    });
  }

  function render() {
    grid.setAttribute("aria-busy", "false");

    count.textContent =
      S.mode === "search"
        ? `${S.items.length.toLocaleString("fa-IR")} نتیجه`
        : `${S.items.length.toLocaleString("fa-IR")} محتوا`;

    if (!S.items.length) {
      grid.innerHTML = `
        <div class="empty">
          ${S.mode === "search"
            ? "در این دسته نتیجه‌ای پیدا نشد."
            : "هنوز چیزی برای نمایش پیدا نشد."
          }
          <br>
          ${S.mode === "search"
            ? "فیلتر دیگری را انتخاب کن یا عبارت را تغییر بده."
            : "یک موضوع دیگر را جست‌وجو کن یا دوباره تلاش کن."
          }
        </div>
      `;
      return;
    }

    grid.innerHTML = S.items.map((item, index) => {
      const [firstColor, secondColor] = palette(item);
      const type = contentType(item);
      const visual = hasVisualMedia(item);
      const peerResult =
        S.mode === "search" && isPeerResult(item);

      const canSave = Boolean(saveContentId(item));
      const accessibleTitle = (
        plainText(item) ||
        `${typeName(type)} از ${channel(item)}`
      ).slice(0, 120);

      const specialClass = peerResult
        ? `global-result search-peer-card search-${globalResultKind(item)}-card`
        : S.mode === "search"
          ? "global-result search-post-card"
          : type === "DOCUMENT"
          ? "document-card"
          : type === "AUDIO"
            ? "audio-card"
            : "";

      const reason =
        S.mode === "feed" && index === 0
          ? '<span class="reason">برای تو</span>'
          : "";

      return `
        <article
          class="card ${cardClass(item, index)} ${visual ? "media-card" : "native-card"} ${specialClass}"
          data-index="${index}"
          style="--g1:${firstColor};--g2:${secondColor}"
        >
          ${peerResult
            ? searchPeerMarkup(item)
            : visual
            ? mediaMarkup(item, type)
            : nativeMarkup(item, type)
          }

          ${visual
            ? `<span class="type">${escapeHtml(topicLabel(item))}</span>`
            : ""
          }

          <button
            class="cardOpen"
            data-open="${index}"
            aria-label="بازکردن نتیجه: ${escapeHtml(accessibleTitle)}"
          ></button>

          <span class="rank">
            ${(index + 1).toLocaleString("fa-IR")}
          </span>

          <span class="freshness">تازه</span>

          ${canSave ? `
            <button
              class="save ${item.is_saved ? "saved" : ""}"
              data-save="${index}"
              aria-label="ذخیره"
            >
              ${item.is_saved ? "♥" : "♡"}
            </button>
          ` : ""}

          ${visual ? `
            <div class="copy">
              <div class="channel">
                ${avatarMarkup(item, "avatar")}

                <span>${escapeHtml(channel(item))}</span>
                ${reason}
              </div>

              <div class="title">
                ${escapeHtml(plainText(item))}
              </div>

              <div class="meta">
                ${escapeHtml(typeName(type))}
                <span>•</span>
                ${escapeHtml(formatDate(item.published_at || item.date))}
              </div>
            </div>
          ` : ""}
        </article>
      `;
    }).join("");

    grid.querySelectorAll("[data-open]").forEach(button => {
      button.onclick = () => {
        S.returnFocus = button;

        showViewer(
          S.items[Number(button.dataset.open)]
        );
      };
    });

    grid.querySelectorAll("[data-save]").forEach(button => {
      button.onclick = event => {
        event.stopPropagation();

        saveItem(
          S.items[Number(button.dataset.save)],
          button
        );
      };
    });

    observeImpressions();
  }

  function setModeClass(mode) {
    [...document.body.classList]
      .filter(className => className.startsWith("mode-"))
      .forEach(className => {
        document.body.classList.remove(className);
      });

    document.body.classList.add(`mode-${mode}`);
  }

  function activateNavigation(mode) {
    document
      .querySelectorAll(".nav button")
      .forEach(button => {
        button.classList.remove("active");
        button.removeAttribute("aria-current");
      });

    const button =
      mode === "search"
        ? $("focusSearch")
        : mode === "saved"
          ? $("saved")
          : ["hub", "history"].includes(mode)
            ? $("hub")
          : document.querySelector(
              `[data-nav="${mode === "explore" ? "explore" : "feed"}"]`
            );

    button?.classList.add("active");
    button?.setAttribute("aria-current", "page");
  }

  function selectTab(mode = "") {
    document.querySelectorAll(".tab").forEach(button => {
      const active = button.dataset.mode === mode;

      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });
  }

  function openSearch() {
    clearTimeout(searchTimer);
    S.request?.abort();

    S.request = null;
    S.loading = false;
    S.mode = "search";

    setModeClass("search");

    selectTab();

    activateNavigation("search");

    heading.textContent = "جست‌وجوی سراسری";
    count.textContent = "افراد، کانال‌ها، گروه‌ها و پست‌ها";

    updateSearchFilters();

    if (!search.value.trim()) {
      S.searchItems = [];
      S.items = [];
      S.searchQuery = "";
      S.searchFilter = "all";
      updateSearchFilters();
      renderSearchWelcome();
    } else if (
      S.searchQuery === search.value.trim() &&
      S.searchItems.length
    ) {
      applySearchFilter();
    } else {
      performSearch(search.value);
    }

    setTimeout(() => {
      search.focus();

      try {
        search.setSelectionRange(
          search.value.length,
          search.value.length
        );
      } catch {}
    }, 60);
  }

  async function load(mode = S.mode) {
    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = mode;

    const views = {
      feed: {
        title: "برای تو",
        sub: "انتخاب‌هایی که به سلیقه‌ات نزدیک‌ترند",
        glyph: "✦",
        heading: "منتخب برای تو",
        path: `/feed?limit=18&session_id=${encodeURIComponent(SESSION_ID)}`
      },
      trending: {
        title: "نبض امروز",
        sub: "پست‌هایی که همین حالا بیشتر دیده می‌شوند",
        glyph: "↗",
        heading: "داغ‌ترین‌های امروز",
        path: "/trending?limit=18"
      },
      fresh: {
        title: "تازه رسیده‌ها",
        sub: "قبل از همه، کشف‌های تازه را ببین",
        glyph: "◌",
        heading: "کشف‌های تازه",
        path: "/explore?limit=18"
      },
      explore: {
        title: "اکسپلور",
        sub: "",
        glyph: "◈",
        heading: "اکسپلور",
        path: "/explore?limit=24"
      }
    };

    const view = views[mode] || views.feed;

    setModeClass(mode);

    $("discoverTitle").textContent = view.title;
    $("discoverSub").textContent = view.sub;
    $("discoverGlyph").textContent = view.glyph;
    heading.textContent = view.heading;

    selectTab(mode);

    activateNavigation(mode);
    showSkeletons();

    try {
      const data = await api(view.path, {
        signal: controller.signal
      });

      S.items = arrangeItems(
        data.items || data.results || [],
        mode
      );
      S.cache[mode] = S.items;

      render();

      status.textContent = "آنلاین";
      status.classList.add("online");
    } catch (error) {
      if (error.name !== "AbortError") {
        grid.setAttribute("aria-busy", "false");

        grid.innerHTML = `
          <div class="empty">
            ارتباط برقرار نشد.
            <br>
            <small>${escapeHtml(error.message)}</small>
          </div>
        `;

        status.textContent = "نیاز به اتصال";
        status.classList.remove("online");
      }
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }
  }

  async function performSearch(value) {
    const query = value.trim();

    if (!query) {
      openSearch();
      return;
    }

    if ([...query].length < 2) {
      S.mode = "search";
      S.searchItems = [];
      S.items = [];
      S.searchQuery = query;
      S.searchFilter = "all";

      setModeClass("search");
      selectTab();
      activateNavigation("search");
      updateSearchFilters();

      heading.textContent = "جست‌وجوی سراسری";
      count.textContent = "حداقل دو حرف";

      renderSearchWelcome(
        "برای شروع جست‌وجو حداقل دو حرف بنویس."
      );
      return;
    }

    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = "search";
    S.searchQuery = query;
    S.searchFilter = "all";

    setModeClass("search");

    selectTab();

    activateNavigation("search");
    showSkeletons();

    updateSearchFilters();

    heading.textContent = `نتایج سراسری «${query}»`;
    count.textContent = "در حال جست‌وجو";

    try {
      const data = await api(
        `/api/telegram/search?q=${encodeURIComponent(query)}&limit=50`,
        { signal: controller.signal }
      );

      S.searchItems = prepareGlobalResults(
        data.items || data.results || [],
        query
      );

      S.cache.search = S.searchItems;

      applySearchFilter("all");

      api("/search-history", {
        method: "POST",
        body: JSON.stringify({
          query,
          result_count: S.searchItems.length
        })
      }).catch(() => {});

      status.textContent = "جست‌وجوی سراسری";

      status.classList.add("online");
    } catch (error) {
      if (error.name !== "AbortError") {
        S.searchItems = [];
        S.items = [];
        updateSearchFilters();
        grid.setAttribute("aria-busy", "false");

        grid.innerHTML = `
          <div class="empty">
            جست‌وجوی سراسری انجام نشد.
            <br>
            <small>${escapeHtml(error.message)}</small>
          </div>
        `;

        status.textContent = "خطای جست‌وجو";
        status.classList.remove("online");
      }
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }
  }

  async function saveItem(item, button) {
    const contentId = saveContentId(item);

    if (!contentId) {
      showToast("این نتیجه مستقیماً در تلگرام باز می‌شود");
      return;
    }

    if (item.is_saved) {
      try {
        await api("/unsave", {
          method: "POST",
          body: JSON.stringify({
            content_id: contentId,
            session_id: SESSION_ID
          })
        });

        item.is_saved = false;

        if (S.mode === "saved") {
          S.items = S.items.filter(entry => entry !== item);
          render();
        } else if (button) {
          button.classList.remove("saved");
          button.textContent = "♡";
        }

        $("viewerSave").textContent = "♡";
        showToast("از ذخیره‌ها حذف شد");
        haptic("medium");
      } catch {
        showToast("حذف از ذخیره‌ها انجام نشد");
      }

      return;
    }

    try {
      await api("/save", {
        method: "POST",
        body: JSON.stringify({
          content_id: contentId,
          session_id: SESSION_ID
        })
      });

      item.is_saved = true;

      if (button) {
        button.classList.add("saved");
        button.textContent = "♥";
      }

      $("viewerSave").textContent = "♥";

      showToast("به ذخیره‌ها اضافه شد");
      haptic("medium");
    } catch {
      showToast("ذخیره انجام نشد");
    }
  }

  function openCurrentTelegram() {
    const url = sourceUrl(S.current || {});

    if (!url) {
      showToast("لینک این نتیجه در دسترس نیست");
      return;
    }

    try {
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, "_blank", "noopener");
      }
    } catch {
      window.open(url, "_blank", "noopener");
    }
  }

  function showViewer(item) {
    S.current = item;
    S.viewerOpenedAt = Date.now();

    const [firstColor, secondColor] = palette(item);
    const type = contentType(item);
    const poster = posterUrl(item);
    const asset = assetUrl(item);
    const proxyPreview = previewUrl(item);
    const telegramEmbed = embedUrl(item);

    const isVideo =
      type === "VIDEO" &&
      Boolean(asset);

    const image =
      !isVideo
        ? (
            poster ||
            (
              ["IMAGE", "PHOTO"].includes(type)
                ? asset
                : ""
            ) ||
            (
              ["IMAGE", "PHOTO", "VIDEO", "MIXED"].includes(type)
                ? proxyPreview
                : ""
            )
          )
        : "";

    const titleText = cleanText(item.title || "");

    const bodyText = cleanText(
      item.description ||
      item.text ||
      item.message ||
      item.title ||
      ""
    );

    $("viewerMedia").style.setProperty(
      "--vg1",
      firstColor
    );

    $("viewerMedia").style.setProperty(
      "--vg2",
      secondColor
    );

    const viewerImage = $("viewerImage");
    const viewerVideo = $("viewerVideo");
    const viewerEmbed = $("viewerEmbed");

    viewerImage.hidden = !image;

    if (image) {
      let triedProxy =
        image === proxyPreview ||
        !proxyPreview;

      viewerImage.src = image;

      viewerImage.onerror = () => {
        if (!triedProxy && proxyPreview) {
          triedProxy = true;
          viewerImage.src = proxyPreview;
          return;
        }

        viewerImage.hidden = true;

        if (telegramEmbed) {
          viewerEmbed.hidden = false;
          viewerEmbed.src = telegramEmbed;
        }
      };
    }

    viewerVideo.hidden = !isVideo;

    if (isVideo) {
      viewerVideo.src = asset;
      viewerVideo.poster = poster || proxyPreview || "";

      viewerVideo.onerror = () => {
        if (telegramEmbed) {
          viewerVideo.hidden = true;
          viewerEmbed.hidden = false;
          viewerEmbed.src = telegramEmbed;
        }
      };
    }

    viewerEmbed.hidden =
      Boolean(image || isVideo || !telegramEmbed);

    if (!image && !isVideo && telegramEmbed) {
      viewerEmbed.src = telegramEmbed;
    }

    $("viewerTitle").textContent =
      titleText &&
      bodyText &&
      titleText !== bodyText &&
      !bodyText.startsWith(titleText)
        ? titleText
        : "";

    $("viewerChannel").textContent =
      channel(item);

    const viewerAvatar = $("viewerAvatar");
    const avatarImage = channelAvatarUrl(item);

    viewerAvatar.textContent = channel(item).slice(0, 1);

    if (avatarImage) {
      const imageElement = document.createElement("img");

      imageElement.src = avatarImage;
      imageElement.alt = "";
      imageElement.referrerPolicy = "no-referrer";
      imageElement.onerror = () => imageElement.remove();

      viewerAvatar.append(imageElement);
    }

    $("viewerMeta").textContent =
      formatDate(item.published_at || item.date);

    $("viewerDesc").textContent =
      bodyText ||
      titleText ||
      "این پست را در تلگرام ببین.";

    const canPersonalize = Boolean(
      saveContentId(item)
    );

    const kind = globalResultKind(item);
    const openLabel = ({
      user: "دیدن پروفایل در تلگرام",
      bot: "بازکردن ربات در تلگرام",
      channel: "دیدن کانال در تلگرام",
      group: "دیدن گروه در تلگرام",
      post: "دیدن پست در تلگرام"
    })[kind] || "بازکردن در تلگرام";

    $("openTelegram").textContent = openLabel;

    $("viewerSave").hidden = !canPersonalize;
    $("notInterested").hidden = !canPersonalize;
    $("viewerFeedback").hidden = !canPersonalize;

    $("viewerSave").textContent =
      item.is_saved ? "♥" : "♡";

    const followButton = $("viewerFollow");
    const creatorId = internalCreatorId(item);

    followButton.hidden = !creatorId;
    followButton.classList.toggle("following", Boolean(item.is_following));
    followButton.textContent = item.is_following
      ? "دنبال می‌کنی"
      : "دنبال‌کردن";

    $("back").classList.add("show");
    $("viewer").classList.add("show");

    document.body.style.overflow = "hidden";

    requestAnimationFrame(() => {
      const focusTarget = isTelegramHost
        ? $("viewer")
        : $("viewerClose");

      try {
        focusTarget.focus({ preventScroll:true });
      } catch {}
    });

    try {
      tg?.BackButton?.show();

      if (nativeMain) {
        tg.MainButton
          .setText(openLabel)
          .show();
      }
    } catch {}

    haptic();

    const contentId = saveContentId(item);

    if (contentId) {
      api("/events", {
        method: "POST",
        body: JSON.stringify({
          content_id: contentId,
          event_type: "open",
          session_id: SESSION_ID
        })
      }).catch(() => {});
    }
  }

  function hide() {
    if (!$("viewer").classList.contains("show")) {
      return;
    }

    const viewedItem = S.current;
    const viewedFor = S.viewerOpenedAt
      ? Math.round((Date.now() - S.viewerOpenedAt) / 1000)
      : 0;

    $("back").classList.remove("show");
    $("viewer").classList.remove("show");

    $("viewerVideo").pause();
    $("viewerVideo").removeAttribute("src");
    $("viewerImage").removeAttribute("src");
    $("viewerEmbed").removeAttribute("src");

    $("viewerImage").onerror = null;
    $("viewerVideo").onerror = null;

    document.body.style.overflow = "";

    try {
      tg?.BackButton?.hide();
      tg?.MainButton?.hide();
    } catch {}

    S.current = null;
    S.viewerOpenedAt = 0;

    const viewedContentId = saveContentId(viewedItem || {});

    if (viewedContentId && viewedFor >= 3) {
      api("/events", {
        method: "POST",
        body: JSON.stringify({
          content_id: viewedContentId,
          event_type: viewedFor >= 12 ? "long_view" : "view",
          watch_duration_seconds: viewedFor,
          session_id: SESSION_ID
        })
      }).catch(() => {});
    }

    const returnFocus = S.returnFocus;

    S.returnFocus = null;

    try {
      returnFocus?.focus({ preventScroll:true });
    } catch {}
  }

  async function sendFeedback(type) {
    if (!S.current) return;

    const current = S.current;

    try {
      await api("/feedback", {
        method: "POST",
        body: JSON.stringify({
          content_id:
            current.content_id || current.id,
          creator_id: current.creator_id,
          feedback_type: type
        })
      });

      S.items = S.items.filter(
        item => item !== current
      );

      hide();
      render();
      showToast("بازخوردت ثبت شد");
    } catch {
      showToast("بازخورد ثبت نشد");
    }
  }

  async function toggleCurrentCreatorFollow() {
    const item = S.current;
    const creatorId = internalCreatorId(item || {});

    if (!item || !creatorId) {
      return;
    }

    const next = !item.is_following;
    const button = $("viewerFollow");
    button.disabled = true;

    try {
      await api("/follow", {
        method: "POST",
        body: JSON.stringify({
          creator_id: creatorId,
          following: next
        })
      });

      item.is_following = next;
      button.classList.toggle("following", next);
      button.textContent = next ? "دنبال می‌کنی" : "دنبال‌کردن";
      showToast(next ? "کانال دنبال شد" : "دنبال‌کردن متوقف شد");
      haptic("medium");
    } catch {
      showToast("تغییر دنبال‌کردن انجام نشد");
    } finally {
      button.disabled = false;
    }
  }

  async function loadSaved() {
    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = "saved";

    setModeClass("saved");

    selectTab();

    activateNavigation("saved");

    heading.textContent = "ذخیره‌های تو";
    count.textContent = "در حال دریافت";

    showSkeletons();

    try {
      const data = await api(
        "/saved?limit=18",
        { signal: controller.signal }
      );

      S.items = data.items || data.results || [];
    } catch {
      const seen = new Set();

      S.items = Object
        .values(S.cache)
        .flat()
        .filter(item => {
          if (!item || !item.is_saved) {
            return false;
          }

          const id = item.content_id || item.id;

          if (seen.has(id)) {
            return false;
          }

          seen.add(id);
          return true;
        });
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }

    render();

    if (!S.items.length) {
      grid.innerHTML = `
        <div class="empty">
          هنوز پستی ذخیره نکرده‌ای.
          <br>
          روی قلب هر پست بزن تا اینجا نگهش داری.
        </div>
      `;
    }
  }

  const faNumber = value =>
    Number(value || 0).toLocaleString("fa-IR");

  const faPercent = value =>
    `${Math.round(Number(value || 0) * 100).toLocaleString("fa-IR")}٪`;

  function renderHub({ profile, notifications, preferences, topics, dashboard, claims }) {
    const user = profile?.user || {};
    const follows = Array.isArray(profile?.follows) ? profile.follows : [];
    const notificationItems = Array.isArray(notifications?.items) ? notifications.items : [];
    const creators = Array.isArray(dashboard?.creators) ? dashboard.creators : [];
    const claimItems = Array.isArray(claims?.claims) ? claims.claims : [];
    const unread = Number(notifications?.unread ?? profile?.unread_notifications ?? 0);
    const name = cleanText(user.display_name || user.username || "کاربر تلگرام");
    const username = user.username ? `@${user.username}` : "حساب متصل به تلگرام";

    S.topics = Array.isArray(topics?.items) ? topics.items : [];
    S.preferences = preferences?.preferences || {
      in_app_enabled:true,
      followed_creators:true,
      personalized_digest:true
    };

    $("hubBadge").textContent = Math.min(unread, 99).toLocaleString("fa-IR");
    $("hubBadge").classList.toggle("show", unread > 0);

    grid.innerHTML = `
      <section class="hub">
        <div class="hubHero">
          <div class="hubAvatar">${escapeHtml(name.slice(0, 1) || "ت")}</div>
          <div class="hubIdentity">
            <b>${escapeHtml(name)}</b>
            <span>${escapeHtml(username)}</span>
          </div>
          <div class="hubStats">
            <b>${faNumber(follows.length)}</b>
            <span>دنبال‌شده</span>
          </div>
        </div>

        <div class="hubQuick">
          <button data-hub-action="history"><b>◷</b><span>تاریخچه تماشا</span></button>
          <button data-hub-action="saved"><b>♥</b><span>ذخیره‌ها</span></button>
          <button data-hub-action="read-all"><b>●</b><span>${unread ? `${faNumber(unread)} اعلان تازه` : "همه اعلان‌ها خوانده شد"}</span></button>
          <button data-hub-action="refresh"><b>↻</b><span>به‌روزرسانی</span></button>
        </div>

        <div class="hubPanel">
          <div class="hubPanelHead">
            <h3>اعلان‌های شخصی</h3>
            ${unread ? '<button data-hub-action="read-all">خواندن همه</button>' : ""}
          </div>
          <div class="hubList">
            ${notificationItems.length ? notificationItems.slice(0, 8).map(item => `
              <button class="hubRow" data-notification-id="${escapeHtml(item.id)}" data-notification-url="${escapeHtml(safeUrl(item.action_url))}">
                <span class="hubRowDot ${item.read_at ? "" : "unread"}"></span>
                <span class="hubRowCopy">
                  <b>${escapeHtml(item.title)}</b>
                  <span>${escapeHtml(item.body)} · ${escapeHtml(formatDate(item.created_at))}</span>
                </span>
              </button>
            `).join("") : '<div class="hubEmpty">هنوز اعلان تازه‌ای نیست. پیشنهادهای شخصی و پست‌های کانال‌های دنبال‌شده اینجا می‌آیند.</div>'}
          </div>
        </div>

        <div class="hubPanel">
          <div class="hubPanelHead">
            <h3>علایق تو</h3>
            <span class="hubHint">حداکثر ۱۲ موضوع</span>
          </div>
          <div class="topicPicker">
            ${S.topics.map(topic => `
              <button class="topicChip ${topic.selected ? "selected" : ""}" data-topic-id="${escapeHtml(topic.id)}" aria-pressed="${String(Boolean(topic.selected))}">
                ${escapeHtml(topic.name)}
              </button>
            `).join("")}
          </div>
          <button class="hubButton hubSave" id="saveInterests">ذخیره علایق و بهترکردن فید</button>
        </div>

        <div class="hubPanel">
          <div class="hubPanelHead"><h3>تنظیم اعلان‌ها</h3></div>
          <label class="settingRow"><span>اعلان داخل برنامه</span><input id="prefEnabled" type="checkbox" ${S.preferences.in_app_enabled ? "checked" : ""}></label>
          <label class="settingRow"><span>پست تازهٔ کانال‌های دنبال‌شده</span><input id="prefFollows" type="checkbox" ${S.preferences.followed_creators ? "checked" : ""}></label>
          <label class="settingRow"><span>پیشنهاد شخصی روزانه</span><input id="prefDigest" type="checkbox" ${S.preferences.personalized_digest ? "checked" : ""}></label>
          <button class="hubButton hubSave" id="savePreferences">ذخیره تنظیمات اعلان</button>
        </div>

        <div class="hubPanel">
          <div class="hubPanelHead"><h3>داشبورد سازنده</h3></div>
          <div class="hubList">
            ${creators.length ? creators.map(creator => `
              <div class="creatorCard">
                <div class="creatorCardHead">
                  <b>${escapeHtml(creator.creator_name || creator.creator_username || "کانال")}</b>
                  <button data-creator-content="${escapeHtml(creator.creator_id)}" data-creator-name="${escapeHtml(creator.creator_name || "کانال")}">جزئیات محتوا</button>
                </div>
                <div class="creatorMetricGrid">
                  <div class="creatorMetric"><b>${faNumber(creator.total_impressions)}</b><span>نمایش</span></div>
                  <div class="creatorMetric"><b>${faNumber(creator.total_opens)}</b><span>بازشدن</span></div>
                  <div class="creatorMetric"><b>${faNumber(creator.total_saves)}</b><span>ذخیره</span></div>
                  <div class="creatorMetric"><b>${faNumber(creator.total_follows)}</b><span>دنبال‌کننده</span></div>
                  <div class="creatorMetric"><b>${faPercent(creator.save_rate)}</b><span>نرخ ذخیره</span></div>
                  <div class="creatorMetric"><b>${faNumber(creator.impressions_7d)}</b><span>نمایش ۷ روز</span></div>
                </div>
              </div>
            `).join("") : '<div class="hubEmpty">برای دیدن آمار، مالکیت کانالت را ثبت کن. پس از تأیید، نمایش‌ها، بازشدن‌ها و ذخیره‌ها اینجا دیده می‌شوند.</div>'}
          </div>
          <div id="creatorDetail"></div>
          ${claimItems.length ? `
            <div class="hubHint">${claimItems.map(claim => `${escapeHtml(claim.creators?.name || claim.creators?.username || "کانال")}: ${escapeHtml(claim.status)}`).join(" · ")}</div>
          ` : ""}
          <div class="claimForm">
            <input id="claimUsername" dir="ltr" placeholder="@channel_username" aria-label="نام کاربری کانال">
            <button id="submitClaim">ثبت مالکیت</button>
          </div>
        </div>
      </section>
    `;

    bindHubEvents();
  }

  function bindHubEvents() {
    grid.querySelectorAll("[data-hub-action]").forEach(button => {
      button.onclick = () => {
        const action = button.dataset.hubAction;
        if (action === "history") loadHistory();
        if (action === "saved") loadSaved();
        if (action === "refresh") loadHub();
        if (action === "read-all") markNotificationsRead();
      };
    });

    grid.querySelectorAll("[data-topic-id]").forEach(button => {
      button.onclick = () => {
        const selected = !button.classList.contains("selected");
        const selectedCount = grid.querySelectorAll("[data-topic-id].selected").length;

        if (selected && selectedCount >= 12) {
          showToast("حداکثر ۱۲ موضوع انتخاب کن");
          return;
        }

        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
        haptic();
      };
    });

    $("saveInterests")?.addEventListener("click", saveInterests);
    $("savePreferences")?.addEventListener("click", savePreferences);
    $("submitClaim")?.addEventListener("click", submitCreatorClaim);

    grid.querySelectorAll("[data-notification-id]").forEach(button => {
      button.onclick = () => openNotification(button);
    });

    grid.querySelectorAll("[data-creator-content]").forEach(button => {
      button.onclick = () => loadCreatorContent(
        button.dataset.creatorContent,
        button.dataset.creatorName
      );
    });
  }

  async function loadHub() {
    clearTimeout(searchTimer);
    S.request?.abort();
    S.request = null;
    S.loading = true;
    S.mode = "hub";

    setModeClass("hub");
    selectTab();
    activateNavigation("hub");
    heading.textContent = "فضای شخصی تو";
    count.textContent = "در حال آماده‌سازی";
    showSkeletons();

    try {
      const results = await Promise.allSettled([
        api("/profile"),
        api("/notifications?limit=20"),
        api("/notification-preferences"),
        api("/topics"),
        api("/api/creator/dashboard"),
        api("/api/creator/claims")
      ]);

      if (results.every(result => result.status === "rejected")) {
        throw results[0].reason;
      }

      const value = (index, fallback) =>
        results[index].status === "fulfilled"
          ? results[index].value
          : fallback;

      const profile = value(0, { user:{}, follows:[] });
      const notifications = value(1, { items:[], unread:0 });

      renderHub({
        profile,
        notifications,
        preferences:value(2, { preferences:null }),
        topics:value(3, { items:[] }),
        dashboard:value(4, { creators:[] }),
        claims:value(5, { claims:[] })
      });

      count.textContent = `${faNumber(notifications.unread)} اعلان خوانده‌نشده`;
      status.textContent = "حساب همگام شد";
      status.classList.add("online");
    } catch (error) {
      grid.innerHTML = `<div class="empty">فضای شخصی بارگذاری نشد.<br><small>${escapeHtml(error.message)}</small></div>`;
      status.textContent = "خطای همگام‌سازی";
      status.classList.remove("online");
    } finally {
      S.loading = false;
      grid.setAttribute("aria-busy", "false");
    }
  }

  async function loadHistory() {
    S.mode = "history";
    setModeClass("history");
    selectTab();
    activateNavigation("history");
    heading.textContent = "تاریخچه تماشا";
    count.textContent = "در حال دریافت";
    showSkeletons();

    try {
      const data = await api("/history?limit=50");
      S.items = data.items || [];
      render();
      grid.insertAdjacentHTML("afterbegin", `
        <div class="hubQuick">
          <button id="historyBack"><b>→</b><span>بازگشت به من</span></button>
          <button id="clearHistory"><b>×</b><span>پاک‌کردن تاریخچه</span></button>
        </div>
      `);
      $("historyBack").onclick = loadHub;
      $("clearHistory").onclick = clearHistory;
      if (!S.items.length) count.textContent = "هنوز چیزی ندیده‌ای";
    } catch (error) {
      grid.innerHTML = `<div class="empty">تاریخچه دریافت نشد.<br><small>${escapeHtml(error.message)}</small></div>`;
    }
  }

  function askConfirmation(message) {
    if (tg?.showConfirm) {
      return new Promise(resolve => tg.showConfirm(message, resolve));
    }

    return Promise.resolve(window.confirm(message));
  }

  async function clearHistory() {
    if (!await askConfirmation("تاریخچه مشاهده پاک شود؟")) return;

    try {
      await api("/history", { method:"DELETE", body:"{}" });
      S.impressed.clear();
      showToast("تاریخچه پاک شد");
      loadHistory();
    } catch {
      showToast("پاک‌کردن تاریخچه انجام نشد");
    }
  }

  async function markNotificationsRead() {
    try {
      await api("/notifications/read", { method:"POST", body:"{}" });
      $("hubBadge").classList.remove("show");
      showToast("اعلان‌ها خوانده شد");
      loadHub();
    } catch {
      showToast("اعلان‌ها به‌روزرسانی نشد");
    }
  }

  async function openNotification(button) {
    const id = button.dataset.notificationId;
    const url = safeUrl(button.dataset.notificationUrl);

    api("/notifications/read", {
      method:"POST",
      body:JSON.stringify({ notification_id:id })
    }).catch(() => {});

    if (url) {
      try {
        tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank", "noopener");
      } catch {
        window.open(url, "_blank", "noopener");
      }
    }

    button.querySelector(".hubRowDot")?.classList.remove("unread");
  }

  async function saveInterests() {
    const topicIds = [...grid.querySelectorAll("[data-topic-id].selected")]
      .map(button => button.dataset.topicId);

    try {
      await api("/interests", {
        method:"PUT",
        body:JSON.stringify({ topic_ids:topicIds })
      });
      S.cache.feed = [];
      S.impressed.clear();
      showToast("علایق ذخیره شد؛ فید تازه می‌شود");
      haptic("medium");
    } catch {
      showToast("ذخیره علایق انجام نشد");
    }
  }

  async function savePreferences() {
    try {
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      const data = await api("/notification-preferences", {
        method:"PUT",
        body:JSON.stringify({
          in_app_enabled:$("prefEnabled").checked,
          followed_creators:$("prefFollows").checked,
          personalized_digest:$("prefDigest").checked,
          timezone
        })
      });
      S.preferences = data.preferences;
      showToast("تنظیمات اعلان ذخیره شد");
      haptic("medium");
    } catch {
      showToast("ذخیره تنظیمات انجام نشد");
    }
  }

  async function submitCreatorClaim() {
    const input = $("claimUsername");
    const username = input.value.trim();

    if (!username) {
      showToast("نام کاربری کانال را بنویس");
      input.focus();
      return;
    }

    try {
      await api("/api/creator/claim", {
        method:"POST",
        body:JSON.stringify({ username })
      });
      showToast("درخواست مالکیت ثبت شد");
      haptic("medium");
      loadHub();
    } catch (error) {
      showToast(error.message || "ثبت مالکیت انجام نشد");
    }
  }

  async function loadCreatorContent(creatorId, creatorName) {
    const target = $("creatorDetail");
    if (!target) return;

    target.innerHTML = '<div class="hubEmpty">در حال دریافت آمار محتوا…</div>';

    try {
      const data = await api(`/api/creator/content?creator_id=${encodeURIComponent(creatorId)}&limit=20`);
      const items = Array.isArray(data.items) ? data.items : [];
      target.innerHTML = `
        <div class="hubPanelHead"><h3>${escapeHtml(creatorName)}</h3></div>
        <div class="hubList">
          ${items.length ? items.map(item => `
            <a class="hubRow" href="${escapeHtml(safeUrl(item.source_url))}" target="_blank" rel="noopener">
              <span class="hubRowCopy">
                <b>${escapeHtml(cleanText(item.title || "پست تلگرام"))}</b>
                <span>${faNumber(item.impressions)} نمایش · ${faNumber(item.opens)} بازشدن · ${faNumber(item.saves)} ذخیره · ${faPercent(item.save_rate)}</span>
              </span>
            </a>
          `).join("") : '<div class="hubEmpty">هنوز محتوایی برای این کانال ثبت نشده است.</div>'}
        </div>
      `;
    } catch (error) {
      target.innerHTML = `<div class="hubEmpty">آمار محتوا دریافت نشد: ${escapeHtml(error.message)}</div>`;
    }
  }

  let searchTimer;

  document.querySelectorAll(".tab").forEach(button => {
    button.onclick = () => {
      haptic();
      load(button.dataset.mode);
    };
  });

  document.querySelectorAll("[data-nav]").forEach(button => {
    button.onclick = () => {
      haptic();
      load(button.dataset.nav);
    };
  });

  $("searchAction").onclick = () => {
    performSearch(search.value);
  };

  document
    .querySelectorAll("[data-search-filter]")
    .forEach(button => {
      button.onclick = () => {
        haptic();
        applySearchFilter(
          button.dataset.searchFilter
        );
      };
    });

  search.oninput = () => {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
      performSearch(search.value);
    }, 500);
  };

  search.onkeydown = event => {
    if (event.key === "Enter") {
      event.preventDefault();
      performSearch(search.value);
    }
  };

  $("focusSearch").onclick = () => {
    haptic();
    openSearch();
  };

  $("saved").onclick = () => {
    haptic();
    loadSaved();
  };

  $("hub").onclick = () => {
    haptic();
    loadHub();
  };

  $("back").onclick = hide;
  $("viewerClose").onclick = hide;

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      hide();
    }
  });

  $("viewerSave").onclick = () => {
    if (S.current) {
      saveItem(S.current, $("viewerSave"));
    }
  };

  $("viewerFollow").onclick =
    toggleCurrentCreatorFollow;

  $("openTelegram").onclick =
    openCurrentTelegram;

  $("notInterested").onclick = () => {
    sendFeedback("not_interested");
  };

  document
    .querySelectorAll("[data-feedback]")
    .forEach(button => {
      button.onclick = () => {
        sendFeedback(button.dataset.feedback);
      };
    });

  load("feed");
})();

// ADD CHANNEL TO DISCOVERY

(function(){

const openBtn=document.getElementById("openAddChannel");
const modal=document.getElementById("addChannelModal");
const closeBtn=document.getElementById("addChannelClose");
const submit=document.getElementById("addChannelSubmit");
const input=document.getElementById("addChannelInput");
const msg=document.getElementById("addChannelMessage");

if(!openBtn) return;

openBtn.onclick=()=>{
 modal.classList.add("open");
 input.focus();
};

closeBtn.onclick=()=>{
 modal.classList.remove("open");
};

modal.onclick=(e)=>{
 if(e.target===modal) modal.classList.remove("open");
};

submit.onclick=async()=>{

 let channel=input.value.trim();

 channel=channel
 .replace(/^https?:\/\/t\.me\//,"")
 .replace(/^t\.me\//,"")
 .replace(/^@/,"")
 .split("/")[0];

 if(!channel){
   msg.innerHTML="نام کانال را وارد کن";
   return;
 }

 submit.disabled=true;

 try{

 const res=await fetch("/api/creator/channel/add",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "x-telegram-init-data":
    window.Telegram?.WebApp?.initData || ""
  },
  body:JSON.stringify({channel})
 });

 const data=await res.json();

 if(!res.ok)
   throw new Error(data.error||"خطا در ثبت کانال");

 msg.innerHTML=
 data.bot_admin
 ?
 "✅ کانال ثبت شد و ربات دسترسی کامل دارد."
 :
 "✅ کانال ثبت شد و وارد Discovery شد. برای Tracking عضویت، ربات باید ادمین شود.";

 setTimeout(()=>{
   modal.classList.remove("open");
   input.value="";
 },1800);

 }catch(e){

 msg.innerHTML="❌ "+e.message;

 }finally{

 submit.disabled=false;

 }

};

})();
