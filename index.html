<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>کشف — بهترین‌های تلگرام برای تو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#08090d);--surface:var(--tg-theme-secondary-bg-color,#14161d);--text:var(--tg-theme-text-color,#f7f8fb);--muted:var(--tg-theme-hint-color,#969cab);--accent:var(--tg-theme-button-color,#7658ff);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(255,255,255,.1);--safeT:max(10px,var(--tg-content-safe-area-inset-top,0px));--safeB:max(10px,var(--tg-safe-area-inset-bottom,0px))}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--bg);font-family:Tahoma,Arial,sans-serif;overscroll-behavior-y:none}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{min-height:100svh;padding:calc(var(--safeT) + 8px) 10px calc(88px + var(--safeB))}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:8px 2px 10px;background:linear-gradient(var(--bg) 70%,transparent)}.brand{display:flex;align-items:center;gap:9px}.mark{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:linear-gradient(145deg,#7258ff,#b44bff 55%,#ff5578);box-shadow:0 10px 32px rgba(132,77,255,.35)}h1{margin:0;font-size:1.12rem}.eyebrow{margin-top:3px;color:var(--muted);font-size:.73rem}.status{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.045);font-size:.74rem}.status:before{content:'';width:7px;height:7px;border-radius:50%;background:#ffb020}.status.online:before{background:#3ddc97;box-shadow:0 0 12px #3ddc97}
.welcome{position:relative;min-height:172px;margin:3px 0 14px;padding:22px;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:radial-gradient(150px 120px at 10% 10%,rgba(255,75,139,.35),transparent 72%),radial-gradient(230px 170px at 96% 0,rgba(92,94,255,.42),transparent 72%),linear-gradient(145deg,#151822,#0d0f15);box-shadow:0 20px 55px rgba(0,0,0,.28)}.welcome:after{content:'✦';position:absolute;left:18px;bottom:-40px;color:rgba(255,255,255,.07);font-size:9rem;transform:rotate(-12deg)}.welcome b{color:#c7baff;font-size:.78rem}.welcome h2{max-width:330px;margin:9px 0 7px;font-size:clamp(1.45rem,7vw,2rem);line-height:1.45}.welcome p{max-width:350px;margin:0;color:#b9bdc9;font-size:.82rem;line-height:1.8}
.searchbar{position:sticky;top:58px;z-index:29;display:flex;gap:8px;margin-bottom:10px;padding:5px;border:1px solid var(--line);border-radius:19px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);box-shadow:0 12px 30px rgba(0,0,0,.18)}.searchbar input{width:100%;min-height:46px;padding:0 14px;border:0;outline:0;color:var(--text);background:transparent;font-size:.9rem}.icon{width:46px;min-width:46px;min-height:46px;border:0;border-radius:15px;color:var(--text);background:rgba(255,255,255,.07)}
.tabs{display:flex;gap:8px;margin:4px -10px 13px;padding:2px 10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(255,255,255,.035);white-space:nowrap}.tab.active{border-color:transparent;color:#090a0e;background:#fff;font-weight:900}.head{display:flex;align-items:end;justify-content:space-between;margin:0 3px 11px}.head h2{margin:0;font-size:1.05rem}.head span{color:var(--muted);font-size:.74rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:dense;gap:9px}.card{position:relative;min-height:218px;padding:0;overflow:hidden;border:0;border-radius:23px;color:#fff;text-align:right;background:linear-gradient(150deg,var(--g1),var(--g2));box-shadow:0 13px 28px rgba(0,0,0,.24);cursor:pointer;isolation:isolate}.card.hero{grid-column:1/-1;min-height:330px}.card.tall{min-height:292px}.card.wide{grid-column:1/-1;min-height:205px}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.card:active .media{transform:scale(1.04)}.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.02) 18%,rgba(0,0,0,.2) 48%,rgba(0,0,0,.93) 100%),radial-gradient(200px 140px at 90% 0,rgba(255,255,255,.19),transparent 70%)}.type{position:absolute;left:12px;top:12px;z-index:3;min-width:35px;height:35px;padding:0 10px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);border-radius:13px;background:rgba(8,9,13,.38);backdrop-filter:blur(10px)}.save{position:absolute;right:12px;top:12px;z-index:4;width:40px;height:40px;border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#fff;background:rgba(8,9,13,.38);backdrop-filter:blur(10px)}.save.saved{color:#ff5c8a;background:#fff}.copy{position:absolute;right:0;left:0;bottom:0;z-index:2;padding:15px}.channel{display:flex;align-items:center;gap:7px;margin-bottom:8px;color:rgba(255,255,255,.82);font-size:.73rem}.avatar{width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.17);border-radius:9px;background:rgba(255,255,255,.17);font-weight:900}.title{display:-webkit-box;overflow:hidden;font-size:.9rem;font-weight:900;line-height:1.65;-webkit-box-orient:vertical;-webkit-line-clamp:3}.hero .title{max-width:88%;font-size:1.2rem}.meta{display:flex;gap:7px;margin-top:9px;color:rgba(255,255,255,.65);font-size:.68rem}.sk{min-height:230px;border-radius:23px;background:linear-gradient(100deg,var(--surface),rgba(255,255,255,.09),var(--surface));background-size:220% 100%;animation:p 1.15s infinite}.sk:first-child{grid-column:1/-1;min-height:330px}@keyframes p{to{background-position:-220% 0}}.empty{grid-column:1/-1;padding:52px 20px;border:1px dashed var(--line);border-radius:24px;color:var(--muted);text-align:center;line-height:1.9}
.nav{position:fixed;right:10px;left:10px;bottom:var(--safeB);z-index:40;height:66px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--surface) 91%,transparent);backdrop-filter:blur(24px);box-shadow:0 18px 48px rgba(0,0,0,.42)}.nav button{border:0;border-radius:16px;color:var(--muted);background:transparent;font-size:.73rem}.nav button span{display:block;margin-bottom:2px;font-size:1.15rem}.nav button.active{color:var(--text);background:rgba(255,255,255,.07)}
.back{position:fixed;inset:0;z-index:60;opacity:0;pointer-events:none;background:rgba(0,0,0,.76);backdrop-filter:blur(8px);transition:opacity .25s}.back.show{opacity:1;pointer-events:auto}.viewer{position:fixed;inset:0;z-index:61;display:flex;flex-direction:column;opacity:0;pointer-events:none;background:#08090d;transform:translateY(24px) scale(.985);transition:opacity .25s,transform .32s}.viewer.show{opacity:1;pointer-events:auto;transform:none}.viewerMedia{position:relative;min-height:44svh;overflow:hidden;background:linear-gradient(145deg,var(--vg1),var(--vg2))}.viewerMedia img{width:100%;height:100%;min-height:44svh;object-fit:cover}.viewerMedia:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.06) 48%,#08090d 100%)}.close{position:absolute;top:calc(var(--safeT) + 8px);right:12px;z-index:3;width:44px;height:44px;border:1px solid rgba(255,255,255,.2);border-radius:15px;color:#fff;background:rgba(0,0,0,.38);backdrop-filter:blur(12px)}.viewerBody{position:relative;z-index:2;flex:1;margin-top:-46px;padding:0 17px calc(18px + var(--safeB));overflow-y:auto}.viewerChannel{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:.82rem}.viewerChannel .avatar{width:34px;height:34px;border-radius:12px}.viewer h3{margin:0;font-size:1.28rem;line-height:1.75}.desc{margin:12px 0 16px;color:#bdc1cc;font-size:.88rem;line-height:2;white-space:pre-wrap}.feedback{display:flex;gap:7px;padding:4px 0 20px;overflow-x:auto}.feedback button{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:transparent;white-space:nowrap}.actions{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 54px 54px;gap:8px;padding-top:10px;background:linear-gradient(transparent,#08090d 28%)}.actions button{min-height:52px;border:1px solid var(--line);border-radius:17px;color:var(--text);background:#1a1d27}.actions .primary{border:0;color:var(--accentText);background:var(--accent);font-weight:900}.toast{position:fixed;right:50%;bottom:calc(88px + var(--safeB));z-index:90;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(26,29,39,.96);opacity:0;pointer-events:none;transform:translate(50%,12px);transition:.22s;font-size:.8rem;white-space:nowrap}.toast.show{opacity:1;transform:translate(50%,0)}
@media(min-width:680px){.app{max-width:880px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}.card.hero{grid-column:span 2;grid-row:span 2}.card.wide{grid-column:span 2}.nav{max-width:560px;margin:auto}.viewer{right:50%;left:auto;width:min(100%,620px);transform:translate(50%,24px) scale(.985)}.viewer.show{transform:translateX(50%)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div class="brand"><div class="mark">✦</div><div><h1>کشف</h1><div class="eyebrow">تلگرام، اما برای سلیقه تو</div></div></div><div class="status" id="status">در حال اتصال</div></header>
 <section class="welcome"><b>هر بار یک کشف تازه</b><h2>چیزی پیدا کن که ارزش دیدن داشته باشد.</h2><p>بهترین پست‌ها را از میان کانال‌ها می‌آوریم و با هر انتخاب، سلیقه‌ات را بهتر می‌شناسیم.</p></section>
 <div class="searchbar"><input id="search" type="search" placeholder="موضوع، کانال یا یک ایده…" aria-label="جست‌وجوی محتوا"><button class="icon" id="reload" aria-label="تازه‌سازی">↻</button></div>
 <div class="tabs" role="tablist"><button class="tab active" data-mode="feed">برای تو</button><button class="tab" data-mode="trending">داغ امروز</button><button class="tab" data-mode="explore">کشف تازه</button></div>
 <div class="head"><h2 id="heading">منتخب برای تو</h2><span id="count">—</span></div><main class="grid" id="grid" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="ناوبری اصلی"><button class="active" data-nav="feed"><span>⌂</span>برای تو</button><button data-nav="explore"><span>◈</span>اکسپلور</button><button id="focusSearch"><span>⌕</span>جست‌وجو</button><button id="saved"><span>♡</span>ذخیره‌ها</button></nav>
<div class="back" id="back"></div><article class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
 <div class="viewerMedia" id="viewerMedia"><button class="close" id="viewerClose" aria-label="بستن">×</button><img id="viewerImage" alt="" hidden></div>
 <div class="viewerBody"><div class="viewerChannel"><span class="avatar" id="viewerAvatar"></span><b id="viewerChannel"></b><span class="eyebrow" id="viewerMeta"></span></div><h3 id="viewerTitle"></h3><div class="desc" id="viewerDesc"></div>
 <div class="feedback"><button data-feedback="not_relevant">مرتبط نبود</button><button data-feedback="hide_creator">این کانال کمتر</button><button data-feedback="report">گزارش محتوا</button></div>
 <div class="actions"><button class="primary" id="openTelegram">دیدن پست در تلگرام</button><button id="viewerSave" aria-label="ذخیره">♡</button><button id="notInterested" aria-label="علاقه ندارم">−</button></div></div>
</article><div class="toast" id="toast" role="status"></div>
<script>
(()=>{const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#08090d');tg?.setBackgroundColor?.('#08090d')}catch{}
const API=location.protocol.startsWith('http')?location.origin+'/api/discovery':'https://telegram-discovery-app.paniapandora.workers.dev/api/discovery',S={mode:'feed',items:[],current:null,loading:false},$=id=>document.getElementById(id),grid=$('grid'),status=$('status'),heading=$('heading'),count=$('count'),search=$('search'),pal=[['#4d39bb','#a33ab1'],['#0b716d','#1a9c74'],['#a44c0a','#dd7642'],['#8d285f','#4934a9'],['#185da1','#228eaa'],['#71410b','#c58b25'],['#9b2844','#5a213d']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),hash=v=>[...String(v||'')].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0),palette=i=>pal[Math.abs(hash(i.channel_username||i.creator_id||i.content_id||i.id))%pal.length],txt=i=>String(i.title||i.description||i.text||i.message||'یک پست تازه از تلگرام').trim(),channel=i=>i.channel_name||i.channel_title||i.channel_username||((String(i.source_url||i.url||'').match(/t\.me\/([^/]+)/)||[])[1])||'Telegram',media=i=>i.thumbnail_url||i.image_url||i.media_url||i.photo_url||i.preview_url||null,safe=v=>{try{const u=new URL(v);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}},date=v=>{try{return v?new Intl.DateTimeFormat('fa-IR',{month:'short',day:'numeric'}).format(new Date(v)):'تازه'}catch{return'تازه'}},icon=t=>({TEXT:'✦',IMAGE:'▧',PHOTO:'▧',VIDEO:'▶',DOCUMENT:'▤',AUDIO:'♪',MIXED:'◆'}[String(t||'').toUpperCase()]||'✦'),headers=()=>({'x-telegram-init-data':tg?.initData||'','content-type':'application/json'});
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}function haptic(k='light'){try{tg?.HapticFeedback?.impactOccurred(k)}catch{}}async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...headers(),...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw Error(d.error||`HTTP ${r.status}`);return d}function sk(){grid.innerHTML=Array.from({length:8},()=>'<div class="sk"></div>').join('')}function cls(i,n){if(n===0)return'hero';if(n%7===0)return'wide';if(['IMAGE','PHOTO','VIDEO','DOCUMENT'].includes(String(i.content_type||'').toUpperCase())&&n%3===1)return'tall';return''}
function render(){count.textContent=`${S.items.length.toLocaleString('fa-IR')} محتوا`;if(!S.items.length){grid.innerHTML='<div class="empty">هنوز چیزی برای نمایش پیدا نشد.<br>یک موضوع دیگر را جست‌وجو کن یا دوباره تازه‌سازی کن.</div>';return}grid.innerHTML=S.items.map((i,n)=>{const[g1,g2]=palette(i),img=safe(media(i)),type=i.content_type||'TEXT';return`<article class="card ${cls(i,n)}" data-i="${n}" style="--g1:${g1};--g2:${g2}" tabindex="0" role="button" aria-label="مشاهده ${esc(txt(i))}">${img?`<img class="media" src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div class="shade"></div><span class="type">${icon(type)}</span><button class="save ${i.is_saved?'saved':''}" data-save="${n}" aria-label="ذخیره">${i.is_saved?'♥':'♡'}</button><div class="copy"><div class="channel"><span class="avatar">${esc(channel(i).slice(0,1))}</span>${esc(channel(i))}</div><div class="title">${esc(txt(i))}</div><div class="meta">${esc(String(type).toUpperCase())}<span>•</span>${esc(date(i.published_at||i.date))}</div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(c=>{const open=e=>{if(!e.target.closest('[data-save]'))show(S.items[+c.dataset.i])};c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e)}}});grid.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();saveItem(S.items[+b.dataset.save],b)})}
async function load(mode=S.mode){if(S.loading)return;S.loading=true;S.mode=mode;sk();heading.textContent={feed:'منتخب برای تو',trending:'داغ‌ترین‌های امروز',explore:'چیزهای تازه برای کشف'}[mode];document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===mode));try{const p=mode==='feed'?'/feed?limit=30':mode==='trending'?'/trending?limit=30':'/explore?limit=30',d=await api(p);S.items=d.items||d.results||[];render();status.textContent='آنلاین';status.classList.add('online')}catch(e){grid.innerHTML=`<div class="empty">ارتباط برقرار نشد.<br><small>${esc(e.message)}</small></div>`;status.textContent='نیاز به اتصال';status.classList.remove('online')}finally{S.loading=false}}
async function doSearch(q){q=q.trim();if(!q)return load(S.mode);sk();heading.textContent=`نتایج «${q}»`;try{const d=await api(`/search?q=${encodeURIComponent(q)}&limit=30`);S.items=d.items||d.results||[];render();status.textContent=d.source==='telegram_live'?'جست‌وجوی زنده':'نتایج هوشمند';status.classList.add('online')}catch{grid.innerHTML='<div class="empty">جست‌وجو انجام نشد؛ دوباره امتحان کن.</div>'}}
async function saveItem(i,b){if(i.is_saved)return toast('قبلاً ذخیره شده');try{await api('/save',{method:'POST',body:JSON.stringify({content_id:i.content_id||i.id})});i.is_saved=true;if(b){b.classList.add('saved');b.textContent='♥'}$('viewerSave').textContent='♥';toast('به ذخیره‌ها اضافه شد');haptic('medium')}catch{toast('ذخیره انجام نشد')}}
function show(i){S.current=i;const[a,b]=palette(i),img=safe(media(i));$('viewerMedia').style.setProperty('--vg1',a);$('viewerMedia').style.setProperty('--vg2',b);$('viewerImage').hidden=!img;if(img)$('viewerImage').src=img;$('viewerTitle').textContent=txt(i);$('viewerChannel').textContent=channel(i);$('viewerAvatar').textContent=channel(i).slice(0,1);$('viewerMeta').textContent=date(i.published_at||i.date);$('viewerDesc').textContent=i.description||i.text||i.message||i.title||'';$('viewerSave').textContent=i.is_saved?'♥':'♡';$('back').classList.add('show');$('viewer').classList.add('show');document.body.style.overflow='hidden';haptic();api('/events',{method:'POST',body:JSON.stringify({content_id:i.content_id||i.id,event_type:'open'})}).catch(()=>{})}function hide(){$('back').classList.remove('show');$('viewer').classList.remove('show');document.body.style.overflow='';S.current=null}async function feedback(t){if(!S.current)return;const cur=S.current;try{await api('/feedback',{method:'POST',body:JSON.stringify({content_id:cur.content_id||cur.id,creator_id:cur.creator_id,feedback_type:t})});S.items=S.items.filter(x=>x!==cur);hide();render();toast('بازخوردت ثبت شد')}catch{toast('بازخورد ثبت نشد')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(b.dataset.mode));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>load(b.dataset.nav));$('reload').onclick=()=>{haptic();load(S.mode)};let timer;search.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>doSearch(search.value),450)};search.onkeydown=e=>{if(e.key==='Enter')doSearch(search.value)};$('focusSearch').onclick=()=>{search.focus();search.scrollIntoView({behavior:'smooth',block:'start'})};$('saved').onclick=()=>toast('صفحه ذخیره‌ها در مرحله بعد فعال می‌شود');$('back').onclick=hide;$('viewerClose').onclick=hide;document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});$('viewerSave').onclick=()=>S.current&&saveItem(S.current,$('viewerSave'));$('openTelegram').onclick=()=>{const u=safe(S.current?.source_url||S.current?.url||S.current?.link);if(!u)return toast('لینک این پست در دسترس نیست');try{tg?.openTelegramLink?.(u)||window.open(u,'_blank','noopener')}catch{window.open(u,'_blank','noopener')}};$('notInterested').onclick=()=>feedback('not_interested');document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedback(b.dataset.feedback));load('feed')})();
</script>
</body></html>
