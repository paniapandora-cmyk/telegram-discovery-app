/* =========================================================
   CONFIG
========================================================= */

const DISCOVERY_API_URL =
  window.location.origin + "/api/discovery";

const TELEGRAM_API_URL =
  window.location.origin + "/api/telegram";


/* =========================================================
   TELEGRAM WEB APP
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const feedEl =
  document.getElementById("feed");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const feedBtn =
  document.getElementById("feedBtn");

const trendBtn =
  document.getElementById("trendBtn");

const exploreBtn =
  document.getElementById("exploreBtn");


/* =========================================================
   STATE
========================================================= */

let currentMode = "feed";
let feedItems = [];
let currentUser = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type = ""
) {
  statusEl.textContent = text;

  statusEl.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   SAFE URL
========================================================= */

function safeTelegramUrl(value) {

  if (!value) {
    return "";
  }

  try {

    const url =
      new URL(
        String(value),
        window.location.origin,
      );

    const protocol =
      url.protocol.toLowerCase();

    if (
      protocol !== "https:" &&
      protocol !== "http:"
    ) {
      return "";
    }

    /*
     * فقط Telegram links را برای
     * نتایج Telegram قبول می‌کنیم.
     */

    const hostname =
      url.hostname.toLowerCase();

    const telegramHost =
      hostname === "t.me" ||
      hostname === "telegram.me" ||
      hostname === "www.telegram.me";

    if (!telegramHost) {
      return "";
    }

    return url.toString();

  } catch (_) {

    return "";
  }
}


/* =========================================================
   TELEGRAM INIT
========================================================= */

function initTelegram() {

  if (!tg) {

    setStatus(
      "⚠️ این برنامه باید داخل Telegram باز شود",
      "error",
    );

    return false;
  }

  try {

    tg.ready();
    tg.expand();

    try {

      if (tg.setHeaderColor) {
        tg.setHeaderColor(
          "#f4f6f8",
        );
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor(
          "#f4f6f8",
        );
      }

      if (tg.setBottomBarColor) {
        tg.setBottomBarColor(
          "#f4f6f8",
        );
      }

    } catch (_) {}

    document.documentElement.style.background =
      "#f4f6f8";

    document.body.style.background =
      "#f4f6f8";

    document.body.style.color =
      "#111827";

    return true;

  } catch (error) {

    console.error(
      "Telegram init:",
      error,
    );

    setStatus(
      "⚠️ Telegram WebApp آماده نشد",
      "error",
    );

    return false;
  }
}


/* =========================================================
   GENERIC API REQUEST
========================================================= */

async function requestApi(
  baseUrl,
  path,
  options = {},
) {

  const headers = {
    ...(options.headers || {}),
  };

  if (
    !headers["Content-Type"] &&
    options.body
  ) {
    headers["Content-Type"] =
      "application/json";
  }

  const initData =
    tg?.initData || "";

  if (initData) {

    headers[
      "X-Telegram-Init-Data"
    ] = initData;
  }

  const response =
    await fetch(
      baseUrl + path,
      {
        ...options,
        headers,
      },
    );

  const raw =
    await response.text();

  let data = {};

  try {

    data =
      raw
        ? JSON.parse(raw)
        : {};

  } catch (_) {

    data = {
      message: raw,
    };
  }

  if (!response.ok) {

    const error =
      new Error(
        data.error ||
        data.message ||
        `HTTP ${response.status}`,
      );

    error.status =
      response.status;

    error.data =
      data;

    throw error;
  }

  return data;
}


/* =========================================================
   DISCOVERY API
========================================================= */

async function discoveryApi(
  path,
  options = {},
) {

  return requestApi(
    DISCOVERY_API_URL,
    path,
    options,
  );
}


/* =========================================================
   TELEGRAM API
========================================================= */

async function telegramApi(
  path,
  options = {},
) {

  return requestApi(
    TELEGRAM_API_URL,
    path,
    options,
  );
}


/* =========================================================
   AUTH
========================================================= */

async function authenticateTelegram() {

  if (!tg?.initData) {

    setStatus(
      "⚠️ اطلاعات Telegram در دسترس نیست",
      "error",
    );

    return false;
  }

  try {

    const result =
      await discoveryApi(
        "/auth/telegram",
        {
          method: "POST",

          body: JSON.stringify({
            initData:
              tg.initData,
          }),
        },
      );

    console.log(
      "Telegram authentication:",
      result,
    );

    if (
      result?.authenticated &&
      result?.user
    ) {

      currentUser =
        result.user;

      return true;
    }

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error",
    );

    return false;

  } catch (error) {

    console.error(
      "Telegram auth:",
      error,
    );

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error",
    );

    return false;
  }
}


/* =========================================================
   HEALTH
========================================================= */

async function checkBackend() {

  try {

    const result =
      await discoveryApi(
        "/health",
      );

    return result?.ok === true;

  } catch (error) {

    console.error(
      "Discovery health:",
      error,
    );

    return false;
  }
}


/* =========================================================
   TABS
========================================================= */

function setActiveTab(
  mode,
) {

  feedBtn.classList.toggle(
    "active",
    mode === "feed",
  );

  trendBtn.classList.toggle(
    "active",
    mode === "trending",
  );

  exploreBtn.classList.toggle(
    "active",
    mode === "explore",
  );
}


/* =========================================================
   NORMALIZE DISCOVERY RESULT
========================================================= */

function normalizeDiscoveryItem(
  item,
) {

  return {

    id:
      String(
        item?.id ||
        item?.content_id ||
        "",
      ),

    title:
      item?.title ||
      "بدون عنوان",

    description:
      item?.description ||
      item?.text_content ||
      "توضیحی برای این محتوا ثبت نشده است.",

    source_url:
      item?.source_url ||
      item?.url ||
      "",

    content_type:
      item?.content_type ||
      "content",

    creator_name:
      item?.creator_name ||
      item?.creator_username ||
      "",

    score:
      Number(
        item?.score ??
        item?.final_score ??
        0,
      ),

    reason:
      item?.reason ||
      "",

    is_saved:
      item?.is_saved === true ||
      item?.is_saved === 1 ||
      item?.is_saved === "true" ||
      item?.is_saved === "1",

    source:
      "discovery",
  };
}


/* =========================================================
   NORMALIZE TELEGRAM RESULT
========================================================= */

function normalizeTelegramItem(
  item,
  index,
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const text =
    item?.text ??
    item?.message ??
    item?.rawText ??
    item?.description ??
    "";

  const username =
    String(
      item?.channel_username ??
      item?.chat_username ??
      item?.username ??
      "",
    ).replace(/^@+/, "");

  const title =
    item?.channel_title ??
    item?.title ??
    (
      username
        ? "@" + username
        : "Telegram",
    );

  const channelUrl =
    safeTelegramUrl(
      item?.channel_url,
    ) ||
    (
      username
        ? `https://t.me/${encodeURIComponent(username)}`
        : ""
    );

  const messageUrl =
    safeTelegramUrl(
      item?.message_url,
    ) ||
    safeTelegramUrl(
      item?.link,
    ) ||
    safeTelegramUrl(
      item?.url,
    ) ||
    (
      username &&
      item?.id
        ? `https://t.me/${encodeURIComponent(username)}/${encodeURIComponent(String(item.id))}`
        : ""
    );

  return {

    id:
      String(
        item?.id ??
        item?.result_id ??
        `telegram-${index}`,
      ),

    result_type:
      isChannel
        ? "channel"
        : "telegram_message",

    telegram_message_id:
      item?.telegram_message_id ??
      (
        !isChannel
          ? item?.id ?? null
          : null
      ),

    title:
      String(
        title || "Telegram",
      ),

    description:
      isChannel
        ? (
            item?.description ||
            "کانال تلگرام"
          )
        : (
            String(text).trim() ||
            (
              item?.has_media
                ? "📎 این پست شامل رسانه است."
                : "این پست متن قابل نمایش ندارد."
            )
          ),

    source_url:
      isChannel
        ? channelUrl
        : messageUrl,

    channel_url:
      channelUrl,

    message_url:
      messageUrl,

    content_type:
      isChannel
        ? "telegram-channel"
        : "telegram",

    creator_name:
      username
        ? "@" + username
        : "",

    score:
      Number(
        item?.search_score ??
        item?.score ??
        0,
      ),

    reason:
      isChannel
        ? "telegram_channel_search"
        : "telegram_global_search",

    is_saved:
      false,

    source:
      "telegram",

    channel_username:
      username,

    channel_title:
      String(
        title || "Telegram",
      ),

    chat_id:
      item?.chat_id ??
      item?.channel_peer_id ??
      null,

    channel_peer_id:
      item?.channel_peer_id ??
      null,

    date:
      item?.date ??
      null,

    has_media:
      Boolean(
        item?.has_media,
      ),
  };
}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed(
  mode = "feed",
) {

  currentMode =
    mode;

  setActiveTab(
    mode,
  );

  setStatus(
    "در حال دریافت محتوا...",
  );

  feedEl.innerHTML =
    '<div class="empty">در حال بارگذاری...</div>';

  try {

    let result;

    if (
      mode ===
      "feed"
    ) {

      result =
        await discoveryApi(
          "/feed?limit=20",
        );

    } else if (
      mode ===
      "trending"
    ) {

      result =
        await discoveryApi(
          "/trending?limit=20",
        );

    } else {

      result =
        await discoveryApi(
          "/explore?limit=20",
        );
    }

    console.log(
      "Discovery response:",
      result,
    );

    feedItems =
      Array.isArray(
        result?.items,
      )
        ? result.items.map(
            normalizeDiscoveryItem,
          )
        : [];

    renderFeed();

    setStatus(
      feedItems.length
        ? `🟢 ${feedItems.length} محتوا آماده است`
        : "🟡 هنوز محتوایی برای نمایش پیدا نشد",
      feedItems.length
        ? "success"
        : "",
    );

  } catch (error) {

    console.error(
      "Discovery feed:",
      error,
    );

    feedEl.innerHTML = `
      <div class="error-card">
        <strong>
          دریافت محتوا ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            error?.message ||
            "خطای نامشخص",
          )}
        </div>
      </div>
    `;

    setStatus(
      "🔴 خطا در دریافت محتوا",
      "error",
    );
  }
}


/* =========================================================
   SEARCH
========================================================= */

async function doTelegramSearch() {

  const query =
    searchInput.value.trim();

  if (!query) {

    setStatus(
      "عبارت جستجو را وارد کن",
    );

    searchInput.focus();

    return;
  }

  if (
    query.length >
    200
  ) {

    setStatus(
      "🔴 عبارت جستجو بیش از حد طولانی است",
      "error",
    );

    return;
  }

  currentMode =
    "telegram-search";

  setActiveTab(
    "telegram-search",
  );

  searchBtn.disabled =
    true;

  setStatus(
    "🔎 در حال جستجو در Discovery و Telegram...",
  );

  feedEl.innerHTML = `
    <div class="empty">
      🔎 در حال جستجوی کانال‌ها، محتوا و Telegram Global...<br>
      لطفاً چند لحظه صبر کن.
    </div>
  `;

  try {

    const result =
      await telegramApi(
        "/search?q=" +
        encodeURIComponent(
          query,
        ) +
        "&limit=20",
      );

    console.log(
      "Unified Telegram Search:",
      result,
    );

    if (
      result?.ok !== true
    ) {

      throw new Error(
        result?.error ||
        "Telegram search failed",
      );
    }

    const rawResults =
      Array.isArray(
        result?.results,
      )
        ? result.results
        : (
            Array.isArray(
              result?.items,
            )
              ? result.items
              : []
          );

    feedItems =
      rawResults.map(
        item => {

          /*
           * Result داخلی Discovery
           */

          if (
            item?.source ===
              "discovery" &&
            item?.result_type !==
              "channel"
          ) {

            return normalizeDiscoveryItem(
              item,
            );
          }

          /*
           * Resultهای Telegram
           */

          return normalizeTelegramItem(
            item,
            feedItems.length,
          );
        },
      );

    renderFeed();

    if (
      feedItems.length
    ) {

      setStatus(
        `🟢 ${feedItems.length} نتیجه برای «${query}»`,
        "success",
      );

    } else {

      setStatus(
        `🟡 برای «${query}» نتیجه‌ای پیدا نشد`,
      );
    }

  } catch (error) {

    console.error(
      "Unified Telegram Search:",
      error,
    );

    const status =
      error?.status;

    let message =
      error?.message ||
      "Telegram search failed";

    if (
      status === 401
    ) {

      message =
        "نشست Telegram معتبر نیست یا حساب مجاز نیست.";

    } else if (
      status === 404
    ) {

      message =
        "مسیر Search روی Worker پیدا نشد.";

    } else if (
      status === 502
    ) {

      message =
        "Worker نتوانست به Search Backend متصل شود.";

    }

    feedEl.innerHTML = `
      <div class="error-card">

        <strong>
          جستجو ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            message,
          )}
        </div>

        ${
          status
            ? `
              <div style="margin-top:8px;font-size:12px;opacity:.65">
                HTTP ${escapeHtml(
                  String(status),
                )}
              </div>
            `
            : ""
        }

      </div>
    `;

    setStatus(
      "🔴 خطا در جستجو",
      "error",
    );

  } finally {

    searchBtn.disabled =
      false;
  }
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed() {

  if (
    !feedItems.length
  ) {

    feedEl.innerHTML = `
      <div class="empty">
        هنوز نتیجه‌ای برای نمایش وجود ندارد.
      </div>
    `;

    return;
  }

  feedEl.innerHTML =
    feedItems
      .map(
        (
          item,
          index,
        ) => {

          if (
            item?.source ===
            "telegram"
          ) {

            return renderTelegramCard(
              item,
              index,
            );
          }

          return renderDiscoveryCard(
            item,
            index,
          );
        },
      )
      .join("");
}


/* =========================================================
   RENDER TELEGRAM CARD
========================================================= */

function renderTelegramCard(
  item,
  index,
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const title =
    escapeHtml(
      item?.channel_title ||
      item?.title ||
      "Telegram",
    );

  const username =
    item?.channel_username
      ? "@" +
        item.channel_username
      : "";

  const description =
    escapeHtml(
      item?.description ||
      (
        isChannel
          ? "کانال تلگرام"
          : (
              item?.has_media
                ? "📎 این پست شامل رسانه است."
                : "این پست متن قابل نمایش ندارد."
            )
      ),
    );

  const channelUrl =
    safeTelegramUrl(
      item?.channel_url,
    ) ||
    (
      item?.channel_username
        ? `https://t.me/${encodeURIComponent(item.channel_username)}`
        : ""
    );

  const messageUrl =
    safeTelegramUrl(
      item?.message_url,
    ) ||
    safeTelegramUrl(
      item?.source_url,
    );

  const targetUrl =
    isChannel
      ? channelUrl
      : messageUrl;

  const buttonLabel =
    isChannel
      ? "📢 ورود به کانال"
      : "🔗 مشاهده پست";

  let dateText =
    "";

  if (
    item?.date
  ) {

    try {

      const date =
        new Date(
          item.date,
        );

      if (
        !Number.isNaN(
          date.getTime(),
        )
      ) {

        dateText =
          date.toLocaleString(
            "fa-IR",
          );
      }

    } catch (_) {}
  }

  const peerId =
    item?.channel_peer_id ??
    item?.chat_id ??
    null;

  return `
    <article
      class="card telegram-card ${
        isChannel
          ? "channel-card"
          : ""
      }"
    >

      <h2>
        ${title}
      </h2>

      <p>
        ${description}
      </p>

      <div class="meta">

        <span
          class="chip ${
            isChannel
              ? "channel"
              : "telegram"
          }"
        >
          ${
            isChannel
              ? "📢 کانال"
              : "Telegram"
          }
        </span>

        ${
          username
            ? `
              <span class="chip">
                ${escapeHtml(
                  username,
                )}
              </span>
            `
            : ""
        }

        ${
          peerId !== null &&
          peerId !== undefined
            ? `
              <span class="chip">
                ${escapeHtml(
                  String(peerId),
                )}
              </span>
            `
            : ""
        }

        ${
          dateText
            ? `
              <span class="chip">
                ${escapeHtml(
                  dateText,
                )}
              </span>
            `
            : ""
        }

      </div>

      ${
        targetUrl

          ? `
            <div class="actions single">

              <button
                type="button"
                class="action primary"
                data-url="${escapeHtml(
                  targetUrl,
                )}"
                onclick="
                  openTelegramContent(
                    this.dataset.url
                  )
                "
              >
                ${buttonLabel}
              </button>

            </div>
          `

          : `
            <div class="actions single">

              <button
                type="button"
                class="action"
                disabled
              >
                لینک Telegram در دسترس نیست
              </button>

            </div>
          `
      }

    </article>
  `;
}


/* =========================================================
   RENDER DISCOVERY CARD
========================================================= */

function renderDiscoveryCard(
  item,
  index,
) {

  const id =
    escapeHtml(
      item?.id ||
      "",
    );

  const url =
    safeTelegramUrl(
      item?.source_url,
    ) ||
    (
      item?.source_url
        ? String(
            item.source_url,
          )
        : ""
    );

  const saved =
    item?.is_saved === true;

  const saveClass =
    saved
      ? " saved"
      : "";

  const saveText =
    saved
      ? "✅ ذخیره شد"
      : "⭐ ذخیره";

  return `
    <article class="card">

      <h2>
        ${escapeHtml(
          item?.title ||
          "بدون عنوان",
        )}
      </h2>

      <p>
        ${escapeHtml(
          item?.description ||
          "",
        )}
      </p>

      <div class="meta">

        <span class="chip">
          ${escapeHtml(
            item?.content_type ||
            "content",
          )}
        </span>

        ${
          item?.creator_name
            ? `
              <span class="chip">
                ${escapeHtml(
                  item.creator_name,
                )}
              </span>
            `
            : ""
        }

        ${
          Number.isFinite(
            Number(
              item?.score,
            ),
          ) &&
          Number(
            item?.score,
          ) > 0
            ? `
              <span class="chip">
                امتیاز
                ${Number(
                  item.score,
                ).toFixed(3)}
              </span>
            `
            : ""
        }

      </div>

      <div class="actions">

        ${
          url

            ? `
              <button
                type="button"
                class="action primary"
                data-id="${id}"
                data-url="${escapeHtml(
                  url,
                )}"
                onclick="
                  openContent(
                    this.dataset.id,
                    this.dataset.url
                  )
                "
              >
                🔗 مشاهده
              </button>
            `

            : `
              <button
                type="button"
                class="action"
                disabled
              >
                لینک ندارد
              </button>
            `
        }

        <button
          type="button"
          class="action${saveClass}"
          data-id="${id}"
          onclick="
            saveContent(
              this.dataset.id
            )
          "
        >
          ${saveText}
        </button>

        <button
          type="button"
          class="action"
          data-id="${id}"
          onclick="
            notInterested(
              this.dataset.id
            )
          "
        >
          👎
        </button>

      </div>

    </article>
  `;
}


/* =========================================================
   OPEN TELEGRAM CONTENT
========================================================= */

function openTelegramContent(
  url,
) {

  const safeUrl =
    safeTelegramUrl(
      url,
    );

  if (!safeUrl) {
    return;
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        safeUrl,
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error,
    );
  }

  window.open(
    safeUrl,
    "_blank",
    "noopener,noreferrer",
  );
}


/* =========================================================
   OPEN DISCOVERY CONTENT
========================================================= */

async function openContent(
  contentId,
  url,
) {

  if (
    !contentId ||
    !url
  ) {
    return;
  }

  try {

    const position =
      feedItems.findIndex(
        item =>
          String(
            item?.id,
          ) ===
          String(
            contentId,
          ),
      );

    await discoveryApi(
      "/impression",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          position:

            position >= 0
              ? position
              : 0,

          score:
            Number(
              feedItems.find(
                item =>
                  String(
                    item?.id,
                  ) ===
                  String(
                    contentId,
                  ),
              )?.score ||
              0,
            ),

          reason:
            currentMode,

        }),
      },
    );

  } catch (error) {

    console.warn(
      "Impression:",
      error,
    );
  }

  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url,
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error,
    );
  }

  window.open(
    url,
    "_blank",
    "noopener,noreferrer",
  );
}


/* =========================================================
   SAVE CONTENT
========================================================= */

async function saveContent(
  contentId,
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ذخیره باید داخل Telegram احراز هویت شوی",
      "error",
    );

    return;
  }

  const item =
    feedItems.find(
      currentItem =>
        String(
          currentItem?.id,
        ) ===
        String(
          contentId,
        ),
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ این نتیجه مستقیماً از Telegram آمده و هنوز ذخیره Discovery نیست",
      "info",
    );

    return;
  }

  if (
    item?.is_saved
  ) {

    setStatus(
      "✅ این محتوا قبلاً ذخیره شده است",
      "success",
    );

    return;
  }

  try {

    await discoveryApi(
      "/save",
      {
        method: "POST",

        body: JSON.stringify({
          content_id:
            contentId,
        }),
      },
    );

    if (item) {
      item.is_saved = true;
    }

    renderFeed();

    setStatus(
      "⭐ ذخیره شد",
      "success",
    );

  } catch (error) {

    console.error(
      "Save:",
      error,
    );

    setStatus(
      "🔴 ذخیره ناموفق بود: " +
      (
        error?.message ||
        ""
      ),
      "error",
    );
  }
}


/* =========================================================
   NOT INTERESTED
========================================================= */

async function notInterested(
  contentId,
) {

  if (!contentId) {
    return;
  }

  if (!currentUser) {

    setStatus(
      "⚠️ برای ثبت بازخورد باید داخل Telegram احراز هویت شوی",
      "error",
    );

    return;
  }

  const item =
    feedItems.find(
      currentItem =>
        String(
          currentItem?.id,
        ) ===
        String(
          contentId,
        ),
    );

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ بازخورد برای نتیجه مستقیم Telegram فعلاً ثبت نمی‌شود",
      "info",
    );

    return;
  }

  try {

    await discoveryApi(
      "/feedback",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          feedback_type:
            "NOT_INTERESTED",

        }),
      },
    );

    feedItems =
      feedItems.filter(
        currentItem =>
          String(
            currentItem?.id,
          ) !==
          String(
            contentId,
          ),
      );

    renderFeed();

    setStatus(
      "👍 بازخورد ثبت شد",
      "success",
    );

  } catch (error) {

    console.error(
      "Feedback:",
      error,
    );

    setStatus(
      "🔴 ثبت بازخورد ناموفق بود",
      "error",
    );
  }
}


/* =========================================================
   EVENTS
========================================================= */

feedBtn.addEventListener(
  "click",
  () =>
    loadFeed(
      "feed",
    ),
);

trendBtn.addEventListener(
  "click",
  () =>
    loadFeed(
      "trending",
    ),
);

exploreBtn.addEventListener(
  "click",
  () =>
    loadFeed(
      "explore",
    ),
);

searchBtn.addEventListener(
  "click",
  doTelegramSearch,
);

searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      doTelegramSearch();
    }
  },
);


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  if (
    !initTelegram()
  ) {
    return;
  }

  setStatus(
    "در حال اتصال به Discovery...",
  );

  const healthy =
    await checkBackend();

  if (!healthy) {

    feedEl.innerHTML = `
      <div class="error-card">
        <strong>
          Discovery API در دسترس نیست
        </strong>

        <div>
          اتصال به Backend برقرار نشد.
        </div>
      </div>
    `;

    setStatus(
      "🔴 Backend در دسترس نیست",
      "error",
    );

    return;
  }

  const authenticated =
    await authenticateTelegram();

  if (!authenticated) {

    feedEl.innerHTML = `
      <div class="error-card">
        <strong>
          احراز هویت Telegram ناموفق بود
        </strong>

        <div>
          برنامه را از داخل Telegram باز کن.
        </div>
      </div>
    `;

    return;
  }

  setStatus(
    "🟢 آماده",
    "success",
  );

  await loadFeed(
    "feed",
  );
}


/* =========================================================
   BOOT
========================================================= */

startApp();

</script></body>
</html>
