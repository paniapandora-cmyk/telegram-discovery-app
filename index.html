<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6f8">

  <title>Telegram Discovery</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f6f8 !important;
      color: #111827 !important;
      color-scheme: light;
    }

    html {
      background: #f4f6f8 !important;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      padding: 8px 2px 16px;
    }

    .brand {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: .68;
    }

    /* SEARCH */

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search input {
      min-width: 0;
      flex: 1;

      border: 0;
      outline: none;

      border-radius: 15px;
      padding: 13px 14px;

      font-size: 15px;

      background: #ffffff;
      color: #111827;
    }

    .search input::placeholder {
      color: #8b949e;
    }

    .search button {
      border: 0;
      border-radius: 15px;

      padding: 0 17px;

      background: #229ed9;
      color: #ffffff;

      font-weight: 700;
    }

    /* TABS */

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      border-radius: 14px;
      padding: 13px 7px;

      font-size: 14px;

      background: #ffffff;
      color: #111827;
    }

    .tab.active {
      background: #229ed9;
      color: #ffffff;
    }

    /* STATUS */

    .status {
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 12px;

      font-size: 13px;

      background: #ffffff;
      color: #111827;
    }

    .status.success {
      color: #16803c;
    }

    .status.error {
      color: #b00020;
    }

    /* FEED */

    .feed {
      width: 100%;
    }

    .card {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;

      border-radius: 18px;

      background: #ffffff;
      color: #111827;
    }

    .card h2 {
      margin: 0 0 8px;

      font-size: 18px;
      line-height: 1.5;
    }

    .card p {
      margin: 0 0 11px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .78;
    }

    .meta {
      margin-bottom: 12px;

      font-size: 12px;
      opacity: .55;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action {
      flex: 1;

      border: 0;
      border-radius: 12px;

      padding: 11px 8px;

      font-size: 13px;

      background: #eef2f7;
      color: #111827;
    }

    .action.primary {
      background: #229ed9;
      color: #ffffff;
    }

    /* EMPTY */

    .empty {
      text-align: center;

      padding: 50px 20px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .65;
    }

    /* ERROR */

    .error-card {
      border-radius: 18px;
      padding: 16px;

      background: #ffffff;
      color: #b00020;
    }

    .error-card strong {
      display: block;
      margin-bottom: 8px;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 25px;

      font-size: 11px;

      opacity: .45;
    }

    @media (max-width: 380px) {

      .brand {
        font-size: 25px;
      }

      .tab {
        font-size: 12px;
      }

      .search button {
        padding: 0 13px;
      }

    }
  </style>
</head>

<body style="background:#f4f6f8;color:#111827;">

<div class="app">

  <header class="header">

    <div class="brand">
      کشف
    </div>

    <div class="subtitle">
      محتوای جالب تلگرام را کشف کن
    </div>

  </header>


  <div class="search">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="جستجو..."
    >

    <button id="searchBtn">
      جستجو
    </button>

  </div>


  <div class="tabs">

    <button
      id="feedBtn"
      class="tab active"
      type="button"
    >
      ✨ پیشنهادهای من
    </button>

    <button
      id="trendBtn"
      class="tab"
      type="button"
    >
      🔥 ترندها
    </button>

    <button
      id="exploreBtn"
      class="tab"
      type="button"
    >
      🧭 اکسپلور
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    در حال آماده‌سازی...
  </div>


  <main
    id="feed"
    class="feed"
  >

    <div class="empty">
      در حال آماده‌سازی Discovery...
    </div>

  </main>


  <div class="footer">
    Telegram Discovery · نسخه 0.1.0
  </div>

</div>


<script>

(function () {

  /*
   * =========================================================
   * CONFIG
   * =========================================================
   */

  const API_URL =
    "https://jmxlwocemvjwkztbasja.supabase.co/functions/v1/discovery-api";


  /*
   * =========================================================
   * TELEGRAM
   * =========================================================
   *
   * مهم:
   * tg را از اول null می‌گذاریم.
   * بعد صبر می‌کنیم Telegram WebApp واقعاً آماده شود.
   */

  let tg = null;


  /*
   * =========================================================
   * ELEMENTS
   * =========================================================
   */

  const statusEl =
    document.getElementById("status");

  const feedEl =
    document.getElementById("feed");

  const searchInput =
    document.getElementById("searchInput");

  const feedBtn =
    document.getElementById("feedBtn");

  const trendBtn =
    document.getElementById("trendBtn");

  const exploreBtn =
    document.getElementById("exploreBtn");


  /*
   * =========================================================
   * STATE
   * =========================================================
   */

  let currentUser = null;

  let currentMode = "feed";

  let feedItems = [];


  /*
   * =========================================================
   * STATUS
   * =========================================================
   */

  function setStatus(
    text,
    type = ""
  ) {

    statusEl.textContent =
      text;

    statusEl.className =
      "status" +
      (
        type
          ? " " + type
          : ""
      );
  }


  /*
   * =========================================================
   * HTML ESCAPE
   * =========================================================
   */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /*
   * =========================================================
   * TELEGRAM INITIALIZATION
   * =========================================================
   */

  function initTelegram() {

    tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


    if (!tg) {

      return false;
    }


    try {

      tg.ready();

      tg.expand();


      /*
       * ظاهر اپ را مستقل از Dark/Light
       * تلگرام پایدار نگه می‌داریم.
       */

      try {

        if (
          typeof tg.setHeaderColor ===
          "function"
        ) {

          tg.setHeaderColor(
            "#f4f6f8"
          );
        }


        if (
          typeof tg.setBackgroundColor ===
          "function"
        ) {

          tg.setBackgroundColor(
            "#f4f6f8"
          );
        }


        if (
          typeof tg.setBottomBarColor ===
          "function"
        ) {

          tg.setBottomBarColor(
            "#f4f6f8"
          );
        }

      } catch (_) {}


      document.documentElement.style.background =
        "#f4f6f8";

      document.body.style.background =
        "#f4f6f8";

      document.body.style.color =
        "#111827";


      return true;


    } catch (error) {

      console.error(
        "Telegram init:",
        error
      );

      return false;
    }
  }


  /*
   * =========================================================
   * WAIT FOR TELEGRAM
   * =========================================================
   */

  async function waitForTelegram() {

    for (
      let attempt = 0;
      attempt < 60;
      attempt++
    ) {

      setStatus(
        "در حال آماده‌سازی Telegram..."
      );


      if (
        initTelegram()
      ) {

        /*
         * حتی اگر initData هنوز
         * یک لحظه بعد بیاید،
         * کمی صبر می‌کنیم.
         */

        for (
          let i = 0;
          i < 20;
          i++
        ) {

          if (
            tg &&
            tg.initData
          ) {

            return true;
          }


          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                100
              )
          );
        }


        /*
         * داخل Telegram هستیم ولی
         * initData نیامده.
         */

        if (tg) {

          return true;
        }
      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );
    }


    return false;
  }


  /*
   * =========================================================
   * API
   * =========================================================
   */

  async function api(
    path,
    options = {}
  ) {

    /*
     * اگر tg به هر دلیلی
     * دوباره null شده باشد،
     * آن را تازه می‌کنیم.
     */

    if (!tg) {

      tg =
        window.Telegram &&
        window.Telegram.WebApp
          ? window.Telegram.WebApp
          : null;
    }


    const headers = {

      ...(options.headers || {})

    };


    if (
      options.body &&
      !headers["Content-Type"]
    ) {

      headers["Content-Type"] =
        "application/json";
    }


    /*
     * Backend فعلی خودش
     * Telegram Init Data را بررسی می‌کند.
     */

    const initData =
      tg?.initData || "";


    if (initData) {

      headers[
        "X-Telegram-Init-Data"
      ] =
        initData;
    }


    const response =
      await fetch(
        API_URL + path,
        {
          ...options,
          headers
        }
      );


    const raw =
      await response.text();


    let data = {};


    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (_) {

      data = {
        message: raw
      };
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        (
          "HTTP " +
          response.status
        )
      );
    }


    return data;
  }


  /*
   * =========================================================
   * BACKEND HEALTH CHECK
   * =========================================================
   */

  async function checkBackend() {

    try {

      const result =
        await api("/");


      console.log(
        "Discovery API:",
        result
      );


      return true;


    } catch (error) {

      console.error(
        "Backend error:",
        error
      );


      setStatus(
        "🔴 اتصال به Discovery برقرار نشد",
        "error"
      );


      return false;
    }
  }


  /*
   * =========================================================
   * TELEGRAM AUTH
   * =========================================================
   */

  async function authenticateTelegram() {

    if (!tg) {

      return false;
    }


    const initData =
      tg.initData;


    if (!initData) {

      console.warn(
        "Telegram initData is empty"
      );

      return false;
    }


    try {

      const result =
        await api(
          "/auth/telegram",
          {
            method: "POST",

            body:
              JSON.stringify({
                initData
              })
          }
        );


      if (
        result &&
        result.authenticated
      ) {

        currentUser =
          result.user ||
          null;


        console.log(
          "Telegram authenticated:",
          currentUser
        );


        return true;
      }


      return false;


    } catch (error) {

      console.warn(
        "Telegram auth:",
        error
      );


      return false;
    }
  }


  /*
   * =========================================================
   * LOAD FEED
   * =========================================================
   */

  async function loadFeed(
    mode = "feed"
  ) {

    currentMode =
      mode;


    setActiveTab(
      mode
    );


    setStatus(
      "در حال دریافت محتوا..."
    );


    feedEl.innerHTML = `
      <div class="empty">
        در حال بارگذاری...
      </div>
    `;


    let path =
      "/feed?limit=20";


    if (
      mode === "feed"
    ) {

      path =
        "/feed?limit=20";
    }


    else if (
      mode === "trending"
    ) {

      path =
        "/feed?type=trending&limit=20";
    }


    else if (
      mode === "explore"
    ) {

      path =
        "/feed?type=explore&limit=20";
    }


    try {

      const result =
        await api(path);


      feedItems =
        Array.isArray(
          result.items
        )
          ? result.items
          : [];


      renderFeed();


      setStatus(
        feedItems.length
          ? "🟢 آماده"
          : "🟡 هنوز محتوایی پیدا نشد",
        feedItems.length
          ? "success"
          : ""
      );


    } catch (error) {

      console.error(
        "Feed error:",
        error
      );


      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            دریافت محتوا ناموفق بود
          </strong>

          <div>
            ${escapeHtml(
              error.message ||
              "خطای نامشخص"
            )}
          </div>

        </div>
      `;


      setStatus(
        "🔴 خطا در دریافت محتوا",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * RENDER FEED
   * =========================================================
   */

  function renderFeed() {

    if (
      !feedItems.length
    ) {

      feedEl.innerHTML = `
        <div class="empty">

          هنوز محتوایی برای نمایش
          در Discovery وجود ندارد.

        </div>
      `;

      return;
    }


    feedEl.innerHTML =
      feedItems
        .map(
          function(item) {

            const id =
              escapeHtml(
                item.id || ""
              );


            const title =
              escapeHtml(
                item.title ||
                "بدون عنوان"
              );


            const description =
              escapeHtml(
                item.description ||
                "توضیحی برای این محتوا ثبت نشده است."
              );


            const type =
              escapeHtml(
                item.content_type ||
                "content"
              );


            const url =
              item.source_url
                ? String(
                    item.source_url
                  )
                : "";


            return `
              <article class="card">

                <h2>
                  ${title}
                </h2>

                <p>
                  ${description}
                </p>

                <div class="meta">
                  ${type}
                </div>

                <div class="actions">

                  ${
                    url
                      ? `
                        <button
                          class="action primary"
                          data-url="${escapeHtml(url)}"
                          onclick="openContent(this.dataset.url)"
                        >
                          🔗 مشاهده
                        </button>
                      `
                      : ""
                  }


                  <button
                    class="action"
                    data-id="${id}"
                    onclick="saveContent(this.dataset.id)"
                  >
                    ⭐ ذخیره
                  </button>


                  <button
                    class="action"
                    data-id="${id}"
                    onclick="notInterested(this.dataset.id)"
                  >
                    👎
                  </button>

                </div>

              </article>
            `;

          }
        )
        .join("");
  }


  /*
   * =========================================================
   * ACTIVE TAB
   * =========================================================
   */

  function setActiveTab(
    mode
  ) {

    feedBtn.classList.remove(
      "active"
    );

    trendBtn.classList.remove(
      "active"
    );

    exploreBtn.classList.remove(
      "active"
    );


    if (
      mode === "feed"
    ) {

      feedBtn.classList.add(
        "active"
      );
    }


    if (
      mode === "trending"
    ) {

      trendBtn.classList.add(
        "active"
      );
    }


    if (
      mode === "explore"
    ) {

      exploreBtn.classList.add(
        "active"
      );
    }
  }


  /*
   * =========================================================
   * OPEN CONTENT
   * =========================================================
   */

  function openContent(
    url
  ) {

    if (!url) {

      return;
    }


    try {

      if (
        tg &&
        typeof tg.openLink ===
        "function"
      ) {

        tg.openLink(
          url
        );

        return;
      }

    } catch (error) {

      console.warn(
        "Telegram openLink:",
        error
      );
    }


    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }


  /*
   * =========================================================
   * SAVE
   * =========================================================
   */

  async function saveContent(
    contentId
  ) {

    if (!contentId) {

      return;
    }


    if (!currentUser) {

      setStatus(
        "ℹ️ برای ذخیره، ابتدا Telegram را احراز هویت کن"
      );

      return;
    }


    try {

      await api(
        "/save",
        {
          method: "POST",

          body:
            JSON.stringify({
              user_id:
                currentUser.id,

              content_id:
                contentId
            })
        }
      );


      setStatus(
        "⭐ ذخیره شد",
        "success"
      );


    } catch (error) {

      console.error(
        "Save:",
        error
      );


      setStatus(
        "🔴 ذخیره ناموفق بود",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * NOT INTERESTED
   * =========================================================
   */

  async function notInterested(
    contentId
  ) {

    if (!currentUser) {

      setStatus(
        "ℹ️ برای ثبت بازخورد، ابتدا Telegram را احراز هویت کن"
      );

      return;
    }


    try {

      await api(
        "/feedback",
        {
          method: "POST",

          body:
            JSON.stringify({
              user_id:
                currentUser.id,

              content_id:
                contentId,

              feedback_type:
                "not_interested"
            })
        }
      );


      setStatus(
        "👍 بازخورد ثبت شد",
        "success"
      );


    } catch (error) {

      console.error(
        "Feedback:",
        error
      );
    }
  }


  /*
   * =========================================================
   * SEARCH
   * =========================================================
   */

  function doSearch() {

    const query =
      searchInput.value.trim();


    if (!query) {

      setStatus(
        "عبارت جستجو را وارد کن"
      );

      return;
    }


    setStatus(
      `🔎 جستجو برای «${query}» در حال توسعه است`
    );
  }


  /*
   * =========================================================
   * EVENTS
   * =========================================================
   */

  feedBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "feed"
      );

    }
  );


  trendBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "trending"
      );

    }
  );


  exploreBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "explore"
      );

    }
  );


  document
    .getElementById("searchBtn")
    .addEventListener(
      "click",
      doSearch
    );


  searchInput.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key ===
        "Enter"
      ) {

        doSearch();

      }

    }
  );


  /*
   * =========================================================
   * START APP
   * =========================================================
   */

  async function startApp() {

    /*
     * 1
     * صبر برای Telegram
     */

    const telegramReady =
      await waitForTelegram();


    if (
      !telegramReady
    ) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            Telegram WebApp آماده نشد
          </strong>

          <div>
            برنامه را مستقیماً داخل Telegram باز کن.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 2
     * Backend
     */

    setStatus(
      "در حال اتصال به Discovery..."
    );


    const backendOK =
      await checkBackend();


    if (!backendOK) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            Discovery API در دسترس نیست
          </strong>

          <div>
            اتصال به Backend برقرار نشد.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 3
     * Telegram Authentication
     */

    const authenticated =
      await authenticateTelegram();


    if (!authenticated) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            احراز هویت Telegram ناموفق بود
          </strong>

          <div>
            برنامه را از داخل Telegram باز کن.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 4
     * Feed
     */

    await loadFeed(
      "feed"
    );

  }


  /*
   * شروع
   */

  startApp();


})();

</script>

</body>
</html>
