  background:rgba(5,15,26,.78);
  font-size:1.55rem;
  cursor:pointer;
}

.telegram-host .close{
  display:none;
}

.viewerBody{
  padding:17px 18px 28px;
}

.viewerChannel{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
  color:#7bc9f8;
  font-size:.84rem;
}

.viewerChannel .avatar{
  width:40px;
  height:40px;
  flex-basis:40px;
}

.viewer h3{
  margin:0;
  font-size:1.14rem;
  line-height:1.85;
}

.viewer h3:empty{
  display:none;
}

.desc{
  margin:10px 0 18px;
  color:#edf2f7;
  font-size:1rem;
  line-height:2;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.feedback{
  display:flex;
  gap:8px;
  padding:4px 0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.feedback::-webkit-scrollbar{
  display:none;
}

.feedback button{
  min-height:44px;
  flex:0 0 auto;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  background:transparent;
  font-size:.82rem;
  cursor:pointer;
}

.actions{
  position:sticky;
  bottom:0;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1fr) 54px 54px;
  gap:8px;
  padding:18px 0 4px;
  background:linear-gradient(transparent,#07111f 32%);
}

.actions button{
  min-height:54px;
  border:1px solid var(--line);
  border-radius:17px;
  color:#fff;
  background:#172638;
  cursor:pointer;
}

.actions .primary{
  border:0;
  color:var(--accent-text);
  background:linear-gradient(145deg,#318fe6,#665be1);
  font-weight:850;
}

.telegram-host.native-main .actions{
  grid-template-columns:repeat(2,54px);
  justify-content:start;
}

.telegram-host.native-main .actions .primary{
  display:none;
}

.toast{
  position:fixed;
  right:50%;
  bottom:calc(var(--nav-h) + var(--safe-b) + 20px);
  z-index:90;
  max-width:calc(100% - 32px);
  padding:10px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  color:#fff;
  background:#14263a;
  box-shadow:0 10px 28px rgba(0,0,0,.34);
  transform:translate(50%,10px);
  transition:.2s ease;
  font-size:.8rem;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(50%,0);
}

@media(max-width:390px){
  .app{
    padding-right:12px;
    padding-left:12px;
  }

  .grid{
    gap:9px;
  }

  .copy{
    padding:10px 10px 12px;
  }

  .title{
    font-size:.82rem;
    line-height:1.74;
  }

  .hero .title{
    font-size:.96rem;
    line-height:1.86;
  }

  .mode-explore .app{
    padding-right:8px;
    padding-left:8px;
  }

  .mode-explore .grid{
    gap:8px;
  }

  .nav{
    width:calc(100% - 18px);
  }
}

@media(max-width:340px){
  .grid,.mode-explore .grid{
    grid-template-columns:minmax(0,1fr);
  }

  .card.hero,.card.wide,.mode-explore .card.hero,.mode-explore .card.wide{
    grid-column:1;
  }

  .tabs{
    font-size:.78rem;
  }
}

@media(min-width:680px){
  .mode-explore .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .mode-explore .card.hero{
    grid-column:1/-1;
  }

  .mode-explore .card.wide{
    grid-column:span 2;
  }
}

@media(hover:hover){
  .card:hover .media{
    transform:scale(1.018);
  }

  .nav button:hover,.icon:hover,.feedback button:hover{
    background:rgba(255,255,255,.055);
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark">✦</div>
      <div>
        <h1>کشف</h1>
        <div class="eyebrow">تلگرام، اما برای سلیقه تو</div>
      </div>
    </div>

    <div class="status" id="status">در حال اتصال</div>
  </header>

  <section class="discover">
    <div class="discover-copy">
      <b id="discoverTitle">امروز چی کشف می‌کنی؟</b>
      <span id="discoverSub">پست‌های تازه، متناسب با سلیقه تو</span>
    </div>

    <div class="discover-glyph" id="discoverGlyph">✦</div>
  </section>

  <div class="searchbar">
    <input
      id="search"
      type="search"
      placeholder="موضوع، کانال یا یک ایده…"
      aria-label="جست‌وجوی محتوا"
    >
    <button class="icon" id="searchAction" aria-label="اجرای جست‌وجو">⌕</button>
  </div>

  <div class="tabs" role="tablist">
    <button
      class="tab active"
      data-mode="feed"
      role="tab"
      aria-selected="true"
      aria-controls="grid"
    >برای تو</button>
    <button
      class="tab"
      data-mode="trending"
      role="tab"
      aria-selected="false"
      aria-controls="grid"
    >داغ امروز</button>
    <button
      class="tab"
      data-mode="fresh"
      role="tab"
      aria-selected="false"
      aria-controls="grid"
    >کشف تازه</button>
  </div>

  <div class="head">
    <h2 id="heading">منتخب برای تو</h2>
    <span id="count">—</span>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="ناوبری اصلی">
  <button class="active" data-nav="feed" aria-current="page">
    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8v9.7H15v-6h-6v6H3z"/>
      </svg>
    </span>
    برای تو
  </button>

  <button data-nav="explore">
    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 2 3.1 6.9L22 12l-6.9 3.1L12 22l-3.1-6.9L2 12l6.9-3.1z"/>
      </svg>
    </span>
    اکسپلور
  </button>

  <button id="focusSearch">
    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/>
        <path d="m16 16 4 4"/>
      </svg>
    </span>
    جست‌وجو
  </button>

  <button id="saved">
    <span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 8.6c0 5.8-8.5 11-8.5 11s-8.5-5.2-8.5-11A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.5 2.4Z"/>
      </svg>
    </span>
    ذخیره‌ها
  </button>
</nav>

<div class="back" id="back"></div>

<article
  class="viewer"
  id="viewer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="viewerTitle"
  tabindex="-1"
>
  <div class="viewerMedia" id="viewerMedia">
    <button class="close" id="viewerClose" aria-label="بستن">×</button>
    <img id="viewerImage" alt="" hidden>
    <video id="viewerVideo" controls playsinline preload="metadata" hidden></video>
    <iframe
      id="viewerEmbed"
      title="پیش‌نمایش پست تلگرام"
      loading="lazy"
      allow="autoplay; fullscreen; picture-in-picture"
      hidden
    ></iframe>
  </div>

  <div class="viewerBody">
    <div class="viewerChannel">
      <span class="avatar" id="viewerAvatar"></span>
      <b id="viewerChannel"></b>
      <span class="eyebrow" id="viewerMeta"></span>
    </div>

    <h3 id="viewerTitle"></h3>
    <div class="desc" id="viewerDesc"></div>

    <div class="feedback">
      <button data-feedback="not_relevant">مرتبط نبود</button>
      <button data-feedback="hide_creator">این کانال کمتر</button>
      <button data-feedback="report">گزارش محتوا</button>
    </div>

    <div class="actions">
      <button class="primary" id="openTelegram">دیدن پست در تلگرام</button>
      <button id="viewerSave" aria-label="ذخیره">♡</button>
      <button id="notInterested" aria-label="علاقه ندارم">−</button>
    </div>
  </div>
</article>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const isTelegramHost = Boolean(
    tg && (
      tg.initData ||
      tg.initDataUnsafe?.user
    )
  );

  const nativeMain = Boolean(
    isTelegramHost && tg?.MainButton
  );

  if (isTelegramHost) {
    document.body.classList.add("telegram-host");

    if (nativeMain) {
      document.body.classList.add("native-main");
    }
  }

  try {
    tg?.ready();
    tg?.expand();
    const themeBackground =
      tg?.themeParams?.bg_color || "#07111f";

    const themeSurface =
      tg?.themeParams?.secondary_bg_color || "#111b29";

    tg?.setHeaderColor?.(themeBackground);
    tg?.setBackgroundColor?.(themeBackground);
    tg?.setBottomBarColor?.(themeSurface);
    tg?.BackButton?.onClick(hide);
    tg?.MainButton?.onClick(openCurrentTelegram);
  } catch {}

  const ORIGIN = location.protocol.startsWith("http")
    ? location.origin
    : "https://telegram-discovery-app.paniapandora.workers.dev";

  const API_PATH = '/api/discovery';
  const API = `${ORIGIN}${API_PATH}`;
  const PREVIEW = `${ORIGIN}/api/telegram/preview-image`;

  const S = {
    mode: "feed",
    items: [],
    current: null,
    loading: false,
    request: null,
    returnFocus: null,
    cache: {}
  };

  const $ = id => document.getElementById(id);

  const grid = $("grid");
  const status = $("status");
  const heading = $("heading");
  const count = $("count");
  const search = $("search");

  const palettes = [
    ["#244e75", "#152d47"],
    ["#18595b", "#103539"],
    ["#62421e", "#332716"],
    ["#4b356f", "#292241"],
    ["#1d4f72", "#163046"],
    ["#5b3d22", "#342617"],
    ["#5b2d49", "#342035"]
  ];

  const escapeHtml = value =>
    String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);

  const cleanText = value =>
    String(value ?? "")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/\*\*|__|~~|`/g, "")
      .replace(/^\s{0,3}[#>]+\s*/gm, "")
      .replace(/\s+/g, " ")
      .trim();

  const hash = value =>
    [...String(value || "")].reduce(
      (total, character) =>
        ((total << 5) - total + character.charCodeAt(0)) | 0,
      0
    );

  const palette = item =>
    palettes[
      Math.abs(
        hash(
          item.channel_username ||
          item.creator_id ||
          item.content_id ||
          item.id
        )
      ) % palettes.length
    ];

  const text = item =>
    String(
      item.title ||
      item.description ||
      item.text ||
      item.message ||
      "یک پست تازه از تلگرام"
    ).trim();

  const plainText = item => cleanText(text(item));

  const channel = item =>
    item.channel_name ||
    item.channel_title ||
    item.channel_username ||
    (
      String(item.source_url || item.url || "")
        .match(/t\.me\/([^/]+)/) || []
    )[1] ||
    "Telegram";

  const channelUsername = item => {
    const explicit = String(item.channel_username || "")
      .replace(/^@/, "")
      .trim();

    if (explicit) return explicit;

    return (
      String(item.source_url || item.url || "")
        .match(/t\.me\/(?:s\/)?([^/]+)/)?.[1] ||
      ""
    );
  };

  const safeUrl = value => {
    try {
      const url = new URL(value);

      return ["http:", "https:"].includes(url.protocol)
        ? url.href
        : "";
    } catch {
      return "";
    }
  };

  const telegramMessageId = item =>
    String(
      item.message_id ||
      item.telegram_message_id ||
      item.telegram_post_id ||
      item.post_id ||
      item.telegram?.message_id ||
      item.metadata?.message_id ||
      ""
    ).trim();

  const sourceUrl = item => {
    const direct = safeUrl(
      item.source_url ||
      item.telegram_url ||
      item.post_url ||
      item.url ||
      item.link
    );

    if (direct) return direct;

    const username = channelUsername(item);
    const messageId = telegramMessageId(item);

    return username && /^\d+$/.test(messageId)
      ? `https://t.me/${encodeURIComponent(username)}/${messageId}`
      : "";
  };

  const channelAvatarUrl = item => {
    const direct = safeUrl(
      item.channel_avatar_url ||
      item.channel_photo_url ||
      item.creator_avatar_url ||
      item.avatar_url
    );

    if (direct) return direct;

    const username = channelUsername(item);

    return username
      ? `https://t.me/i/userpic/320/${encodeURIComponent(username)}.jpg`
      : "";
  };

  const avatarMarkup = (item, className) => {
    const label = escapeHtml(channel(item).slice(0, 1));
    const image = channelAvatarUrl(item);

    return `
      <span class="${className}">
        ${label}
        ${image ? `
          <img
            src="${escapeHtml(image)}"
            alt=""
            loading="lazy"
            referrerpolicy="no-referrer"
            onerror="this.remove()"
          >
        ` : ""}
      </span>
    `;
  };

  const contentType = item =>
    String(item.content_type || "TEXT").toUpperCase();

  const posterUrl = item =>
    safeUrl(
      item.thumbnail_url ||
      item.image_url ||
      item.photo_url ||
      item.preview_url ||
      item.poster_url ||
      item.video_thumbnail_url ||
      item.media_thumbnail_url
    );

  const assetUrl = item =>
    safeUrl(
      item.media_url ||
      item.video_url ||
      item.file_url
    );

  const previewUrl = item => {
    const source = sourceUrl(item);

    return source
      ? `${PREVIEW}?url=${encodeURIComponent(source)}`
      : "";
  };

  const embedUrl = item => {
    const source = sourceUrl(item);

    try {
      const url = new URL(source);

      const allowedHosts = [
        "t.me",
        "www.t.me",
        "telegram.me",
        "www.telegram.me"
      ];

      if (
        !allowedHosts.includes(url.hostname) ||
        !/^\/(?:s\/)?[A-Za-z0-9_]+\/\d+/.test(url.pathname)
      ) {
        return "";
      }

      url.searchParams.set("embed", "1");
      url.searchParams.set("mode", "tme");

      return url.href;
    } catch {
      return "";
    }
  };

  const formatDate = value => {
    try {
      return value
        ? new Intl.DateTimeFormat("fa-IR", {
            month: "short",
            day: "numeric"
          }).format(new Date(value))
        : "تازه";
    } catch {
      return "تازه";
    }
  };

  const typeIcon = type => ({
    TEXT: "✦",
    IMAGE: "▧",
    PHOTO: "▧",
    VIDEO: "▶",
    DOCUMENT: "▤",
    AUDIO: "♪",
    MIXED: "◆"
  })[String(type || "").toUpperCase()] || "✦";

  const typeName = type => ({
    TEXT: "متن",
    IMAGE: "تصویر",
    PHOTO: "تصویر",
    VIDEO: "ویدئو",
    DOCUMENT: "فایل",
    AUDIO: "صدا",
    MIXED: "چند‌رسانه‌ای"
  })[type] || "پست";

  const topicLabel = item => {
    const value = cleanText(
      item.category_name ||
      item.category ||
      item.topic ||
      item.primary_interest ||
      typeName(contentType(item))
    );

    return value.slice(0, 18) || "تلگرام";
  };

  const hasVisualMedia = item => {
    const type = contentType(item);

    return Boolean(
      posterUrl(item) ||
      (
        ["IMAGE", "PHOTO"].includes(type) &&
        assetUrl(item)
      ) ||
      (
        sourceUrl(item) &&
        ["IMAGE", "PHOTO", "VIDEO", "MIXED"].includes(type)
      ) ||
      (
        type === "VIDEO" &&
        assetUrl(item)
      )
    );
  };

  function arrangeItems(items, mode) {
    const arranged = [...items];

    if (!["feed", "fresh"].includes(mode) || arranged.length < 2) {
      return arranged;
    }

    const heroIndex = arranged.findIndex(hasVisualMedia);

    if (heroIndex > 0) {
      const [hero] = arranged.splice(heroIndex, 1);
      arranged.unshift(hero);
    }

    const quoteIndex = arranged.findIndex(
      (item, index) => index > 0 && !hasVisualMedia(item)
    );

    if (quoteIndex > 4) {
      const [quote] = arranged.splice(quoteIndex, 1);
      arranged.splice(Math.min(3, arranged.length), 0, quote);
    }

    return arranged;
  }

  function imageErrorCode() {
    return `
      const fallback=this.dataset.fallback;
      if(fallback){
        this.dataset.fallback='';
        this.src=fallback;
      }else{
        this.remove();
      }
    `.replace(/\s+/g, " ").trim();
  }

  const mediaMarkup = (item, type) => {
    const poster = posterUrl(item);
    const asset = assetUrl(item);
    const proxyPreview = previewUrl(item);

    const fallback = `
      <div class="mediaFallback">
        ${type === "VIDEO" ? "" : `<b>${typeIcon(type)}</b>`}
        <span>${escapeHtml(typeName(type))} تلگرام</span>
      </div>
    `;

    const directImage =
      poster ||
      (
        ["IMAGE", "PHOTO"].includes(type)
          ? asset
          : ""
      );

    const image = directImage || proxyPreview;

    const backup =
      proxyPreview && proxyPreview !== image
        ? proxyPreview
        : "";

    return `
      <div class="mediaStage">
        ${fallback}

        ${image ? `
          <img
            class="media"
            src="${escapeHtml(image)}"
            data-fallback="${escapeHtml(backup)}"
            alt=""
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
            onerror="${imageErrorCode()}"
          >
        ` : ""}

        ${type === "VIDEO"
          ? '<span class="videoPlay" aria-hidden="true"></span>'
          : ""
        }
      </div>
    `;
  };

  const nativeMarkup = (item, type) => `
    <div class="nativePreview">
      <div class="nativeHead">
        ${avatarMarkup(item, "nativeAvatar")}

        <div class="nativeIdentity">
          <div class="nativeName">
            ${escapeHtml(channel(item))}
          </div>

          <div class="nativeMeta">
            ${escapeHtml(formatDate(item.published_at || item.date))}
            · تلگرام
          </div>
        </div>
      </div>

      <div class="nativeMessage">
        ${escapeHtml(plainText(item))}
      </div>

      <div class="nativeFoot">
        <span class="nativeKind">
          <b>${typeIcon(type)}</b>
          ${escapeHtml(typeName(type))}
        </span>

        <span>مشاهده پست ↗</span>
      </div>
    </div>
  `;

  const requestHeaders = () => ({
    "x-telegram-init-data": tg?.initData || "",
    "content-type": "application/json"
  });

  function showToast(message) {
    $("toast").textContent = message;
    $("toast").classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
      $("toast").classList.remove("show");
    }, 1800);
  }

  function haptic(style = "light") {
    try {
      tg?.HapticFeedback?.impactOccurred(style);
    } catch {}
  }

  async function api(path, options = {}) {
    const response = await fetch(API + path, {
      ...options,
      headers: {
        ...requestHeaders(),
        ...(options.headers || {})
      }
    });

    const data = await response
      .json()
      .catch(() => ({}));

    if (!response.ok || data.ok === false) {
      throw new Error(
        data.error || `HTTP ${response.status}`
      );
    }

    return data;
  }

  function showSkeletons() {
    grid.innerHTML = Array.from(
      { length: 8 },
      () => '<div class="sk"></div>'
    ).join("");
  }

  function cardClass(item, index) {
    if (index === 0) return "hero";

    if (
      S.mode === "explore" &&
      index % 8 === 5 &&
      hasVisualMedia(item)
    ) {
      return "wide";
    }

    return "";
  }

  function render() {
    count.textContent =
      `${S.items.length.toLocaleString("fa-IR")} محتوا`;

    if (!S.items.length) {
      grid.innerHTML = `
        <div class="empty">
          هنوز چیزی برای نمایش پیدا نشد.
          <br>
          یک موضوع دیگر را جست‌وجو کن یا دوباره تلاش کن.
        </div>
      `;
      return;
    }

    grid.innerHTML = S.items.map((item, index) => {
      const [firstColor, secondColor] = palette(item);
      const type = contentType(item);
      const visual = hasVisualMedia(item);
      const accessibleTitle = (
        plainText(item) ||
        `${typeName(type)} از ${channel(item)}`
      ).slice(0, 120);

      const specialClass =
        type === "DOCUMENT"
          ? "document-card"
          : type === "AUDIO"
            ? "audio-card"
            : "";

      const reason =
        S.mode === "feed" && index === 0
          ? '<span class="reason">برای تو</span>'
          : "";

      return `
        <article
          class="card ${cardClass(item, index)} ${visual ? "media-card" : "native-card"} ${specialClass}"
          data-index="${index}"
          style="--g1:${firstColor};--g2:${secondColor}"
        >
          ${visual
            ? mediaMarkup(item, type)
            : nativeMarkup(item, type)
          }

          ${visual
            ? `<span class="type">${escapeHtml(topicLabel(item))}</span>`
            : ""
          }

          <button
            class="cardOpen"
            data-open="${index}"
            aria-label="مشاهده پست: ${escapeHtml(accessibleTitle)}"
          ></button>

          <span class="rank">
            ${(index + 1).toLocaleString("fa-IR")}
          </span>

          <span class="freshness">تازه</span>

          <button
            class="save ${item.is_saved ? "saved" : ""}"
            data-save="${index}"
            aria-label="ذخیره"
          >
            ${item.is_saved ? "♥" : "♡"}
          </button>

          ${visual ? `
            <div class="copy">
              <div class="channel">
                ${avatarMarkup(item, "avatar")}

                <span>${escapeHtml(channel(item))}</span>
                ${reason}
              </div>

              <div class="title">
                ${escapeHtml(plainText(item))}
              </div>

              <div class="meta">
                ${escapeHtml(typeName(type))}
                <span>•</span>
                ${escapeHtml(formatDate(item.published_at || item.date))}
              </div>
            </div>
          ` : ""}
        </article>
      `;
    }).join("");

    grid.querySelectorAll("[data-open]").forEach(button => {
      button.onclick = () => {
        S.returnFocus = button;

        showViewer(
          S.items[Number(button.dataset.open)]
        );
      };
    });

    grid.querySelectorAll("[data-save]").forEach(button => {
      button.onclick = event => {
        event.stopPropagation();

        saveItem(
          S.items[Number(button.dataset.save)],
          button
        );
      };
    });
  }

  function setModeClass(mode) {
    [...document.body.classList]
      .filter(className => className.startsWith("mode-"))
      .forEach(className => {
        document.body.classList.remove(className);
      });

    document.body.classList.add(`mode-${mode}`);
  }

  function activateNavigation(mode) {
    document
      .querySelectorAll(".nav button")
      .forEach(button => {
        button.classList.remove("active");
        button.removeAttribute("aria-current");
      });

    const button =
      mode === "search"
        ? $("focusSearch")
        : mode === "saved"
          ? $("saved")
          : document.querySelector(
              `[data-nav="${mode === "explore" ? "explore" : "feed"}"]`
            );

    button?.classList.add("active");
    button?.setAttribute("aria-current", "page");
  }

  function selectTab(mode = "") {
    document.querySelectorAll(".tab").forEach(button => {
      const active = button.dataset.mode === mode;

      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });
  }

  function openSearch() {
    clearTimeout(searchTimer);
    S.request?.abort();

    S.request = null;
    S.loading = false;
    S.mode = "search";

    setModeClass("search");

    selectTab();

    activateNavigation("search");

    heading.textContent = "جست‌وجو";
    count.textContent = "موضوعت را بنویس";

    if (!search.value.trim()) {
      grid.innerHTML = `
        <div class="empty">
          نام موضوع، کانال یا چیزی که دنبالش هستی را بنویس.
        </div>
      `;
    }

    setTimeout(() => {
      search.focus();

      try {
        search.setSelectionRange(
          search.value.length,
          search.value.length
        );
      } catch {}
    }, 60);
  }

  async function load(mode = S.mode) {
    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = mode;

    const views = {
      feed: {
        title: "برای تو",
        sub: "انتخاب‌هایی که به سلیقه‌ات نزدیک‌ترند",
        glyph: "✦",
        heading: "منتخب برای تو",
        path: "/feed?limit=18"
      },
      trending: {
        title: "نبض امروز",
        sub: "پست‌هایی که همین حالا بیشتر دیده می‌شوند",
        glyph: "↗",
        heading: "داغ‌ترین‌های امروز",
        path: "/trending?limit=18"
      },
      fresh: {
        title: "تازه رسیده‌ها",
        sub: "قبل از همه، کشف‌های تازه را ببین",
        glyph: "◌",
        heading: "کشف‌های تازه",
        path: "/explore?limit=18"
      },
      explore: {
        title: "اکسپلور",
        sub: "",
        glyph: "◈",
        heading: "اکسپلور",
        path: "/explore?limit=24"
      }
    };

    const view = views[mode] || views.feed;

    setModeClass(mode);

    $("discoverTitle").textContent = view.title;
    $("discoverSub").textContent = view.sub;
    $("discoverGlyph").textContent = view.glyph;
    heading.textContent = view.heading;

    selectTab(mode);

    activateNavigation(mode);
    showSkeletons();

    try {
      const data = await api(view.path, {
        signal: controller.signal
      });

      S.items = arrangeItems(
        data.items || data.results || [],
        mode
      );
      S.cache[mode] = S.items;

      render();

      status.textContent = "آنلاین";
      status.classList.add("online");
    } catch (error) {
      if (error.name !== "AbortError") {
        grid.innerHTML = `
          <div class="empty">
            ارتباط برقرار نشد.
            <br>
            <small>${escapeHtml(error.message)}</small>
          </div>
        `;

        status.textContent = "نیاز به اتصال";
        status.classList.remove("online");
      }
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }
  }

  async function performSearch(value) {
    const query = value.trim();

    if (!query) {
      openSearch();
      return;
    }

    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = "search";

    setModeClass("search");

    selectTab();

    activateNavigation("search");
    showSkeletons();

    heading.textContent = `نتایج «${query}»`;
    count.textContent = "در حال جست‌وجو";

    try {
      const data = await api(
        `/search?q=${encodeURIComponent(query)}&limit=18`,
        { signal: controller.signal }
      );

      S.items = data.items || data.results || [];
      S.cache.search = S.items;

      render();

      status.textContent =
        data.source === "telegram_live"
          ? "جست‌وجوی زنده"
          : "نتایج هوشمند";

      status.classList.add("online");
    } catch (error) {
      if (error.name !== "AbortError") {
        grid.innerHTML = `
          <div class="empty">
            جست‌وجو انجام نشد.
            <br>
            <small>${escapeHtml(error.message)}</small>
          </div>
        `;
      }
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }
  }

  async function saveItem(item, button) {
    if (item.is_saved) {
      showToast("قبلاً ذخیره شده");
      return;
    }

    try {
      await api("/save", {
        method: "POST",
        body: JSON.stringify({
          content_id: item.content_id || item.id
        })
      });

      item.is_saved = true;

      if (button) {
        button.classList.add("saved");
        button.textContent = "♥";
      }

      $("viewerSave").textContent = "♥";

      showToast("به ذخیره‌ها اضافه شد");
      haptic("medium");
    } catch {
      showToast("ذخیره انجام نشد");
    }
  }

  function openCurrentTelegram() {
    const url = sourceUrl(S.current || {});

    if (!url) {
      showToast("لینک این پست در دسترس نیست");
      return;
    }

    try {
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, "_blank", "noopener");
      }
    } catch {
      window.open(url, "_blank", "noopener");
    }
  }

  function showViewer(item) {
    S.current = item;

    const [firstColor, secondColor] = palette(item);
    const type = contentType(item);
    const poster = posterUrl(item);
    const asset = assetUrl(item);
    const proxyPreview = previewUrl(item);
    const telegramEmbed = embedUrl(item);

    const isVideo =
      type === "VIDEO" &&
      Boolean(asset);

    const image =
      !isVideo
        ? (
            poster ||
            (
              ["IMAGE", "PHOTO"].includes(type)
                ? asset
                : ""
            ) ||
            (
              ["IMAGE", "PHOTO", "VIDEO", "MIXED"].includes(type)
                ? proxyPreview
                : ""
            )
          )
        : "";

    const titleText = cleanText(item.title || "");

    const bodyText = cleanText(
      item.description ||
      item.text ||
      item.message ||
      item.title ||
      ""
    );

    $("viewerMedia").style.setProperty(
      "--vg1",
      firstColor
    );

    $("viewerMedia").style.setProperty(
      "--vg2",
      secondColor
    );

    const viewerImage = $("viewerImage");
    const viewerVideo = $("viewerVideo");
    const viewerEmbed = $("viewerEmbed");

    viewerImage.hidden = !image;

    if (image) {
      let triedProxy =
        image === proxyPreview ||
        !proxyPreview;

      viewerImage.src = image;

      viewerImage.onerror = () => {
        if (!triedProxy && proxyPreview) {
          triedProxy = true;
          viewerImage.src = proxyPreview;
          return;
        }

        viewerImage.hidden = true;

        if (telegramEmbed) {
          viewerEmbed.hidden = false;
          viewerEmbed.src = telegramEmbed;
        }
      };
    }

    viewerVideo.hidden = !isVideo;

    if (isVideo) {
      viewerVideo.src = asset;
      viewerVideo.poster = poster || proxyPreview || "";

      viewerVideo.onerror = () => {
        if (telegramEmbed) {
          viewerVideo.hidden = true;
          viewerEmbed.hidden = false;
          viewerEmbed.src = telegramEmbed;
        }
      };
    }

    viewerEmbed.hidden =
      Boolean(image || isVideo || !telegramEmbed);

    if (!image && !isVideo && telegramEmbed) {
      viewerEmbed.src = telegramEmbed;
    }

    $("viewerTitle").textContent =
      titleText &&
      bodyText &&
      titleText !== bodyText &&
      !bodyText.startsWith(titleText)
        ? titleText
        : "";

    $("viewerChannel").textContent =
      channel(item);

    const viewerAvatar = $("viewerAvatar");
    const avatarImage = channelAvatarUrl(item);

    viewerAvatar.textContent = channel(item).slice(0, 1);

    if (avatarImage) {
      const imageElement = document.createElement("img");

      imageElement.src = avatarImage;
      imageElement.alt = "";
      imageElement.referrerPolicy = "no-referrer";
      imageElement.onerror = () => imageElement.remove();

      viewerAvatar.append(imageElement);
    }

    $("viewerMeta").textContent =
      formatDate(item.published_at || item.date);

    $("viewerDesc").textContent =
      bodyText ||
      titleText ||
      "این پست را در تلگرام ببین.";

    $("viewerSave").textContent =
      item.is_saved ? "♥" : "♡";

    $("back").classList.add("show");
    $("viewer").classList.add("show");

    document.body.style.overflow = "hidden";

    requestAnimationFrame(() => {
      const focusTarget = isTelegramHost
        ? $("viewer")
        : $("viewerClose");

      try {
        focusTarget.focus({ preventScroll:true });
      } catch {}
    });

    try {
      tg?.BackButton?.show();

      if (nativeMain) {
        tg.MainButton
          .setText("دیدن پست در تلگرام")
          .show();
      }
    } catch {}

    haptic();

    api("/events", {
      method: "POST",
      body: JSON.stringify({
        content_id: item.content_id || item.id,
        event_type: "open"
      })
    }).catch(() => {});
  }

  function hide() {
    if (!$("viewer").classList.contains("show")) {
      return;
    }

    $("back").classList.remove("show");
    $("viewer").classList.remove("show");

    $("viewerVideo").pause();
    $("viewerVideo").removeAttribute("src");
    $("viewerImage").removeAttribute("src");
    $("viewerEmbed").removeAttribute("src");

    $("viewerImage").onerror = null;
    $("viewerVideo").onerror = null;

    document.body.style.overflow = "";

    try {
      tg?.BackButton?.hide();
      tg?.MainButton?.hide();
    } catch {}

    S.current = null;

    const returnFocus = S.returnFocus;

    S.returnFocus = null;

    try {
      returnFocus?.focus({ preventScroll:true });
    } catch {}
  }

  async function sendFeedback(type) {
    if (!S.current) return;

    const current = S.current;

    try {
      await api("/feedback", {
        method: "POST",
        body: JSON.stringify({
          content_id:
            current.content_id || current.id,
          creator_id: current.creator_id,
          feedback_type: type
        })
      });

      S.items = S.items.filter(
        item => item !== current
      );

      hide();
      render();
      showToast("بازخوردت ثبت شد");
    } catch {
      showToast("بازخورد ثبت نشد");
    }
  }

  async function loadSaved() {
    clearTimeout(searchTimer);
    S.request?.abort();

    const controller = new AbortController();

    S.request = controller;
    S.loading = true;
    S.mode = "saved";

    setModeClass("saved");

    selectTab();

    activateNavigation("saved");

    heading.textContent = "ذخیره‌های تو";
    count.textContent = "در حال دریافت";

    showSkeletons();

    try {
      const data = await api(
        "/saved?limit=18",
        { signal: controller.signal }
      );

      S.items = data.items || data.results || [];
    } catch {
      const seen = new Set();

      S.items = Object
        .values(S.cache)
        .flat()
        .filter(item => {
          if (!item || !item.is_saved) {
            return false;
          }

          const id = item.content_id || item.id;

          if (seen.has(id)) {
            return false;
          }

          seen.add(id);
          return true;
        });
    } finally {
      if (S.request === controller) {
        S.loading = false;
        S.request = null;
      }
    }

    render();

    if (!S.items.length) {
      grid.innerHTML = `
        <div class="empty">
          هنوز پستی ذخیره نکرده‌ای.
          <br>
          روی قلب هر پست بزن تا اینجا نگهش داری.
        </div>
      `;
    }
  }

  let searchTimer;

  document.querySelectorAll(".tab").forEach(button => {
    button.onclick = () => {
      haptic();
      load(button.dataset.mode);
    };
  });

  document.querySelectorAll("[data-nav]").forEach(button => {
    button.onclick = () => {
      haptic();
      load(button.dataset.nav);
    };
  });

  $("searchAction").onclick = () => {
    performSearch(search.value);
  };

  search.oninput = () => {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
      performSearch(search.value);
    }, 500);
  };

  search.onkeydown = event => {
    if (event.key === "Enter") {
      event.preventDefault();
      performSearch(search.value);
    }
  };

  $("focusSearch").onclick = () => {
    haptic();
    openSearch();
  };

  $("saved").onclick = () => {
    haptic();
    loadSaved();
  };

  $("back").onclick = hide;
  $("viewerClose").onclick = hide;

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      hide();
    }
  });

  $("viewerSave").onclick = () => {
    if (S.current) {
      saveItem(S.current, $("viewerSave"));
    }
  };

  $("openTelegram").onclick =
    openCurrentTelegram;

  $("notInterested").onclick = () => {
    sendFeedback("not_interested");
  };

  document
    .querySelectorAll("[data-feedback]")
    .forEach(button => {
      button.onclick = () => {
        sendFeedback(button.dataset.feedback);
      };
    });

  load("feed");
})();
</script>
</body>
</html>
