<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Telegram Discovery</title>

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6f8">

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f6f8 !important;
      color: #111827 !important;
      color-scheme: light;
    }

    html {
      background: #f4f6f8 !important;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f6f8;
      color: #111827;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));
    }

    .header {
      padding: 8px 2px 16px;
    }

    .brand {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: .68;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search input {
      min-width: 0;
      flex: 1;

      border: 0;
      outline: none;
      border-radius: 15px;

      padding: 13px 14px;
      font-size: 15px;

      background: #ffffff;
      color: #111827;
    }

    .search button,
    .tab.active,
    .action.primary {
      border: 0;
      background: #229ed9;
      color: #ffffff;
    }

    .search button {
      border-radius: 15px;
      padding: 0 17px;
      font-weight: 700;
    }

    .search button:disabled {
      opacity: .6;
      cursor: default;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      border-radius: 14px;

      padding: 13px 7px;
      font-size: 14px;

      background: #ffffff;
      color: #111827;
    }

    .status {
      border-radius: 14px;

      padding: 11px 13px;
      margin-bottom: 12px;

      font-size: 13px;
      background: #ffffff;
    }

    .status.success {
      color: #16803c;
    }

    .status.error {
      color: #b00020;
    }

    .status.info {
      color: #1769aa;
    }

    .feed {
      width: 100%;
    }

    .card {
      width: 100%;
      margin-bottom: 12px;

      padding: 16px;
      border-radius: 18px;

      background: #ffffff;
    }

    .card.telegram-card {
      border-right: 4px solid #229ed9;
    }

    .card h2 {
      margin: 0 0 8px;

      font-size: 18px;
      line-height: 1.5;
    }

    .card p {
      margin: 0 0 11px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .78;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 12px;

      font-size: 12px;
      opacity: .58;
    }

    .chip {
      padding: 4px 8px;
      border-radius: 999px;

      background: #eef2f7;
    }

    .chip.telegram {
      background: #e4f5fc;
      color: #1685b5;
      opacity: 1;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: 8px;
    }

    .actions.single {
      grid-template-columns: 1fr;
    }

    .action {
      min-width: 0;

      border: 0;
      border-radius: 12px;

      padding: 11px 8px;

      font-size: 13px;

      background: #eef2f7;
      color: #111827;
    }

    .action.saved {
      background: #dff5e7;
      color: #16803c;
    }

    .action:disabled {
      opacity: .7;
      cursor: default;
    }

    .empty {
      text-align: center;

      padding: 50px 20px;

      font-size: 14px;
      line-height: 1.8;

      opacity: .65;
    }

    .error-card {
      border-radius: 18px;

      padding: 16px;

      background: #ffffff;
      color: #b00020;

      line-height: 1.8;
    }

    .error-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .telegram-source {
      font-size: 12px;
      margin-top: 5px;
      opacity: .6;
      direction: ltr;
      text-align: right;
    }

    .footer {
      text-align: center;

      margin-top: 25px;

      font-size: 11px;
      opacity: .45;
    }

    @media (max-width: 380px) {
      .brand {
        font-size: 25px;
      }

      .tab {
        font-size: 12px;
      }

      .search button {
        padding: 0 13px;
      }

      .actions {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      کشف
    </div>

    <div class="subtitle">
      محتوای جالب تلگرام را کشف کن
    </div>
  </header>


  <!-- SEARCH -->

  <div class="search">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="جستجو در تلگرام..."
    >

    <button
      id="searchBtn"
      type="button"
    >
      جستجو
    </button>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      id="feedBtn"
      class="tab active"
      type="button"
    >
      ✨ پیشنهادهای من
    </button>

    <button
      id="trendBtn"
      class="tab"
      type="button"
    >
      🔥 ترندها
    </button>

    <button
      id="exploreBtn"
      class="tab"
      type="button"
    >
      🧭 اکسپلور
    </button>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status"
  >
    در حال اتصال...
  </div>


  <!-- FEED -->

  <main
    id="feed"
    class="feed"
  >
    <div class="empty">
      در حال آماده‌سازی Discovery...
    </div>
  </main>


  <div class="footer">
    Telegram Discovery · MVP
  </div>

</div>


<script>

/* =========================================================
   CONFIG
   =========================================================

   Discovery و Telegram دو API جدا دارند.

   Discovery:
   /api/discovery/...

   Telegram:
   /api/telegram/...

   هر دو از همین Cloudflare Worker سرو می‌شوند.
========================================================= */

const DISCOVERY_API_URL =
  window.location.origin + "/api/discovery";

const TELEGRAM_API_URL =
  window.location.origin + "/api/telegram";


/* =========================================================
   TELEGRAM WEB APP
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


/* =========================================================
   DOM
========================================================= */

const statusEl =
  document.getElementById("status");

const feedEl =
  document.getElementById("feed");

const searchInput =
  document.getElementById("searchInput");

const searchBtn =
  document.getElementById("searchBtn");

const feedBtn =
  document.getElementById("feedBtn");

const trendBtn =
  document.getElementById("trendBtn");

const exploreBtn =
  document.getElementById("exploreBtn");


/* =========================================================
   STATE
========================================================= */

let currentMode = "feed";

let feedItems = [];

let currentUser = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  type = ""
) {

  statusEl.textContent = text;

  statusEl.className =
    "status" +
    (type
      ? " " + type
      : "");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   TELEGRAM INIT
========================================================= */

function initTelegram() {

  if (!tg) {

    setStatus(
      "⚠️ این برنامه باید داخل Telegram باز شود",
      "error"
    );

    return false;
  }


  try {

    tg.ready();

    tg.expand();


    try {

      if (tg.setHeaderColor) {
        tg.setHeaderColor("#f4f6f8");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#f4f6f8");
      }

      if (tg.setBottomBarColor) {
        tg.setBottomBarColor("#f4f6f8");
      }

    } catch (_) {}


    document.documentElement.style.background =
      "#f4f6f8";

    document.body.style.background =
      "#f4f6f8";

    document.body.style.color =
      "#111827";


    return true;

  } catch (error) {

    console.error(
      "Telegram init:",
      error
    );

    setStatus(
      "⚠️ Telegram WebApp آماده نشد",
      "error"
    );

    return false;
  }
}


/* =========================================================
   GENERIC API REQUEST
========================================================= */

async function requestApi(
  baseUrl,
  path,
  options = {}
) {

  const headers = {
    ...(options.headers || {})
  };


  if (
    !headers["Content-Type"] &&
    options.body
  ) {

    headers["Content-Type"] =
      "application/json";
  }


  /*
   * Telegram WebApp initData
   *
   * Discovery Backend می‌تواند
   * برای Auth از آن استفاده کند.
   *
   * Telegram Search نیز آن را دریافت می‌کند
   * ولی برای خود teleproto لازم نیست.
   */

  const initData =
    tg?.initData || "";


  if (initData) {

    headers["X-Telegram-Init-Data"] =
      initData;
  }


  const response =
    await fetch(
      baseUrl + path,
      {
        ...options,
        headers
      }
    );


  const raw =
    await response.text();


  let data = {};


  try {

    data =
      raw
        ? JSON.parse(raw)
        : {};

  } catch (_) {

    data = {
      message: raw
    };
  }


  if (!response.ok) {

    const error =
      new Error(
        data.error ||
        data.message ||
        `HTTP ${response.status}`
      );


    error.status =
      response.status;

    error.data =
      data;

    throw error;
  }


  return data;
}


/* =========================================================
   DISCOVERY API
========================================================= */

async function discoveryApi(
  path,
  options = {}
) {

  return requestApi(
    DISCOVERY_API_URL,
    path,
    options
  );
}


/* =========================================================
   TELEGRAM API
========================================================= */

async function telegramApi(
  path,
  options = {}
) {

  return requestApi(
    TELEGRAM_API_URL,
    path,
    options
  );
}


/* =========================================================
   BACKEND HEALTH
========================================================= */

async function checkBackend() {

  try {

    const result =
      await discoveryApi(
        "/health"
      );


    console.log(
      "Discovery API health:",
      result
    );


    return result?.ok === true;

  } catch (error) {

    console.error(
      "Backend health:",
      error
    );


    setStatus(
      "🔴 Health check ناموفق: " +
      (
        error?.message ||
        "Network/CORS error"
      ),
      "error"
    );


    return false;
  }
}


/* =========================================================
   TELEGRAM SERVER HEALTH
========================================================= */

async function checkTelegramServer() {

  try {

    const result =
      await telegramApi(
        "/health"
      );


    console.log(
      "Telegram server health:",
      result
    );


    return result?.ok === true;

  } catch (error) {

    console.error(
      "Telegram server health:",
      error
    );


    return false;
  }
}


/* =========================================================
   TELEGRAM AUTH
========================================================= */

async function authenticateTelegram() {

  if (!tg?.initData) {

    setStatus(
      "⚠️ اطلاعات Telegram در دسترس نیست",
      "error"
    );

    return false;
  }


  try {

    const result =
      await discoveryApi(
        "/auth/telegram",
        {
          method: "POST",

          body: JSON.stringify({
            initData:
              tg.initData
          })
        }
      );


    console.log(
      "Telegram authentication:",
      result
    );


    if (
      result?.authenticated &&
      result.user
    ) {

      currentUser =
        result.user;

      return true;
    }


    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );


    return false;

  } catch (error) {

    console.error(
      "Telegram auth:",
      error
    );


    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );


    return false;
  }
}


/* =========================================================
   ACTIVE TAB
========================================================= */

function setActiveTab(
  mode
) {

  feedBtn.classList.toggle(
    "active",
    mode === "feed"
  );

  trendBtn.classList.toggle(
    "active",
    mode === "trending"
  );

  exploreBtn.classList.toggle(
    "active",
    mode === "explore"
  );
}


/* =========================================================
   NORMALIZE DISCOVERY ITEM
========================================================= */

function normalizeDiscoveryItem(
  item
) {

  return {

    id:
      item.id ||
      item.content_id ||
      "",

    title:
      item.title ||
      "بدون عنوان",

    description:
      item.description ||
      item.text_content ||
      "توضیحی برای این محتوا ثبت نشده است.",

    source_url:
      item.source_url ||
      item.url ||
      "",

    content_type:
      item.content_type ||
      "content",

    creator_name:
      item.creator_name ||
      item.creator_username ||
      "",

    score:
      Number(
        item.score ??
        item.final_score ??
        0
      ),

    reason:
      item.reason ||
      "",

    is_saved:
      item.is_saved === true ||
      item.is_saved === 1 ||
      item.is_saved === "true" ||
      item.is_saved === "1",

    source:
      "discovery"
  };
}


/* =========================================================
   NORMALIZE TELEGRAM RESULT
========================================================= */

function normalizeTelegramItem(
  item,
  index
) {

  const isChannel =
    item?.result_type ===
    "channel";

  const text =
    item?.text ??
    item?.message ??
    item?.rawText ??
    "";

  const username =
    item?.channel_username ??
    item?.chat_username ??
    item?.username ??
    "";

  const title =
    item?.channel_title ??
    item?.title ??
    username ??
    "Telegram";

  const channelUrl =
    item?.channel_url ??
    (
      username
        ? `https://t.me/${username}`
        : ""
    );

  const messageUrl =
    item?.message_url ??
    item?.link ??
    item?.url ??
    "";

  return {

    id:
      String(
        item?.id ??
        item?.result_id ??
        `telegram-${index}`,
      ),

    result_type:
      isChannel
        ? "channel"
        : "telegram_message",

    telegram_message_id:
      item?.telegram_message_id ??
      (
        !isChannel
          ? item?.id ?? null
          : null
      ),

    title,

    description:

      isChannel

        ? (
            item?.description ||
            "کانال تلگرام"
          )

        : (
            text.trim() ||
            (
              item?.has_media
                ? "📎 این پست شامل رسانه است."
                : "این پست متن قابل نمایش ندارد."
            )
          ),

    source_url:
      isChannel
        ? channelUrl
        : messageUrl,

    channel_url:
      channelUrl,

    message_url:
      messageUrl,

    content_type:
      isChannel
        ? "telegram-channel"
        : "telegram",

    creator_name:
      username
        ? "@" + username
        : "",

    score:
      Number(
        item?.search_score ??
        item?.score ??
        0,
      ),

    reason:
      isChannel
        ? "telegram_channel_search"
        : "telegram_global_search",

    is_saved:
      false,

    source:
      "telegram",

    channel_username:
      username,

    channel_title:
      title,

    chat_id:
      item?.chat_id ??
      item?.channel_peer_id ??
      null,

    channel_peer_id:
      item?.channel_peer_id ??
      null,

    date:
      item?.date ??
      null,

    has_media:
      Boolean(
        item?.has_media,
      ),
  };
}

/* =========================================================
   LOAD DISCOVERY FEED
========================================================= */

async function loadFeed(
  mode = "feed"
) {

  currentMode =
    mode;


  setActiveTab(
    mode
  );


  setStatus(
    "در حال دریافت محتوا..."
  );


  feedEl.innerHTML =
    '<div class="empty">در حال بارگذاری...</div>';


  try {

    let result;


    if (
      mode ===
      "feed"
    ) {

      result =
        await discoveryApi(
          "/feed?limit=20"
        );

    } else if (
      mode ===
      "trending"
    ) {

      result =
        await discoveryApi(
          "/trending?limit=20"
        );

    } else {

      result =
        await discoveryApi(
          "/explore?limit=20"
        );
    }


    console.log(
      "Discovery response:",
      result
    );


    feedItems =
      Array.isArray(
        result?.items
      )

        ? result.items.map(
            normalizeDiscoveryItem
          )

        : [];


    renderFeed();


    setStatus(

      feedItems.length

        ? `🟢 ${feedItems.length} محتوا آماده است`

        : "🟡 هنوز محتوایی برای نمایش پیدا نشد",

      feedItems.length
        ? "success"
        : ""

    );

  } catch (error) {

    console.error(
      "Discovery feed:",
      error
    );


    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          دریافت محتوا ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            error.message ||
            "خطای نامشخص"
          )}
        </div>

      </div>

    `;


    setStatus(
      "🔴 خطا در دریافت محتوا",
      "error"
    );
  }
}


/* =========================================================
   TELEGRAM GLOBAL SEARCH
========================================================= */

async function doTelegramSearch() {

  const query =
    searchInput.value.trim();


  if (!query) {

    setStatus(
      "عبارت جستجو را وارد کن"
    );

    searchInput.focus();

    return;
  }


  /*
   * حداکثر طول
   */

  if (query.length > 200) {

    setStatus(
      "🔴 عبارت جستجو بیش از حد طولانی است",
      "error"
    );

    return;
  }


  /*
   * حالت Search
   */

  currentMode =
    "telegram-search";


  feedBtn.classList.remove(
    "active"
  );

  trendBtn.classList.remove(
    "active"
  );

  exploreBtn.classList.remove(
    "active"
  );


  searchBtn.disabled =
    true;


  setStatus(
    "🔎 در حال جستجوی آنلاین در Telegram..."
  );


  feedEl.innerHTML = `

    <div class="empty">
      🔎 در حال جستجوی واقعی در Telegram...<br>
      لطفاً چند لحظه صبر کن.
    </div>

  `;


  try {

    /*
     * این مهم‌ترین تغییر است:
     *
     * قبلاً:
     *
     * /api/discovery/search
     *
     * اکنون:
     *
     * /api/telegram/search
     *
     * و Worker آن را به teleproto
     * و Telegram Global Search می‌دهد.
     */

    const result =
      await telegramApi(
        "/search?q=" +
        encodeURIComponent(
          query
        ) +
        "&limit=20"
      );


    console.log(
      "Telegram Search response:",
      result
    );


    if (
      result?.ok !== true
    ) {

      throw new Error(
        result?.error ||
        "Telegram search failed"
      );
    }


    const telegramResults =
      Array.isArray(
        result?.results
      )
        ? result.results
        : [];


    /*
     * تبدیل results به ساختار کارت
     */

    feedItems =
      telegramResults.map(
        normalizeTelegramItem
      );


    renderFeed();


    if (
      feedItems.length
    ) {

      setStatus(
        `🟢 ${feedItems.length} نتیجه واقعی از Telegram برای «${query}»`,
        "success"
      );

    } else {

      setStatus(
        `🟡 برای «${query}» نتیجه‌ای در Telegram پیدا نشد`
      );
    }

  } catch (error) {

    console.error(
      "Telegram global search:",
      error
    );


    const status =
      error?.status;


    let message =
      error?.message ||
      "Telegram search failed";


    if (
      status === 401
    ) {

      message =
        "نشست Telegram معتبر نیست یا حساب مجاز نیست.";

    } else if (
      status === 404
    ) {

      message =
        "مسیر جستجوی Telegram روی Worker پیدا نشد. Worker را دوباره Deploy کن.";

    } else if (
      status === 502
    ) {

      message =
        "Worker نتوانست به سرویس مقصد متصل شود.";

    }


    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          جستجو ناموفق بود
        </strong>

        <div>
          ${escapeHtml(
            message
          )}
        </div>

        ${
          status
            ? `
              <div style="margin-top:8px;font-size:12px;opacity:.65">
                HTTP ${escapeHtml(status)}
              </div>
            `
            : ""
        }

      </div>

    `;


    setStatus(
      "🔴 خطا در جستجوی Telegram",
      "error"
    );

  } finally {

    searchBtn.disabled =
      false;
  }
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed() {

  if (!feedItems.length) {

    feedEl.innerHTML = `

      <div class="empty">

        هنوز محتوایی برای نمایش
        وجود ندارد.

      </div>

    `;

    return;
  }


  feedEl.innerHTML =
    feedItems.map(
      (item, index) => {

        /*
         * Telegram result
         */

        if (
          item.source ===
          "telegram"
        ) {

          return renderTelegramCard(
            item,
            index
          );
        }


        /*
         * Discovery result
         */

        return renderDiscoveryCard(
          item,
          index
        );
      }
    ).join("");
}

function renderDiscoveryCard(
  item,
  index
) {

  const id =
    escapeHtml(

    );


  const url =
    escapeHtml(
      item.source_url
    );


  const saved =
    item.is_saved === true;


  const saveClass =
    saved
      ? " saved"
      : "";


  const saveText =
    saved
      ? "✅ ذخیره شد"
      : "⭐ ذخیره";


  return `

    <article class="card">

      <h2>
        ${escapeHtml(
          item.title
        )}
      </h2>


      <p>
        ${escapeHtml(

        )}

        <span class="chip">
          ${escapeHtml(
            item.content_type
          )}
        </span>


        ${
          item.creator_name

            ? `
              <span class="chip">
                ${escapeHtml(
                  item.creator_name
                )}
              </span>
            `

            : ""
        }


        ${
          item.score

            ? `
              <span class="chip">
                امتیاز

            `

            : ""

              </span>
            `

            : ""
        }

      <div class="actions">

        ${
          url

            ? `

              <button
                class="action primary"
                data-id="${id}"

                    this.dataset.url
                  )
                "
              >
                🔗 مشاهده
              </button>

            `

            : `

              <button
                class="action"
                disabled
              >
                لینک ندارد
              </button>

            `
        }


        <button
          class="action${saveClass}"
          data-id="${id}"
          onclick="
            saveContent(
              this.dataset.id
            )
          "
        >
          ${saveText}
        </button>


        <button
          class="action"
          data-id="${id}"
          onclick="
            notInterested(
              this.dataset.id
            )
          "
        >
          👎
        </button>

      </div>

    </article>

  `;
}


/* =========================================================
   OPEN TELEGRAM CONTENT
========================================================= */

function openTelegramContent(
  url
) {

  if (!url) {
    return;
  }


  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   OPEN DISCOVERY CONTENT
========================================================= */

async function openContent(
  contentId,
  url
) {

  if (
    !contentId ||
    !url
  ) {
    return;
  }


  try {

    await discoveryApi(
      "/impression",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          position:
            feedItems.findIndex(
              x =>
                x.id ===
                contentId
            ),

          score:
            feedItems.find(
              x =>
                x.id ===
                contentId
            )?.score || 0,

          reason:
            currentMode

        })
      }
    );

  } catch (error) {

    console.warn(
      "Impression:",
      error
    );
  }


  try {

    if (
      tg?.openLink
    ) {

      tg.openLink(
        url
      );

      return;
    }

  } catch (error) {

    console.warn(
      "Telegram openLink:",
      error
    );
  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* =========================================================
   SAVE DISCOVERY CONTENT
========================================================= */

async function saveContent(
  contentId
) {

  if (!contentId) {
    return;
  }


  if (!currentUser) {

    setStatus(
      "⚠️ برای ذخیره باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }


  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );


  /*
   * Telegram results نباید
   * به endpoint ذخیره Discovery بروند.
   */

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ این نتیجه مستقیماً از Telegram آمده است",
      "info"
    );

    return;
  }


  if (
    item &&
    item.is_saved
  ) {

    setStatus(
      "✅ این محتوا قبلاً ذخیره شده است",
      "success"
    );

    return;
  }


  try {

    await discoveryApi(
      "/save",
      {
        method: "POST",

        body: JSON.stringify({
          content_id:
            contentId
        })
      }
    );


    if (item) {
      item.is_saved = true;
    }


    renderFeed();


    setStatus(
      "⭐ ذخیره شد",
      "success"
    );

  } catch (error) {

    console.error(
      "Save:",
      error
    );


    setStatus(
      "🔴 ذخیره ناموفق بود: " +
      (
        error?.message ||
        ""
      ),
      "error"
    );
  }
}


/* =========================================================
   NOT INTERESTED
========================================================= */

async function notInterested(
  contentId
) {

  if (!contentId) {
    return;
  }


  if (!currentUser) {

    setStatus(
      "⚠️ برای ثبت بازخورد باید داخل Telegram احراز هویت شوی",
      "error"
    );

    return;
  }


  const item =
    feedItems.find(
      x =>
        x.id ===
        contentId
    );


  /*
   * Telegram Search نتیجه خام است.
   * هنوز content_id دیتابیس نیست.
   */

  if (
    item?.source ===
    "telegram"
  ) {

    setStatus(
      "ℹ️ بازخورد برای نتایج مستقیم Telegram فعلاً ثبت نمی‌شود",
      "info"
    );

    return;
  }


  try {

    await discoveryApi(
      "/feedback",
      {
        method: "POST",

        body: JSON.stringify({

          content_id:
            contentId,

          feedback_type:
            "NOT_INTERESTED"

        })
      }
    );


    setStatus(
      "👍 بازخورد ثبت شد",
      "success"
    );


    feedItems =
      feedItems.filter(
        item =>
          item.id !==
          contentId
      );


    renderFeed();

  } catch (error) {

    console.error(
      "Feedback:",
      error
    );


    setStatus(
      "🔴 ثبت بازخورد ناموفق بود",
      "error"
    );
  }
}

);

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      doTelegramSearch();
    }

  }
);


/* =========================================================
   START APP
========================================================= */

async function startApp() {

  /*
   * Telegram WebApp
   */

  if (!initTelegram()) {
    return;
  }


  setStatus(
    "در حال اتصال به Discovery..."
  );


  /*
   * 1. Discovery Backend
   */

  const healthy =
    await checkBackend();


  if (!healthy) {

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          Discovery API در دسترس نیست
        </strong>

        <div>
          اتصال به Backend برقرار نشد.
        </div>

      </div>

    `;


    setStatus(
      "🔴 Backend در دسترس نیست",
      "error"
    );


    return;
  }


  /*
   * 2. Telegram WebApp Auth
   */

  const authenticated =
    await authenticateTelegram();


  if (!authenticated) {

    feedEl.innerHTML = `

      <div class="error-card">

        <strong>
          احراز هویت Telegram ناموفق بود
        </strong>

        <div>
          برنامه را از داخل Telegram باز کن.
        </div>

      </div>

    `;


    return;
  }


  /*
   * 3. بررسی Telegram Search Server
   *
   * این مرحله فقط برای تشخیص مشکل است.
   */

  const telegramHealthy =
    await checkTelegramServer();


  if (!telegramHealthy) {

    console.warn(
      "Telegram search server health check failed"
    );


    /*
     * فعلاً برنامه را متوقف نمی‌کنیم.
     *
     * چون ممکن است health endpoint
     * به هر دلیل پاسخ ندهد ولی search
     * کار کند.
     */

  }


  setStatus(
    "🟢 آماده",
    "success"
  );


  /*
   * 4. Feed
   */

  await loadFeed(
    "feed"
  );
}


/* =========================================================
   BOOT
========================================================= */

startApp();

</script>
