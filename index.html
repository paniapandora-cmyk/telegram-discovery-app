<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f6f8">

  <!-- جلوگیری از کش شدن محتوای HTML در مرورگرهای سازگار -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">

  <title>Telegram Discovery</title>

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f6f8 !important;
      color: #111827 !important;
      color-scheme: light;
    }

    html {
      background: #f4f6f8 !important;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .header {
      padding: 8px 2px 16px;
    }

    .brand {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.68;
    }

    /* SEARCH */

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search input {
      min-width: 0;
      flex: 1;

      border: 0;
      outline: none;

      border-radius: 15px;
      padding: 13px 14px;

      font-size: 15px;

      background: #ffffff;
      color: #111827;
    }

    .search input::placeholder {
      color: #8b949e;
    }

    .search button {
      border: 0;
      border-radius: 15px;

      padding: 0 17px;

      background: #229ed9;
      color: #ffffff;

      font-weight: 700;
    }

    /* TABS */

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      border-radius: 14px;
      padding: 13px 7px;

      font-size: 14px;

      background: #ffffff;
      color: #111827;
    }

    .tab.active {
      background: #229ed9;
      color: #ffffff;
    }

    /* STATUS */

    .status {
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 12px;

      font-size: 13px;

      background: #ffffff;
      color: #111827;
    }

    .status.success {
      color: #16803c;
    }

    .status.error {
      color: #b00020;
    }

    /* FEED */

    .feed {
      width: 100%;
    }

    .card {
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;

      border-radius: 18px;

      background: #ffffff;
      color: #111827;
    }

    .card h2 {
      margin: 0 0 8px;

      font-size: 18px;
      line-height: 1.5;
    }

    .card p {
      margin: 0 0 11px;

      font-size: 14px;
      line-height: 1.8;

      opacity: 0.78;
    }

    .meta {
      margin-bottom: 12px;

      font-size: 12px;
      opacity: 0.55;
    }

    .reason {
      margin-bottom: 12px;

      font-size: 11px;
      opacity: 0.45;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action {
      flex: 1;

      border: 0;
      border-radius: 12px;

      padding: 11px 8px;

      font-size: 13px;

      background: #eef2f7;
      color: #111827;
    }

    .action.primary {
      background: #229ed9;
      color: #ffffff;
    }

    .action.saved {
      background: #dff5e7;
      color: #16803c;
    }

    .action.disliked {
      background: #fde4e4;
      color: #b00020;
    }

    /* EMPTY */

    .empty {
      text-align: center;

      padding: 50px 20px;

      font-size: 14px;
      line-height: 1.8;

      opacity: 0.65;
    }

    /* ERROR */

    .error-card {
      border-radius: 18px;
      padding: 16px;

      background: #ffffff;
      color: #b00020;
    }

    .error-card strong {
      display: block;
      margin-bottom: 8px;
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 25px;

      font-size: 11px;

      opacity: 0.45;
    }

    @media (max-width: 380px) {
      .brand {
        font-size: 25px;
      }

      .tab {
        font-size: 12px;
      }

      .search button {
        padding: 0 13px;
      }

      .action {
        font-size: 12px;
      }
    }
  </style>
</head>

<body style="background:#f4f6f8;color:#111827;">

<div class="app">

  <header class="header">
    <div class="brand">
      کشف
    </div>

    <div class="subtitle">
      محتوای جالب تلگرام را کشف کن
    </div>
  </header>

  <div class="search">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="جستجو..."
    >

    <button
      id="searchBtn"
      type="button"
    >
      جستجو
    </button>

  </div>

  <div class="tabs">

    <button
      id="feedBtn"
      class="tab active"
      type="button"
      data-mode="feed"
    >
      ✨ پیشنهادهای من
    </button>

    <button
      id="trendBtn"
      class="tab"
      type="button"
      data-mode="trending"
    >
      🔥 ترندها
    </button>

    <button
      id="exploreBtn"
      class="tab"
      type="button"
      data-mode="explore"
    >
      🧭 اکسپلور
    </button>

  </div>

  <div
    id="status"
    class="status"
  >
    در حال آماده‌سازی...
  </div>

  <main
    id="feed"
    class="feed"
  >
    <div class="empty">
      در حال آماده‌سازی Discovery...
    </div>
  </main>

  <div class="footer">
    Telegram Discovery · نسخه 0.2.0-feedback-loop
  </div>

</div>

<script>
(function () {

  "use strict";

  /*
   * =========================================================
   * CONFIG
   * =========================================================
   */

  const APP_VERSION = "0.2.0-feedback-loop";

  const API_URL =
    "https://jmxlwocemvjwkztbasja.supabase.co/functions/v1/discovery-api";


  /*
   * =========================================================
   * TELEGRAM
   * =========================================================
   */

  let tg = null;


  /*
   * =========================================================
   * ELEMENTS
   * =========================================================
   */

  const statusEl =
    document.getElementById("status");

  const feedEl =
    document.getElementById("feed");

  const searchInput =
    document.getElementById("searchInput");

  const searchBtn =
    document.getElementById("searchBtn");

  const feedBtn =
    document.getElementById("feedBtn");

  const trendBtn =
    document.getElementById("trendBtn");

  const exploreBtn =
    document.getElementById("exploreBtn");


  /*
   * =========================================================
   * STATE
   * =========================================================
   */

  let currentUser = null;

  let currentMode = "feed";

  let feedItems = [];

  let currentSessionId = null;


  /*
   * =========================================================
   * UUID
   * =========================================================
   */

  function makeUuid() {

    if (
      typeof crypto !== "undefined" &&
      typeof crypto.randomUUID === "function"
    ) {
      return crypto.randomUUID();
    }

    return (
      "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
    ).replace(
      /[xy]/g,
      function (c) {

        const r =
          Math.random() * 16 | 0;

        const v =
          c === "x"
            ? r
            : (r & 0x3 | 0x8);

        return v.toString(16);
      }
    );
  }


  /*
   * =========================================================
   * STATUS
   * =========================================================
   */

  function setStatus(
    text,
    type = ""
  ) {

    statusEl.textContent = text;

    statusEl.className =
      "status" +
      (
        type
          ? " " + type
          : ""
      );
  }


  /*
   * =========================================================
   * HTML ESCAPE
   * =========================================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
   * =========================================================
   * TELEGRAM INITIALIZATION
   * =========================================================
   */

  function initTelegram() {

    tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    if (!tg) {
      return false;
    }

    try {

      tg.ready();
      tg.expand();

      try {

        if (
          typeof tg.setHeaderColor ===
          "function"
        ) {
          tg.setHeaderColor(
            "#f4f6f8"
          );
        }

        if (
          typeof tg.setBackgroundColor ===
          "function"
        ) {
          tg.setBackgroundColor(
            "#f4f6f8"
          );
        }

        if (
          typeof tg.setBottomBarColor ===
          "function"
        ) {
          tg.setBottomBarColor(
            "#f4f6f8"
          );
        }

      } catch (_) {}

      document.documentElement.style.background =
        "#f4f6f8";

      document.body.style.background =
        "#f4f6f8";

      document.body.style.color =
        "#111827";

      return true;

    } catch (error) {

      console.error(
        "Telegram init:",
        error
      );

      return false;
    }
  }


  /*
   * =========================================================
   * WAIT FOR TELEGRAM
   * =========================================================
   */

  async function waitForTelegram() {

    for (
      let attempt = 0;
      attempt < 60;
      attempt++
    ) {

      setStatus(
        "در حال آماده‌سازی Telegram..."
      );

      if (
        initTelegram()
      ) {

        for (
          let i = 0;
          i < 30;
          i++
        ) {

          if (
            tg &&
            tg.initData
          ) {

            return true;
          }

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                100
              )
          );
        }

        if (tg) {
          return true;
        }
      }

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );
    }

    return false;
  }


  /*
   * =========================================================
   * API
   * =========================================================
   */

  async function api(
    path,
    options = {}
  ) {

    if (!tg) {
      initTelegram();
    }

    const headers = {
      ...(options.headers || {})
    };

    if (
      options.body &&
      !headers["Content-Type"]
    ) {
      headers["Content-Type"] =
        "application/json";
    }

    const initData =
      tg?.initData || "";

    if (initData) {
      headers[
        "X-Telegram-Init-Data"
      ] = initData;
    }

    /*
     * هر Request یک ID داشته باشد.
     * برای trace کردن خطاها مفید است.
     */

    headers["X-Request-ID"] =
      makeUuid();

    const response =
      await fetch(
        API_URL + path,
        {
          ...options,
          headers,

          /*
           * جلوگیری از reuse شدن
           * Responseهای قدیمی مرورگر.
           */

          cache: "no-store"
        }
      );

    const raw =
      await response.text();

    let data = {};

    try {
      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (_) {

      data = {
        message: raw
      };
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        (
          "HTTP " +
          response.status
        )
      );
    }

    return data;
  }


  /*
   * =========================================================
   * BACKEND HEALTH
   * =========================================================
   */

  async function checkBackend() {

    try {

      const result =
        await api("/");

      console.log(
        "Discovery API:",
        result
      );

      return true;

    } catch (error) {

      console.error(
        "Backend error:",
        error
      );

      setStatus(
        "🔴 اتصال به Discovery برقرار نشد",
        "error"
      );

      return false;
    }
  }


  /*
   * =========================================================
   * TELEGRAM AUTH
   * =========================================================
   */

  async function authenticateTelegram() {

    if (!tg) {
      return false;
    }

    const initData =
      tg.initData;

    if (!initData) {

      console.warn(
        "Telegram initData is empty"
      );

      return false;
    }

    try {

      const result =
        await api(
          "/auth/telegram",
          {
            method: "POST",

            body:
              JSON.stringify({
                initData
              })
          }
        );

      if (
        result &&
        result.authenticated
      ) {

        currentUser =
          result.user ||
          null;

        console.log(
          "Telegram authenticated:",
          currentUser
        );

        return true;
      }

      return false;

    } catch (error) {

      console.warn(
        "Telegram auth:",
        error
      );

      return false;
    }
  }


  /*
   * =========================================================
   * SESSION
   * =========================================================
   */

  function ensureSession() {

    if (!currentSessionId) {
      currentSessionId =
        makeUuid();
    }

    return currentSessionId;
  }


  /*
   * =========================================================
   * ACTIVE TAB
   * =========================================================
   */

  function setActiveTab(
    mode
  ) {

    feedBtn.classList.remove(
      "active"
    );

    trendBtn.classList.remove(
      "active"
    );

    exploreBtn.classList.remove(
      "active"
    );

    if (mode === "feed") {
      feedBtn.classList.add(
        "active"
      );
    }

    if (mode === "trending") {
      trendBtn.classList.add(
        "active"
      );
    }

    if (mode === "explore") {
      exploreBtn.classList.add(
        "active"
      );
    }
  }


  /*
   * =========================================================
   * FEED PATH
   * =========================================================
   */

  function getFeedPath(
    mode
  ) {

    const limit = 20;

    if (mode === "trending") {
      return (
        "/trending?limit=" +
        limit
      );
    }

    if (mode === "explore") {
      return (
        "/explore?limit=" +
        limit
      );
    }

    return (
      "/feed?limit=" +
      limit +
      "&session_id=" +
      encodeURIComponent(
        ensureSession()
      )
    );
  }


  /*
   * =========================================================
   * LOAD FEED
   * =========================================================
   */

  async function loadFeed(
    mode = "feed"
  ) {

    currentMode =
      mode;

    setActiveTab(
      mode
    );

    setStatus(
      "در حال دریافت محتوا..."
    );

    feedEl.innerHTML = `
      <div class="empty">
        در حال بارگذاری...
      </div>
    `;

    try {

      const path =
        getFeedPath(mode);

      const result =
        await api(path);

      feedItems =
        Array.isArray(
          result.items
        )
          ? result.items
          : [];

      renderFeed();

      if (
        feedItems.length
      ) {

        setStatus(
          "🟢 آماده",
          "success"
        );

      } else {

        setStatus(
          "🟡 هنوز محتوایی پیدا نشد"
        );
      }

    } catch (error) {

      console.error(
        "Feed error:",
        error
      );

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            دریافت محتوا ناموفق بود
          </strong>

          <div>
            ${escapeHtml(
              error.message ||
              "خطای نامشخص"
            )}
          </div>

        </div>
      `;

      setStatus(
        "🔴 خطا در دریافت محتوا",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * RENDER FEED
   * =========================================================
   */

  function renderFeed() {

    if (
      !feedItems.length
    ) {

      feedEl.innerHTML = `
        <div class="empty">
          هنوز محتوایی برای نمایش
          در Discovery وجود ندارد.
        </div>
      `;

      return;
    }

    feedEl.innerHTML =
      feedItems
        .map(
          function (item) {

            const id =
              String(
                item.id || ""
              );

            const safeId =
              escapeHtml(id);

            const title =
              escapeHtml(
                item.title ||
                "بدون عنوان"
              );

            const description =
              escapeHtml(
                item.description ||
                "توضیحی برای این محتوا ثبت نشده است."
              );

            const type =
              escapeHtml(
                item.content_type ||
                "content"
              );

            const reason =
              escapeHtml(
                item.reason ||
                item.explanation ||
                ""
              );

            const url =
              item.source_url
                ? String(
                    item.source_url
                  )
                : "";

            return `
              <article
                class="card"
                data-id="${safeId}"
              >

                <h2>
                  ${title}
                </h2>

                <p>
                  ${description}
                </p>

                <div class="meta">
                  ${type}
                </div>

                ${
                  reason
                    ? `
                      <div class="reason">
                        ${reason}
                      </div>
                    `
                    : ""
                }

                <div class="actions">

                  ${
                    url
                      ? `
                        <button
                          class="action primary js-open"
                          type="button"
                          data-id="${safeId}"
                          data-url="${escapeHtml(url)}"
                        >
                          🔗 مشاهده
                        </button>
                      `
                      : ""
                  }

                  <button
                    class="action js-save"
                    type="button"
                    data-id="${safeId}"
                  >
                    ⭐ ذخیره
                  </button>

                  <button
                    class="action js-dislike"
                    type="button"
                    data-id="${safeId}"
                  >
                    👎
                  </button>

                </div>

              </article>
            `;
          }
        )
        .join("");
  }


  /*
   * =========================================================
   * OPEN CONTENT
   * =========================================================
   */

  async function openContent(
    url,
    contentId,
    button
  ) {

    if (!url) {
      return;
    }

    if (button) {
      button.disabled = true;
    }

    try {

      await recordEvent(
        contentId,
        "VIEW",
        1,
        {
          source:
            "mini_app",
          url
        }
      );

    } catch (error) {

      console.warn(
        "View event:",
        error
      );
    }

    try {

      if (
        tg &&
        typeof tg.openLink ===
        "function"
      ) {

        tg.openLink(
          url
        );

        return;
      }

    } catch (error) {

      console.warn(
        "Telegram openLink:",
        error
      );

    } finally {

      if (button) {
        button.disabled = false;
      }
    }

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

    if (button) {
      button.disabled = false;
    }
  }


  /*
   * =========================================================
   * RECORD EVENT
   * =========================================================
   */

  async function recordEvent(
    contentId,
    eventType,
    value = 1,
    metadata = {}
  ) {

    if (!contentId) {
      throw new Error(
        "content_id is required"
      );
    }

    return api(
      "/event",
      {
        method: "POST",

        body:
          JSON.stringify({
            content_id:
              contentId,

            event_type:
              eventType,

            value:
              value,

            metadata:
              metadata,

            session_id:
              ensureSession()
          })
      }
    );
  }


  /*
   * =========================================================
   * SAVE
   * =========================================================
   */

  async function saveContent(
    contentId,
    button
  ) {

    if (!contentId) {
      return;
    }

    if (!currentUser) {

      setStatus(
        "ℹ️ کاربر Telegram احراز نشده است"
      );

      return;
    }

    if (button) {
      button.disabled = true;
    }

    try {

      const result =
        await api(
          "/save",
          {
            method: "POST",

            body:
              JSON.stringify({
                content_id:
                  contentId,

                user_id:
                  currentUser.id
              })
          }
        );

      if (
        result &&
        result.saved
      ) {

        if (button) {

          button.classList.add(
            "saved"
          );

          button.textContent =
            "✅ ذخیره شد";
        }

        setStatus(
          "⭐ ذخیره شد",
          "success"
        );
      }

    } catch (error) {

      console.error(
        "Save:",
        error
      );

      setStatus(
        "🔴 ذخیره ناموفق بود: " +
        (
          error.message ||
          "خطای نامشخص"
        ),
        "error"
      );

    } finally {

      if (button) {
        button.disabled = false;
      }
    }
  }


  /*
   * =========================================================
   * NOT INTERESTED
   * =========================================================
   */

  async function notInterested(
    contentId,
    button
  ) {

    if (!contentId) {
      return;
    }

    if (!currentUser) {

      setStatus(
        "ℹ️ کاربر Telegram احراز نشده است"
      );

      return;
    }

    if (button) {
      button.disabled = true;
    }

    try {

      const result =
        await api(
          "/feedback",
          {
            method: "POST",

            body:
              JSON.stringify({
                content_id:
                  contentId,

                user_id:
                  currentUser.id,

                feedback_type:
                  "not_interested"
              })
          }
        );

      if (
        result &&
        result.recorded
      ) {

        if (button) {

          button.classList.add(
            "disliked"
          );

          button.textContent =
            "✅ ثبت شد";
        }

        setStatus(
          "👍 بازخورد ثبت شد",
          "success"
        );

        /*
         * بعد از بازخورد منفی،
         * آیتم را از Feed فعلی حذف می‌کنیم.
         */

        feedItems =
          feedItems.filter(
            item =>
              String(item.id) !==
              String(contentId)
          );

        renderFeed();
      }

    } catch (error) {

      console.error(
        "Feedback:",
        error
      );

      setStatus(
        "🔴 ثبت بازخورد ناموفق بود: " +
        (
          error.message ||
          "خطای نامشخص"
        ),
        "error"
      );

    } finally {

      if (button) {
        button.disabled = false;
      }
    }
  }


  /*
   * =========================================================
   * SEARCH
   * =========================================================
   */

  async function doSearch() {

    const query =
      searchInput.value.trim();

    if (!query) {

      setStatus(
        "عبارت جستجو را وارد کن"
      );

      return;
    }

    setStatus(
      `🔎 جستجو برای «${query}»...`
    );

    feedEl.innerHTML = `
      <div class="empty">
        در حال جستجو...
      </div>
    `;

    try {

      const result =
        await api(
          "/search?q=" +
          encodeURIComponent(
            query
          ) +
          "&limit=20"
        );

      feedItems =
        Array.isArray(
          result.items
        )
          ? result.items
          : [];

      renderFeed();

      setStatus(
        feedItems.length
          ? `🔎 ${feedItems.length} نتیجه پیدا شد`
          : "🟡 نتیجه‌ای پیدا نشد",
        feedItems.length
          ? "success"
          : ""
      );

    } catch (error) {

      console.error(
        "Search:",
        error
      );

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            جستجو ناموفق بود
          </strong>

          <div>
            ${escapeHtml(
              error.message ||
              "خطای نامشخص"
            )}
          </div>

        </div>
      `;

      setStatus(
        "🔴 خطا در جستجو",
        "error"
      );
    }
  }


  /*
   * =========================================================
   * FEED CLICK DELEGATION
   *
   * مهم‌ترین اصلاح نسخه جدید:
   *
   * دیگر onclick="..."
   * داخل HTML نداریم.
   *
   * همه چیز از اینجا مدیریت می‌شود.
   * =========================================================
   */

  feedEl.addEventListener(
    "click",
    async function (event) {

      const button =
        event.target.closest(
          "button"
        );

      if (!button) {
        return;
      }

      const contentId =
        button.dataset.id ||
        button
          .closest(".card")
          ?.dataset.id ||
        "";

      /*
       * مشاهده
       */

      if (
        button.classList.contains(
          "js-open"
        )
      ) {

        const url =
          button.dataset.url ||
          "";

        await openContent(
          url,
          contentId,
          button
        );

        return;
      }

      /*
       * ذخیره
       */

      if (
        button.classList.contains(
          "js-save"
        )
      ) {

        await saveContent(
          contentId,
          button
        );

        return;
      }

      /*
       * عدم علاقه
       */

      if (
        button.classList.contains(
          "js-dislike"
        )
      ) {

        await notInterested(
          contentId,
          button
        );

        return;
      }

    }
  );


  /*
   * =========================================================
   * TAB EVENTS
   * =========================================================
   */

  feedBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "feed"
      );

    }
  );


  trendBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "trending"
      );

    }
  );


  exploreBtn.addEventListener(
    "click",
    function () {

      loadFeed(
        "explore"
      );

    }
  );


  /*
   * =========================================================
   * SEARCH EVENTS
   * =========================================================
   */

  searchBtn.addEventListener(
    "click",
    doSearch
  );


  searchInput.addEventListener(
    "keydown",
    function (event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        doSearch();
      }
    }
  );


  /*
   * =========================================================
   * DEBUG / VERSION
   * =========================================================
   */

  console.log(
    "Telegram Discovery:",
    APP_VERSION
  );


  /*
   * =========================================================
   * START APP
   * =========================================================
   */

  async function startApp() {

    /*
     * 1
     * Telegram
     */

    const telegramReady =
      await waitForTelegram();

    if (
      !telegramReady
    ) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            Telegram WebApp آماده نشد
          </strong>

          <div>
            برنامه را مستقیماً داخل Telegram باز کن.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 2
     * Session
     */

    ensureSession();


    /*
     * 3
     * Backend
     */

    setStatus(
      "در حال اتصال به Discovery..."
    );

    const backendOK =
      await checkBackend();

    if (!backendOK) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            Discovery API در دسترس نیست
          </strong>

          <div>
            اتصال به Backend برقرار نشد.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 4
     * Telegram Auth
     */

    setStatus(
      "در حال احراز هویت..."
    );

    const authenticated =
      await authenticateTelegram();

    if (!authenticated) {

      feedEl.innerHTML = `
        <div class="error-card">

          <strong>
            احراز هویت Telegram ناموفق بود
          </strong>

          <div>
            برنامه را از داخل Telegram باز کن.
          </div>

        </div>
      `;

      return;
    }


    /*
     * 5
     * Initial Feed
     */

    await loadFeed(
      "feed"
    );
  }


  /*
   * Start
   */

  startApp()
    .catch(
      function (error) {

        console.error(
          "Fatal startup error:",
          error
        );

        setStatus(
          "🔴 خطای راه‌اندازی برنامه",
          "error"
        );
      }
    );

})();
</script>

</body>
</html>
