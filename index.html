  padding:44px 20px;
  border:1px dashed var(--line-strong);
  border-radius:23px;
  color:var(--muted);
  background:rgba(255,255,255,.022);
  text-align:center;
}

.searchWelcomeGlyph{
  width:60px;
  height:60px;
  display:grid;
  place-items:center;
  margin-bottom:3px;
  border:1px solid var(--line);
  border-radius:21px;
  color:#79d1ff;
  background:linear-gradient(145deg,rgba(43,126,195,.22),rgba(91,69,175,.19));
  font-size:1.7rem;
}

.searchWelcome b{
  color:#f4f8fc;
  font-size:1rem;
}

.searchWelcome p{
  max-width:330px;
  margin:0;
  font-size:.78rem;
  line-height:1.85;
}

.quickSearches{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:7px;
  margin-top:7px;
}

.quickSearches button{
  min-height:44px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:999px;
  color:#c8d8e7;
  background:rgba(255,255,255,.035);
  font-size:.74rem;
  cursor:pointer;
}

.nav{
  position:relative;
  z-index:40;
  width:min(calc(100% - 24px),656px);
  height:var(--nav-h);
  min-height:var(--nav-h);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  margin:8px auto var(--safe-b);
  padding:5px;
  border:1px solid var(--line);
  border-radius:27px;
  background:rgba(12,27,44,.97);
  box-shadow:0 14px 38px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.04);
  backdrop-filter:blur(18px);
}

.nav button{
  position:relative;
  min-width:0;
  min-height:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:4px 3px 6px;
  border:0;
  border-radius:20px;
  color:var(--muted);
  background:transparent;
  font-size:.7rem;
  cursor:pointer;
}

.nav button span{
  display:grid;
  place-items:center;
}

.nav svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav button.active{
  color:#fff;
  background:linear-gradient(145deg,rgba(33,127,211,.52),rgba(35,86,151,.42));
}

.nav button.active:after{
  content:'';
  position:absolute;
  right:50%;
  bottom:3px;
  width:21px;
  height:2px;
  border-radius:999px;
  background:#4cc3ff;
  transform:translateX(50%);
}

.navBadge{
  position:absolute;
  top:5px;
  right:calc(50% - 21px);
  min-width:17px;
  height:17px;
  display:none;
  place-items:center;
  padding:0 4px;
  border:2px solid #0c1b2c;
  border-radius:999px;
  color:#fff;
  background:#ff4d72;
  font-size:.58rem;
  font-style:normal;
  line-height:1;
}

.navBadge.show{
  display:grid;
}

.back{
  position:fixed;
  inset:0;
  z-index:60;
  opacity:0;
  pointer-events:none;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(5px);
  transition:opacity .22s ease;
}

.back.show{
  opacity:1;
  pointer-events:auto;
}

.viewer{
  position:fixed;
  inset:0;
  z-index:61;
  width:min(100%,680px);
  height:var(--tg-viewport-stable-height,100dvh);
  margin:auto;
  padding:calc(var(--safe-t) + 10px) 0 var(--safe-b);
  overflow-x:hidden;
  overflow-y:auto;
  opacity:0;
  pointer-events:none;
  color:var(--text);
  background:#07111f;
  transform:translateY(18px) scale(.99);
  transition:opacity .22s ease,transform .22s ease;
}

.viewer.show{
  opacity:1;
  pointer-events:auto;
  transform:none;
}

.viewerMedia{
  position:relative;
  width:calc(100% - 28px);
  aspect-ratio:16/10;
  margin:0 auto;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:25px;
  background:linear-gradient(145deg,var(--vg1,#244e75),var(--vg2,#152d47));
  box-shadow:0 20px 48px rgba(0,0,0,.35);
}

.viewerMedia img,.viewerMedia video,.viewerMedia iframe{
  width:100%;
  height:100%;
  border:0;
  object-fit:contain;
  background:#050a11;
}

.close{
  position:absolute;
  top:12px;
  left:12px;
  z-index:4;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  padding:0;
  border:1px solid rgba(255,255,255,.2);
  border-radius:15px;
  color:#fff;
  background:rgba(5,15,26,.78);
  font-size:1.55rem;
  cursor:pointer;
}

.telegram-host .close{
  display:none;
}

.viewerBody{
  padding:17px 18px 28px;
}

.viewerChannel{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
  color:#7bc9f8;
  font-size:.84rem;
}

.viewerChannel .avatar{
  width:40px;
  height:40px;
  flex-basis:40px;
}

.viewerFollow{
  min-height:40px;
  margin-inline-start:auto;
  padding:0 13px;
  border:1px solid rgba(99,199,255,.28);
  border-radius:999px;
  color:#dff5ff;
  background:rgba(40,137,207,.14);
  cursor:pointer;
}

.viewerFollow.following{
  border-color:rgba(61,220,151,.28);
  color:#bff3dc;
  background:rgba(31,130,96,.16);
}

.viewer h3{
  margin:0;
  font-size:1.14rem;
  line-height:1.85;
}

.viewer h3:empty{
  display:none;
}

.desc{
  margin:10px 0 18px;
  color:#edf2f7;
  font-size:1rem;
  line-height:2;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}

.feedback{
  display:flex;
  gap:8px;
  padding:4px 0 16px;
  overflow-x:auto;
  scrollbar-width:none;
}

.feedback::-webkit-scrollbar{
  display:none;
}

.feedback button{
  min-height:44px;
  flex:0 0 auto;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  background:transparent;
  font-size:.82rem;
  cursor:pointer;
}

.actions{
  position:sticky;
  bottom:0;
  z-index:3;
  display:grid;
  grid-template-columns:minmax(0,1fr) 54px 54px;
  gap:8px;
  padding:18px 0 4px;
  background:linear-gradient(transparent,#07111f 32%);
}

.actions button{
  min-height:54px;
  border:1px solid var(--line);
  border-radius:17px;
  color:#fff;
  background:#172638;
  cursor:pointer;
}

.actions .primary{
  border:0;
  color:var(--accent-text);
  background:linear-gradient(145deg,#318fe6,#665be1);
  font-weight:850;
}

.telegram-host.native-main .actions{
  grid-template-columns:repeat(2,54px);
  justify-content:start;
}

.telegram-host.native-main .actions .primary{
  display:none;
}

.toast{
  position:fixed;
  right:50%;
  bottom:calc(var(--nav-h) + var(--safe-b) + 20px);
  z-index:90;
  max-width:calc(100% - 32px);
  padding:10px 16px;
  border:1px solid var(--line);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
  color:#fff;
  background:#14263a;
  box-shadow:0 10px 28px rgba(0,0,0,.34);
  transform:translate(50%,10px);
  transition:.2s ease;
  font-size:.8rem;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(50%,0);
}

.mode-hub .discover,.mode-hub .tabs,.mode-hub .searchbar,
.mode-history .discover,.mode-history .tabs,.mode-history .searchbar{
  display:none!important;
}

.mode-hub .head,.mode-history .head{
  margin-top:8px;
}

.mode-hub .grid,.mode-history .grid{
  grid-template-columns:minmax(0,1fr);
}

.hub{
  display:grid;
  gap:12px;
}

.hubHero,.hubPanel{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(16,35,56,.96),rgba(8,22,37,.96));
  box-shadow:0 12px 28px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.03);
}

.hubHero{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  background:
    radial-gradient(220px 130px at 100% 0,rgba(83,140,246,.2),transparent 72%),
    linear-gradient(145deg,#10243a,#091827);
}

.hubAvatar{
  width:54px;
  height:54px;
  flex:0 0 54px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.13);
  border-radius:19px;
  color:#fff;
  background:linear-gradient(145deg,#318fe6,#8c56dd);
  font-size:1.25rem;
  font-weight:900;
}

.hubIdentity{
  min-width:0;
}

.hubIdentity b{
  display:block;
  font-size:1rem;
}

.hubIdentity span,.hubHint{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:.73rem;
  line-height:1.7;
}

.hubStats{
  margin-inline-start:auto;
  text-align:center;
}

.hubStats b{
  display:block;
  color:#78d2ff;
  font-size:1.15rem;
}

.hubStats span{
  color:var(--muted);
  font-size:.66rem;
}

.hubQuick{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.hubQuick button,.hubButton{
  min-height:50px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:16px;
  color:#eef7ff;
  background:rgba(255,255,255,.035);
  cursor:pointer;
}

.hubQuick button{
  display:flex;
  align-items:center;
  gap:9px;
  text-align:right;
}

.hubQuick button b{
  color:#75cdfb;
  font-size:1rem;
}

.hubPanel{
  padding:14px;
}

.hubPanelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}

.hubPanelHead h3{
  margin:0;
  font-size:.94rem;
}

.hubPanelHead button{
  min-height:40px;
  padding:0 10px;
  border:0;
  border-radius:12px;
  color:#71ccff;
  background:rgba(80,158,217,.09);
  cursor:pointer;
}

.hubList{
  display:grid;
  gap:8px;
}

.hubRow{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:58px;
  padding:10px;
  border:1px solid rgba(153,195,231,.1);
  border-radius:15px;
  color:inherit;
  background:rgba(255,255,255,.022);
  text-align:right;
}

button.hubRow{
  width:100%;
  cursor:pointer;
}

.hubRowDot{
  width:9px;
  height:9px;
  flex:0 0 9px;
  border-radius:50%;
  background:#61758a;
}

.hubRowDot.unread{
  background:#4cc3ff;
  box-shadow:0 0 10px rgba(76,195,255,.6);
}

.hubRowCopy{
  min-width:0;
  flex:1;
}

.hubRowCopy b,.hubRowCopy span{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.hubRowCopy b{
  font-size:.8rem;
}

.hubRowCopy span{
  margin-top:4px;
  color:var(--muted);
  font-size:.69rem;
}

.topicPicker{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.topicChip{
  min-height:42px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  background:transparent;
  cursor:pointer;
}

.topicChip.selected{
  border-color:rgba(82,193,247,.35);
  color:#fff;
  background:rgba(36,137,205,.23);
}

.hubSave{
  width:100%;
  margin-top:11px;
  color:#fff;
  background:linear-gradient(145deg,#258edb,#5f60dc);
  font-weight:800;
}

.settingRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:48px;
  padding:8px 2px;
  border-bottom:1px solid rgba(153,195,231,.08);
  font-size:.78rem;
}

.settingRow:last-child{
  border-bottom:0;
}

.settingRow input{
  width:22px;
  height:22px;
  accent-color:#2fa4ec;
}

.creatorMetricGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}

.creatorCard{
  display:grid;
  gap:10px;
  padding:12px;
  border:1px solid rgba(153,195,231,.1);
  border-radius:16px;
  background:rgba(255,255,255,.02);
}

.creatorCardHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.creatorCardHead b{
  font-size:.82rem;
}

.creatorCardHead button{
  min-height:38px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:12px;
  color:#7ad2ff;
  background:transparent;
  cursor:pointer;
}

.creatorMetric{
  padding:10px 5px;
  border-radius:13px;
  background:rgba(255,255,255,.03);
  text-align:center;
}

.creatorMetric b,.creatorMetric span{
  display:block;
}

.creatorMetric b{
  color:#dff5ff;
  font-size:.88rem;
}

.creatorMetric span{
  margin-top:3px;
  color:var(--muted);
  font-size:.62rem;
}

.claimForm{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:7px;
  margin-top:10px;
}

.claimForm input{
  min-width:0;
  min-height:46px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:0;
  color:#fff;
  background:rgba(2,13,24,.5);
}

.claimForm button{
  min-height:46px;
  padding:0 14px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:#277ebf;
  cursor:pointer;
}

.hubEmpty{
  padding:12px 4px;
  color:var(--muted);
  font-size:.74rem;
  line-height:1.8;
  text-align:center;
}

@media(max-width:390px){
  .app{
    padding-right:12px;
    padding-left:12px;
  }

  .grid{
    gap:9px;
  }

  .copy{
    padding:10px 10px 12px;
  }

  .title{
    font-size:.82rem;
    line-height:1.74;
  }

  .hero .title{
    font-size:.96rem;
    line-height:1.86;
  }

  .mode-explore .app{
    padding-right:8px;
    padding-left:8px;
  }

  .mode-explore .grid{
    gap:8px;
  }

  .nav{
    width:calc(100% - 18px);
  }

  .nav button{
    font-size:.63rem;
  }
}

@media(max-width:340px){
  .grid,.mode-explore .grid{
    grid-template-columns:minmax(0,1fr);
  }

  .card.hero,.card.wide,.mode-explore .card.hero,.mode-explore .card.wide{
    grid-column:1;
  }

  .tabs{
    font-size:.78rem;
  }
}

@media(min-width:680px){
  .mode-explore .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .mode-explore .card.hero{
    grid-column:1/-1;
  }

  .mode-explore .card.wide{
    grid-column:span 2;
  }
}

@media(hover:hover){
  .card:hover .media{
    transform:scale(1.018);
  }

  .nav button:hover,.icon:hover,.feedback button:hover{
    background:rgba(255,255,255,.055);
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}

/* =========================================================
   TELEGRAM DISCOVERY — AURORA UI REDESIGN v1
   Visual-only override. Existing DOM, JS and APIs are preserved.
========================================================= */

:root{
  --bg:#050b14;
  --surface:#0b1522;
  --surface-strong:#0f1d2d;
  --surface-soft:#08111d;
  --text:#f6f8fb;
  --muted:#8293a8;
  --accent:#35a7ff;
  --accent-text:#fff;
  --cyan:#68d5ff;
  --violet:#8b72ff;
  --success:#49e6a5;
  --line:rgba(151,196,229,.13);
  --line-strong:rgba(151,205,242,.25);
  --shadow:
    0 18px 46px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.035);
  --radius-card:24px;
  --radius-hero:30px;
  --nav-h:76px;
}

/* ---------- global surface ---------- */

html{
  background:
    radial-gradient(680px 420px at 88% -12%,rgba(46,136,235,.24),transparent 68%),
    radial-gradient(560px 420px at -12% 62%,rgba(120,82,255,.14),transparent 70%),
    #050b14;
}

body{
  position:relative;
  background:
    radial-gradient(520px 300px at 95% -3%,rgba(63,153,255,.16),transparent 72%),
    radial-gradient(420px 340px at -12% 74%,rgba(123,89,255,.11),transparent 72%),
    linear-gradient(180deg,#07111d 0%,#050b14 100%);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.34),transparent 72%);
  z-index:0;
}

.app{
  position:relative;
}

/* Keep overlay elements out of the body grid. */
.back{
  position:fixed;
}

.viewer{
  position:fixed;
}

.toast{
  position:fixed;
}

.app{
  z-index:1;
  width:min(100%,700px);
  padding:
    calc(var(--safe-t) + 4px)
    clamp(12px,3.7vw,20px)
    26px;
  scrollbar-width:none;
}

.app::-webkit-scrollbar{
  display:none;
}

/* ---------- top ---------- */

.top{
  top:0;
  min-height:64px;
  gap:14px;
  margin:0 -4px;
  padding:7px 6px 12px;
  background:
    linear-gradient(180deg,rgba(5,11,20,.97) 58%,rgba(5,11,20,.72) 82%,transparent);
  backdrop-filter:blur(18px);
}

.brand{
  gap:12px;
}

.mark{
  width:50px;
  height:50px;
  flex-basis:50px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:
    radial-gradient(circle at 30% 18%,rgba(255,255,255,.35),transparent 25%),
    linear-gradient(145deg,#36a8ff 0%,#6a71f4 54%,#bc5adc 100%);
  box-shadow:
    0 13px 32px rgba(56,120,235,.28),
    inset 0 1px 0 rgba(255,255,255,.3);
}

h1{
  font-size:1.32rem;
  letter-spacing:-.02em;
}

.eyebrow{
  margin-top:5px;
  color:#8094a8;
  font-size:.75rem;
}

.status{
  min-height:40px;
  padding:0 12px;
  border-color:rgba(126,188,226,.15);
  color:#94a7ba;
  background:rgba(10,25,40,.66);
  box-shadow:inset 0 1px rgba(255,255,255,.025);
  backdrop-filter:blur(12px);
  font-size:.71rem;
}

/* ---------- search ---------- */

.searchbar{
  top:64px;
  min-height:56px;
  gap:5px;
  margin:2px 0 16px;
  padding:5px 6px;
  border-color:rgba(114,188,231,.18);
  border-radius:20px;
  background:
    linear-gradient(145deg,rgba(14,31,49,.92),rgba(8,20,33,.93));
  box-shadow:
    0 12px 28px rgba(0,0,0,.22),
    inset 0 1px rgba(255,255,255,.04);
  backdrop-filter:blur(20px);
}

.searchbar:focus-within{
  border-color:rgba(83,190,255,.48);
  box-shadow:
    0 0 0 3px rgba(53,167,255,.09),
    0 16px 35px rgba(0,0,0,.28);
}

.searchbar input{
  min-height:44px;
  padding:0 13px;
  font-size:.88rem;
}

.icon{
  width:42px;
  min-width:42px;
  min-height:42px;
  border-radius:14px;
  color:#72cfff;
  background:rgba(64,153,216,.07);
}

/* ---------- top tabs ---------- */

.tabs{
  min-height:52px;
  gap:4px;
  margin-bottom:18px;
  padding:4px;
  border-color:rgba(132,189,226,.13);
  border-radius:19px;
  background:rgba(4,13,23,.6);
  box-shadow:inset 0 1px rgba(255,255,255,.02);
}

.tab{
  min-height:44px;
  border-radius:15px;
  font-size:.8rem;
  font-weight:650;
}

.tab.active{
  color:#fff;
  background:
    linear-gradient(145deg,rgba(46,161,235,.9),rgba(57,115,211,.84));
  box-shadow:
    0 8px 20px rgba(36,131,211,.23),
    inset 0 1px rgba(255,255,255,.18);
}

/* ---------- section header ---------- */

.head{
  align-items:center;
  margin:0 3px 12px;
}

.head h2{
