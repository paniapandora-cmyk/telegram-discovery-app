<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telegram Discovery — Explore Next</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0d0f14);--bg2:var(--tg-theme-secondary-bg-color,#171b24);--text:var(--tg-theme-text-color,#f7f8fb);--muted:var(--tg-theme-hint-color,#9299aa);--accent:var(--tg-theme-button-color,#6078ff);--accentText:var(--tg-theme-button-text-color,#fff);--line:rgba(255,255,255,.08);--safeB:max(10px,var(--tg-safe-area-inset-bottom,0px));--safeT:max(10px,var(--tg-content-safe-area-inset-top,0px))}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 380px at 90% -100px,rgba(95,109,255,.18),transparent 60%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}.app{min-height:100svh;padding:calc(var(--safeT) + 10px) 12px calc(90px + var(--safeB))}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#667cff,#8d5cf6,#ff6fae);display:grid;place-items:center;font-size:20px;box-shadow:0 10px 28px rgba(94,92,246,.3)}h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}.status{font-size:11px;color:var(--muted);padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}.searchbar{position:sticky;top:var(--safeT);z-index:30;display:flex;gap:8px;margin-bottom:10px;padding:6px;border-radius:20px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px)}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--text);padding:0 15px;outline:none}.reload{width:48px;min-width:48px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--text)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.tab{border:0;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);min-height:40px;padding:0 15px;white-space:nowrap}.tab.active{background:var(--text);color:var(--bg);font-weight:900}.head{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 12px}.head h2{font-size:17px;margin:0}.head span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;min-height:190px;border:0;border-radius:22px;overflow:hidden;color:#fff;text-align:right;background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:0 14px 34px rgba(0,0,0,.23);cursor:pointer}.card.hero{grid-column:1/-1;min-height:246px}.card.tall{min-height:250px}.shade{position:absolute;inset:0;background:radial-gradient(220px 170px at 80% 10%,rgba(255,255,255,.22),transparent 60%),linear-gradient(to bottom,transparent 20%,rgba(0,0,0,.84) 100%)}.glyph{position:absolute;left:14px;top:14px;width:38px;height:38px;border-radius:13px;background:rgba(0,0,0,.24);display:grid;place-items:center;z-index:2}.save{position:absolute;right:12px;top:12px;width:42px;height:42px;border:0;border-radius:14px;background:rgba(0,0,0,.25);color:#fff;z-index:3}.save.saved{background:#fff;color:#111}.content{position:absolute;right:0;left:0;bottom:0;padding:15px;z-index:2}.channel{display:flex;align-items:center;gap:7px;font-size:10px;color:rgba(255,255,255,.8);margin-bottom:8px}.av{width:24px;height:24px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900}.title{font-size:14px;line-height:1.7;font-weight:900;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.hero .title{font-size:18px}.meta{font-size:10px;color:rgba(255,255,255,.68);margin-top:9px}.sk{height:210px;border-radius:22px;background:linear-gradient(100deg,var(--bg2),rgba(255,255,255,.08),var(--bg2));background-size:200% 100%;animation:p 1.2s infinite}@keyframes p{to{background-position:-200% 0}}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:22px;padding:42px 18px;text-align:center;color:var(--muted)}.nav{position:fixed;right:12px;left:12px;bottom:var(--safeB);height:66px;z-index:50;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 18px 45px rgba(0,0,0,.35)}.nav button{border:0;background:transparent;color:var(--muted);border-radius:16px;min-height:44px}.nav button.active{background:rgba(255,255,255,.06);color:var(--text)}.back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:.2s}.back.show{opacity:1;pointer-events:auto}.sheet{position:fixed;right:0;left:0;bottom:0;z-index:71;background:var(--bg2);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + var(--safeB));transform:translateY(105%);transition:.28s;max-height:84svh;overflow:auto}.sheet.show{transform:translateY(0)}.handle{width:42px;height:5px;background:rgba(255,255,255,.18);border-radius:9px;margin:0 auto 14px}.sheetHero{min-height:150px;border-radius:22px;padding:16px;background:linear-gradient(145deg,var(--sg1),var(--sg2));display:flex;align-items:end}.sheetHero h3{margin:0;font-size:18px;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:48px;border:0;border-radius:16px;background:rgba(255,255,255,.07);color:var(--text)}.actions .primary{background:var(--accent);color:var(--accentText);font-weight:900}.desc{font-size:13px;line-height:1.95;color:color-mix(in srgb,var(--text) 84%,var(--muted));white-space:pre-wrap;margin-top:12px}.feedback{display:flex;gap:8px;overflow:auto;margin-top:12px}.feedback button{min-height:42px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:0 13px;white-space:nowrap}@media(min-width:620px){.app{max-width:760px;margin:auto}.grid{grid-template-columns:repeat(3,1fr)}.card.hero{grid-column:span 2}.nav{max-width:520px;margin:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>کشف کن</h1><div class="sub">بهترین پست‌های تلگرام، برای تو</div></div></div><div class="status" id="status">در حال اتصال</div></header>
<div class="searchbar"><input id="search" type="search" placeholder="چی دوست داری کشف کنی؟" aria-label="جستجو"><button class="reload" id="reload" aria-label="تازه‌سازی">↻</button></div>
<div class="tabs"><button class="tab active" data-mode="feed">برای تو</button><button class="tab" data-mode="trending">ترندها</button><button class="tab" data-mode="explore">اکسپلور</button></div>
<div class="head"><h2 id="heading">پیشنهادهای تو</h2><span id="count">—</span></div><main class="grid" id="grid"></main>
</div>
<nav class="nav"><button class="active" data-nav="feed">⌂<br><small>برای تو</small></button><button data-nav="explore">◈<br><small>اکسپلور</small></button><button id="focusSearch">⌕<br><small>جستجو</small></button><button id="saved">♡<br><small>ذخیره‌ها</small></button></nav>
<div class="back" id="back"></div><section class="sheet" id="sheet"><div class="handle"></div><div class="sheetHero" id="sheetHero"><h3 id="sheetTitle"></h3></div><div class="row"><div><b id="sheetChannel"></b><div class="sub" id="sheetMeta"></div></div><button class="reload" id="sheetSave">♡</button></div><div class="actions"><button class="primary" id="openTg">باز کردن در تلگرام</button><button id="notInterested">علاقه ندارم</button></div><div class="desc" id="sheetDesc"></div><div class="feedback"><button data-feedback="not_relevant">مرتبط نبود</button><button data-feedback="hide_creator">این کانال کمتر</button><button data-feedback="report">گزارش</button></div></section>
<script>
(()=>{const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch{}const API=location.protocol.startsWith('http')?location.origin+'/api/discovery':'https://telegram-discovery-app.paniapandora.workers.dev/api/discovery';const S={mode:'feed',items:[],current:null,loading:false};const $=id=>document.getElementById(id),grid=$('grid'),heading=$('heading'),count=$('count'),status=$('status'),search=$('search');const pal=[['#4057d6','#7550d9'],['#0f766e','#22a06b'],['#b45309','#dc6b36'],['#9f2f6d','#6d3ecf'],['#2264a7','#2f8bb7'],['#744210','#b7791f']];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const hash=s=>[...String(s||'')].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0);const palette=i=>pal[Math.abs(hash(i.channel_username||i.creator_id||i.content_id))%pal.length];const txt=i=>(i.title||i.description||i.text||i.message||'پست تلگرام').trim();const channel=i=>i.channel_name||i.channel_title||i.channel_username||((String(i.source_url||i.url||'').match(/t\.me\/([^/]+)/)||[])[1])||'Telegram';const fmt=d=>{try{return d?new Intl.DateTimeFormat('fa-IR',{month:'short',day:'numeric'}).format(new Date(d)):'تلگرام'}catch{return'تلگرام'}};const icon=t=>({TEXT:'✦',IMAGE:'▧',VIDEO:'▶',DOCUMENT:'▤',AUDIO:'♪',MIXED:'◆'}[t]||'✦');const headers=()=>({'x-telegram-init-data':tg?.initData||'','content-type':'application/json'});async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{...headers(),...(o.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw Error(j.error||`HTTP ${r.status}`);return j}function sk(){grid.innerHTML=Array.from({length:8},(_,i)=>`<div class="sk ${i===0?'hero':''}"></div>`).join('')}function cls(i,n){if((n%7===0&&i.ui_meta?.quality_tier==='RICH')||(i.content_type==='VIDEO'&&n%5===0))return'hero';if(['IMAGE','VIDEO','DOCUMENT'].includes(i.content_type)&&n%3===1)return'tall';return''}function render(){count.textContent=`${S.items.length} محتوا`;if(!S.items.length){grid.innerHTML='<div class="empty">فعلاً چیزی پیدا نشد</div>';return}grid.innerHTML=S.items.map((i,n)=>{const [g1,g2]=palette(i),t=i.content_type||'TEXT';return`<article class="card ${cls(i,n)}" data-i="${n}" style="--g1:${g1};--g2:${g2}" tabindex="0"><div class="shade"></div><div class="glyph">${icon(t)}</div><button class="save ${i.is_saved?'saved':''}" data-save="${n}">${i.is_saved?'♥':'♡'}</button><div class="content"><div class="channel"><span class="av">${esc(channel(i).slice(0,1))}</span>${esc(channel(i))}</div><div class="title">${esc(txt(i))}</div><div class="meta">${esc(t)} · ${esc(fmt(i.published_at||i.date))}</div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-save]'))return;show(S.items[+c.dataset.i])});grid.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();saveItem(S.items[+b.dataset.save],b)})}async function load(mode=S.mode){if(S.loading)return;S.loading=true;S.mode=mode;sk();heading.textContent={feed:'پیشنهادهای تو',trending:'ترندهای امروز',explore:'چیزهای تازه برای کشف'}[mode];document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===mode));try{const p=mode==='feed'?'/feed?limit=30':mode==='trending'?'/trending?limit=30':'/explore?limit=30',d=await api(p);S.items=d.items||[];render();status.textContent='● آنلاین'}catch(e){grid.innerHTML=`<div class="empty">اتصال برقرار نشد<br><small>${esc(e.message)}</small></div>`;status.textContent='نیاز به اتصال'}finally{S.loading=false}}async function doSearch(q){q=q.trim();if(!q)return load(S.mode);sk();heading.textContent=`نتایج «${q}»`;try{const d=await api(`/search?q=${encodeURIComponent(q)}&limit=30`);S.items=d.items||[];render();status.textContent=d.source==='telegram_live'?'● جستجوی زنده تلگرام':'● جستجوی هوشمند'}catch(e){grid.innerHTML=`<div class="empty">جستجو انجام نشد</div>`}}async function saveItem(i,b){if(i.is_saved)return;try{await api('/save',{method:'POST',body:JSON.stringify({content_id:i.content_id||i.id})});i.is_saved=true;b&&b.classList.add('saved');b&&(b.textContent='♥');try{tg?.HapticFeedback?.notificationOccurred('success')}catch{}}catch{status.textContent='ذخیره نشد'}}function show(i){S.current=i;const [a,b]=palette(i);$('sheetHero').style.setProperty('--sg1',a);$('sheetHero').style.setProperty('--sg2',b);$('sheetTitle').textContent=txt(i);$('sheetChannel').textContent=channel(i);$('sheetMeta').textContent=`${i.content_type||'TELEGRAM'} · ${fmt(i.published_at||i.date)}`;$('sheetDesc').textContent=i.description||i.text||i.message||i.title||'';$('sheetSave').textContent=i.is_saved?'♥':'♡';$('back').classList.add('show');$('sheet').classList.add('show')}function hide(){$('back').classList.remove('show');$('sheet').classList.remove('show');S.current=null}async function feedback(t){if(!S.current)return;const cur=S.current;try{await api('/feedback',{method:'POST',body:JSON.stringify({content_id:cur.content_id||cur.id,creator_id:cur.creator_id,feedback_type:t})});S.items=S.items.filter(x=>x!==cur);hide();render()}catch{status.textContent='بازخورد ثبت نشد'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(b.dataset.mode));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>load(b.dataset.nav));$('reload').onclick=()=>load(S.mode);let timer;search.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>doSearch(search.value),420)};search.onkeydown=e=>{if(e.key==='Enter')doSearch(search.value)};$('focusSearch').onclick=()=>search.focus();$('saved').onclick=()=>status.textContent='ذخیره‌ها در نسخه بعدی';$('back').onclick=hide;$('sheetSave').onclick=()=>S.current&&saveItem(S.current,$('sheetSave'));$('openTg').onclick=()=>{const u=S.current?.source_url||S.current?.url||S.current?.link;if(u){try{tg?.openTelegramLink?.(u)||window.open(u,'_blank')}catch{window.open(u,'_blank')}}};$('notInterested').onclick=()=>feedback('not_interested');document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedback(b.dataset.feedback));load('feed')})();
</script>
</body>
</html>
