<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">

<title>Telegram Discovery</title>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f4f6f8 !important;
  color:#111827 !important;
  color-scheme:light;
}

body{
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

button{
  appearance:none;
  cursor:pointer;
  border:0;
}

button:disabled{
  opacity:.55;
  cursor:default;
}

.app{
  width:100%;
  max-width:720px;
  min-height:100vh;
  margin:0 auto;
  padding:
    max(18px,env(safe-area-inset-top))
    16px
    calc(24px + env(safe-area-inset-bottom));
}

.header{
  padding:8px 2px 16px;
}

.brand{
  font-size:28px;
  line-height:1.2;
  font-weight:800;
}

.subtitle{
  margin-top:6px;
  font-size:14px;
  opacity:.68;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  border-radius:15px;
  padding:13px 14px;
  font-size:15px;
  background:#fff;
  color:#111827;
}

.search button{
  border:0;
  border-radius:15px;
  padding:0 17px;
  background:#229ed9;
  color:#fff;
  font-weight:700;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.tab{
  border:0;
  border-radius:14px;
  padding:13px 7px;
  font-size:14px;
  background:#fff;
  color:#111827;
}

.tab.active{
  background:#229ed9;
  color:#fff;
}

.status{
  border-radius:14px;
  padding:11px 13px;
  margin-bottom:12px;
  font-size:13px;
  background:#fff;
  color:#111827;
}

.status.success{
  color:#16803c;
}

.status.error{
  color:#b00020;
}

.card{
  width:100%;
  margin-bottom:12px;
  padding:16px;
  border-radius:18px;
  background:#fff;
  color:#111827;
}

.card h2{
  margin:0 0 8px;
  font-size:18px;
  line-height:1.5;
}

.card p{
  margin:0 0 11px;
  font-size:14px;
  line-height:1.8;
  opacity:.78;
}

.meta{
  margin-bottom:12px;
  font-size:12px;
  opacity:.55;
}

.reason{
  margin-bottom:12px;
  font-size:11px;
  opacity:.45;
}

.actions{
  display:flex;
  gap:8px;
}

.action{
  flex:1;
  border:0;
  border-radius:12px;
  padding:11px 8px;
  font-size:13px;
  background:#eef2f7;
  color:#111827;
}

.action.primary{
  background:#229ed9;
  color:#fff;
}

.action.saved{
  background:#dff5e7;
  color:#16803c;
}

.action.disliked{
  background:#fde4e4;
  color:#b00020;
}

.empty{
  text-align:center;
  padding:50px 20px;
  font-size:14px;
  line-height:1.8;
  opacity:.65;
}

.error-card{
  border-radius:18px;
  padding:16px;
  background:#fff;
  color:#b00020;
}

.error-card strong{
  display:block;
  margin-bottom:8px;
}

.footer{
  text-align:center;
  margin-top:25px;
  font-size:11px;
  opacity:.45;
}

@media(max-width:380px){
  .brand{
    font-size:25px;
  }

  .tab{
    font-size:12px;
  }

  .search button{
    padding:0 13px;
  }

  .action{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">کشف</div>
    <div class="subtitle">
      محتوای جالب تلگرام را کشف کن
    </div>
  </header>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="جستجو..."
    >
    <button
      id="searchBtn"
      type="button"
    >
      جستجو
    </button>
  </div>

  <div class="tabs">

    <button
      id="feedBtn"
      class="tab active"
      type="button"
    >
      ✨ پیشنهادهای من
    </button>

    <button
      id="trendBtn"
      class="tab"
      type="button"
    >
      🔥 ترندها
    </button>

    <button
      id="exploreBtn"
      class="tab"
      type="button"
    >
      🧭 اکسپلور
    </button>

  </div>

  <div
    id="status"
    class="status"
  >
    در حال آماده‌سازی...
  </div>

  <main id="feed">
    <div class="empty">
      در حال آماده‌سازی Discovery...
    </div>
  </main>

  <div class="footer">
    Telegram Discovery · نسخه 0.2.2-feedback-fix
  </div>

</div>

<script>

(function(){

"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
  "https://jmxlwocemvjwkztbasja.supabase.co/functions/v1/discovery-api";


/* =========================================================
   STATE
========================================================= */

let tg = null;

let currentUser = null;

let currentSessionId =
  crypto?.randomUUID?.() ||
  String(Date.now());

let items = [];


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);

const statusEl =
  $("status");

const feedEl =
  $("feed");


/* =========================================================
   HELPERS
========================================================= */

function uuid(){

  if(
    crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return (
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
  ).replace(
    /[xy]/g,
    function(c){

      const r =
        Math.random() * 16 | 0;

      const v =
        c === "x"
          ? r
          : (r & 0x3 | 0x8);

      return v.toString(16);
    }
  );
}


function esc(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}


function setStatus(
  text,
  className = ""
){

  statusEl.textContent =
    text;

  statusEl.className =
    "status" +
    (
      className
        ? " " + className
        : ""
    );
}


/* =========================================================
   TELEGRAM
========================================================= */

function initTelegram(){

  tg =
    window.Telegram?.WebApp ||
    null;

  if(!tg){
    return false;
  }

  try{

    tg.ready();

    tg.expand();

    tg.setHeaderColor?.(
      "#f4f6f8"
    );

    tg.setBackgroundColor?.(
      "#f4f6f8"
    );

    tg.setBottomBarColor?.(
      "#f4f6f8"
    );

    return true;

  }catch(error){

    console.error(
      "Telegram init error:",
      error
    );

    return false;
  }
}


async function waitForTelegram(){

  for(
    let i = 0;
    i < 60;
    i++
  ){

    if(
      initTelegram() &&
      tg?.initData
    ){
      return true;
    }

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          100
        )
    );
  }

  return false;
}


/* =========================================================
   API
========================================================= */

async function api(
  path,
  options = {}
){

  const headers = {
    ...(options.headers || {})
  };

  if(
    options.body
  ){

    headers[
      "Content-Type"
    ] =
      "application/json";
  }

  if(
    tg?.initData
  ){

    headers[
      "X-Telegram-Init-Data"
    ] =
      tg.initData;
  }

  headers[
    "X-Request-ID"
  ] =
    uuid();


  const response =
    await fetch(
      API_URL + path,
      {
        ...options,
        headers,
        cache:
          "no-store"
      }
    );


  const text =
    await response.text();


  let data = {};


  try{

    data =
      text
        ? JSON.parse(text)
        : {};

  }catch{

    data = {
      message: text
    };
  }


  if(
    !response.ok
  ){

    throw new Error(
      data.error ||
      data.message ||
      `HTTP ${response.status}`
    );
  }


  return data;
}


/* =========================================================
   TELEGRAM AUTH
========================================================= */

async function authenticateTelegram(){

  if(
    !tg?.initData
  ){
    return false;
  }

  try{

    const result =
      await api(
        "/auth/telegram",
        {
          method:
            "POST",

          body:
            JSON.stringify({
              initData:
                tg.initData
            })
        }
      );


    if(
      result?.authenticated
    ){

      currentUser =
        result.user ||
        null;

      return true;
    }

  }catch(error){

    console.error(
      "Telegram auth:",
      error
    );
  }

  return false;
}


/* =========================================================
   TABS
========================================================= */

function setActiveTab(
  mode
){

  $("feedBtn")
    .classList
    .toggle(
      "active",
      mode === "feed"
    );

  $("trendBtn")
    .classList
    .toggle(
      "active",
      mode === "trending"
    );

  $("exploreBtn")
    .classList
    .toggle(
      "active",
      mode === "explore"
    );
}


/* =========================================================
   API PATH
========================================================= */

function getFeedPath(
  mode
){

  if(
    mode === "trending"
  ){

    return (
      "/trending?limit=20"
    );
  }


  if(
    mode === "explore"
  ){

    return (
      "/explore?limit=20"
    );
  }


  return (
    "/feed?limit=20" +
    "&session_id=" +
    encodeURIComponent(
      currentSessionId
    )
  );
}


/* =========================================================
   RENDER
   IMPORTANT:
   Backend uses content_id
========================================================= */

function render(){

  if(
    !items.length
  ){

    feedEl.innerHTML =
      `
      <div class="empty">
        هنوز محتوایی برای نمایش وجود ندارد.
      </div>
      `;

    return;
  }


  feedEl.innerHTML =
    items
      .map(
        function(item){

          /*
           * IMPORTANT FIX
           *
           * Backend:
           * content_id
           *
           * Not:
           * id
           */

          const contentId =
            String(
              item.content_id ||
              item.id ||
              ""
            );


          const title =
            esc(
              item.title ||
              "بدون عنوان"
            );


          const description =
            esc(
              item.description ||
              "توضیحی برای این محتوا ثبت نشده است."
            );


          const contentType =
            esc(
              item.content_type ||
              "content"
            );


          const reason =
            esc(
              item.reason ||
              item.explanation ||
              ""
            );


          const url =
            String(
              item.source_url ||
              item.url ||
              ""
            );


          return `
          <article
            class="card"
            data-content-id="${esc(contentId)}"
          >

            <h2>
              ${title}
            </h2>

            <p>
              ${description}
            </p>

            <div class="meta">
              ${contentType}
            </div>

            ${
              reason
                ? `
                  <div class="reason">
                    ${reason}
                  </div>
                `
                : ""
            }

            <div class="actions">

              ${
                url
                  ? `
                    <button
                      class="action primary js-open"
                      type="button"
                      data-content-id="${esc(contentId)}"
                      data-url="${esc(url)}"
                    >
                      🔗 مشاهده
                    </button>
                  `
                  : ""
              }


              <button
                class="action js-save"
                type="button"
                data-content-id="${esc(contentId)}"
              >
                ⭐ ذخیره
              </button>


              <button
                class="action js-dislike"
                type="button"
                data-content-id="${esc(contentId)}"
              >
                👎
              </button>

            </div>

          </article>
          `;
        }
      )
      .join("");
}


/* =========================================================
   LOAD FEED
========================================================= */

async function load(
  mode = "feed"
){

  setActiveTab(
    mode
  );


  setStatus(
    "در حال دریافت محتوا..."
  );


  feedEl.innerHTML =
    `
    <div class="empty">
      در حال بارگذاری...
    </div>
    `;


  try{

    const result =
      await api(
        getFeedPath(
          mode
        )
      );


    items =
      Array.isArray(
        result.items
      )
        ? result.items
        : [];


    render();


    setStatus(
      items.length
        ? "🟢 آماده"
        : "🟡 هنوز محتوایی پیدا نشد",
      items.length
        ? "success"
        : ""
    );


  }catch(error){

    console.error(
      "Feed error:",
      error
    );


    feedEl.innerHTML =
      `
      <div class="error-card">

        <strong>
          دریافت محتوا ناموفق بود
        </strong>

        <div>
          ${esc(
            error.message
          )}
        </div>

      </div>
      `;


    setStatus(
      "🔴 خطا در دریافت محتوا",
      "error"
    );
  }
}


/* =========================================================
   SAVE
========================================================= */

async function save(
  contentId,
  button
){

  if(
    !contentId
  ){

    console.warn(
      "SAVE: missing content_id"
    );

    setStatus(
      "🔴 شناسه محتوا پیدا نشد",
      "error"
    );

    return;
  }


  if(
    !currentUser
  ){

    setStatus(
      "🔴 احراز هویت Telegram انجام نشده",
      "error"
    );

    return;
  }


  button.disabled =
    true;


  try{

    /*
     * EXACT BACKEND PAYLOAD
     */

    const result =
      await api(
        "/save",
        {
          method:
            "POST",

          body:
            JSON.stringify({
              content_id:
                contentId,

              user_id:
                currentUser.id
            })
        }
      );


    if(
      result?.saved
    ){

      button
        .classList
        .add(
          "saved"
        );

      button.textContent =
        "✅ ذخیره شد";


      setStatus(
        "⭐ ذخیره شد",
        "success"
      );

    }

  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    setStatus(
      "🔴 ذخیره ناموفق بود: " +
      error.message,
      "error"
    );

  }finally{

    button.disabled =
      false;
  }
}


/* =========================================================
   NOT INTERESTED
========================================================= */

async function dislike(
  contentId,
  button
){

  if(
    !contentId
  ){

    console.warn(
      "FEEDBACK: missing content_id"
    );

    setStatus(
      "🔴 شناسه محتوا پیدا نشد",
      "error"
    );

    return;
  }


  if(
    !currentUser
  ){

    setStatus(
      "🔴 احراز هویت Telegram انجام نشده",
      "error"
    );

    return;
  }


  button.disabled =
    true;


  try{

    const result =
      await api(
        "/feedback",
        {
          method:
            "POST",

          body:
            JSON.stringify({

              content_id:
                contentId,

              user_id:
                currentUser.id,

              feedback_type:
                "not_interested"

            })
        }
      );


    if(
      result?.recorded
    ){

      button
        .classList
        .add(
          "disliked"
        );

      button.textContent =
        "✅ ثبت شد";


      items =
        items.filter(
          function(item){

            return String(
              item.content_id ||
              item.id ||
              ""
            ) !==
            String(
              contentId
            );
          }
        );


      render();


      setStatus(
        "👍 بازخورد ثبت شد",
        "success"
      );

    }

  }catch(error){

    console.error(
      "FEEDBACK ERROR:",
      error
    );


    setStatus(
      "🔴 ثبت بازخورد ناموفق بود: " +
      error.message,
      "error"
    );

  }finally{

    button.disabled =
      false;
  }
}


/* =========================================================
   VIEW EVENT
========================================================= */

async function sendEvent(
  contentId,
  eventType,
  value = 1,
  metadata = {}
){

  if(
    !contentId
  ){
    return;
  }


  return api(
    "/event",
    {
      method:
        "POST",

      body:
        JSON.stringify({

          content_id:
            contentId,

          event_type:
            eventType,

          value:
            value,

          metadata:
            metadata,

          session_id:
            currentSessionId

        })
    }
  );
}


/* =========================================================
   OPEN CONTENT
========================================================= */

async function openContent(
  contentId,
  url,
  button
){

  if(
    !url
  ){
    return;
  }


  button.disabled =
    true;


  try{

    /*
     * VIEW event should never
     * prevent opening the URL.
     */

    try{

      await sendEvent(
        contentId,
        "VIEW",
        1,
        {
          source:
            "mini_app",

          url:
            url
        }
      );

    }catch(error){

      console.warn(
        "VIEW event failed:",
        error
      );
    }


    if(
      tg?.openLink
    ){

      tg.openLink(
        url
      );

    }else{

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );
    }

  }finally{

    button.disabled =
      false;
  }
}


/* =========================================================
   SEARCH
========================================================= */

async function search(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(
    !query
  ){

    setStatus(
      "عبارت جستجو را وارد کن"
    );

    return;
  }


  setStatus(
    "🔎 در حال جستجو..."
  );


  try{

    const result =
      await api(
        "/search?q=" +
        encodeURIComponent(
          query
        ) +
        "&limit=20"
      );


    items =
      Array.isArray(
        result.items
      )
        ? result.items
        : [];


    render();


    setStatus(
      items.length
        ? `🔎 ${items.length} نتیجه پیدا شد`
        : "🟡 نتیجه‌ای پیدا نشد",

      items.length
        ? "success"
        : ""
    );


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );


    setStatus(
      "🔴 جستجو ناموفق بود: " +
      error.message,
      "error"
    );
  }
}


/* =========================================================
   IMPORTANT TELEGRAM WEBVIEW HANDLER
========================================================= */

/*
 * We deliberately use pointerup instead of relying
 * only on click/bubbling.
 *
 * We also read content_id from:
 *
 * 1. button.dataset.contentId
 * 2. parent .card dataset
 *
 * This fixes the previous bug where item.id was empty.
 */

feedEl.addEventListener(
  "pointerup",
  async function(event){

    const button =
      event.target.closest(
        "button"
      );


    if(
      !button
    ){
      return;
    }


    const contentId =
      button.dataset.contentId ||
      button
        .closest(".card")
        ?.dataset
        .contentId ||
      "";


    if(
      !contentId
    ){

      console.warn(
        "CLICK WITHOUT content_id",
        button
      );

      return;
    }


    event.preventDefault();

    event.stopPropagation();


    /* ⭐ SAVE */

    if(
      button.classList.contains(
        "js-save"
      )
    ){

      await save(
        contentId,
        button
      );

      return;
    }


    /* 👎 DISLIKE */

    if(
      button.classList.contains(
        "js-dislike"
      )
    ){

      await dislike(
        contentId,
        button
      );

      return;
    }


    /* 🔗 OPEN */

    if(
      button.classList.contains(
        "js-open"
      )
    ){

      await openContent(
        contentId,
        button.dataset.url ||
        "",
        button
      );

      return;
    }

  },
  true
);


/* =========================================================
   TAB EVENTS
========================================================= */

$("feedBtn")
  .addEventListener(
    "click",
    function(){

      load(
        "feed"
      );

    }
  );


$("trendBtn")
  .addEventListener(
    "click",
    function(){

      load(
        "trending"
      );

    }
  );


$("exploreBtn")
  .addEventListener(
    "click",
    function(){

      load(
        "explore"
      );

    }
  );


/* =========================================================
   SEARCH EVENTS
========================================================= */

$("searchBtn")
  .addEventListener(
    "click",
    search
  );


$("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        search();
      }

    }
  );


/* =========================================================
   START
========================================================= */

async function start(){

  /*
   * Telegram must be available.
   */

  if(
    !await waitForTelegram()
  ){

    setStatus(
      "🔴 برنامه را از داخل Telegram باز کن",
      "error"
    );

    return;
  }


  /*
   * API health check
   */

  try{

    await api(
      "/"
    );

  }catch(error){

    console.error(
      "API health:",
      error
    );

    setStatus(
      "🔴 Discovery API در دسترس نیست",
      "error"
    );

    return;
  }


  /*
   * Telegram authentication
   */

  if(
    !await authenticateTelegram()
  ){

    setStatus(
      "🔴 احراز هویت Telegram ناموفق بود",
      "error"
    );

    return;
  }


  /*
   * Initial feed
   */

  await load(
    "feed"
  );
}


start()
.catch(
  function(error){

    console.error(
      "START ERROR:",
      error
    );

    setStatus(
      "🔴 خطای راه‌اندازی",
      "error"
    );

  }
);

})();
</script>
